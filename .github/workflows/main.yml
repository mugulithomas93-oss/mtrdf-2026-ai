name: Build and Verify MTRDF AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Verify MTRDF AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: |
          flutter pub get

      - name: Analyze Application
        run: |
          flutter analyze --no-pub --no-fatal-infos || true

      - name: Run Tests
        run: |
          if [ -d test ] && find test -name '*_test.dart' | grep -q .; then
            flutter test || true
          else
            echo "No tests found - skipping test step."
          fi

      - name: Ensure Android project exists
        run: |
          flutter create --platforms=android . || true

      - name: Build Android APK
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
