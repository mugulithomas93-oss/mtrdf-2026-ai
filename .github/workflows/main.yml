name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false
      - name: Restore V14.4 GREEN code
        run: |
          rm -rf build
          flutter clean || true
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite || true
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          version: 14.6.0+54
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.1.9
            archive: ^3.6.1
            syncfusion_flutter_pdf: ^28.2.7
            hive_flutter: ^1.1.0
            share_plus: ^12.0.2
          flutter:
            uses-material-design: true
          YAML
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'dart:convert';

          String extractDocx(List<int> bytes) {
            try {
              final archive = ZipDecoder().decodeBytes(bytes);
              for (final f in archive) {
                if (f.name == 'word/document.xml') {
                  final xml = utf8.decode(f.content as List<int>);
                  return RegExp(r'<w:t[^>]*>([^<]+)</w:t>')
                      .allMatches(xml)
                      .map((m) => m.group(1) ?? '')
                      .join(' ');
                }
              }
              return "No xml";
            } catch (e) {
              return "Error $e";
            }
          }

          String extractPdf(List<int> bytes) {
            try {
              final doc = PdfDocument(inputBytes: bytes);
              final t = PdfTextExtractor(doc).extractText();
              doc.dispose();
              return t.isEmpty ? "Scanned PDF" : t;
            } catch (e) {
              return "PDF $e";
            }
          }

          String snippet(String c, String q) {
            final low = c.toLowerCase();
            int pos = low.indexOf(q.toLowerCase());
            if (pos == -1) {
              final kws = q.toLowerCase().split(RegExp(r'\s+')).where((w) => w.length > 2);
              for (var k in kws) {
                int x = low.indexOf(k);
                if (x != -1) {
                  pos = x;
                  break;
                }
              }
            }
            if (pos == -1) return c.length > 500 ? c.substring(0, 500) + "..." : c;
            int s = pos - 200;
            if (s < 0) s = 0;
            int e = pos + 500;
            if (e > c.length) e = c.length;
            String t = c.substring(s, e);
            if (s > 0) t = "..." + t;
            if (e < c.length) t = t + "...";
            return t;
          }

          bool matches(String content, String query, String subject) {
            final low = content.toLowerCase();
            final qq = query.toLowerCase().trim();
            if (qq.isEmpty) return false;
            if (subject.toLowerCase() == "biology" && qq.startsWith("define ")) {
              String target = qq.replaceAll("define ", "").trim();
              if (target.length > 2 && low.contains("geography") && !low.contains(target)) {
                return false;
              }
            }
            if (low.contains(qq)) return true;
            for (var k in qq.split(RegExp(r'\s+'))) {
              if (k.length > 2 && low.contains(k)) return true;
            }
            return false;
          }

          Widget highlight(String text, String query) {
            final low = text.toLowerCase();
            final kws = query.toLowerCase().split(RegExp(r'\s+')).where((w) => w.length > 2).toList();
            if (kws.isEmpty) return Text(text);
            String? best;
            int bestPos = -1;
            for (var k in kws) {
              int p = low.indexOf(k);
              if (p != -1 && (bestPos == -1 || p < bestPos)) {
                bestPos = p;
                best = k;
              }
            }
            if (best == null) return Text(text);
            List<TextSpan> spans = [];
            int idx = 0;
            while (true) {
              int p = low.indexOf(best, idx);
              if (p == -1) {
                spans.add(TextSpan(text: text.substring(idx)));
                break;
              }
              if (p > idx) spans.add(TextSpan(text: text.substring(idx, p)));
              spans.add(TextSpan(
                  text: text.substring(p, p + best.length),
                  style: TextStyle(backgroundColor: Colors.yellow, fontWeight: FontWeight.bold)));
              idx = p + best.length;
            }
            return RichText(
                text: TextSpan(style: TextStyle(color: Colors.black87), children: spans));
          }

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Hive.initFlutter();
            await Hive.openBox('mtrdf_v14');
            runApp(App());
          }

          class App extends StatelessWidget {
            @override
            Widget build(BuildContext c) {
              return MaterialApp(debugShowCheckedModeBanner: false, home: Tabs());
            }
          }

          class Tabs extends StatefulWidget {
            @override
            State<Tabs> createState() => _TabsS();
          }

