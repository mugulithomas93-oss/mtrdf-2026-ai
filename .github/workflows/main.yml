name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Recreate FIXED SPACE
        run: flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
      - name: Fix SDK
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          cat android/app/build.gradle.kts | grep compileSdk
      - name: Pubspec
        run: |
          cat > pubspec.yaml <<'YAML'
          name: mtrdf_2026_ai
          version: 14.18.7+71
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.1.9
            archive: ^3.6.1
            syncfusion_flutter_pdf: ^28.2.7
            hive_flutter: ^1.1.0
            connectivity_plus: ^6.0.5
            http: ^1.2.2
            share_plus: ^12.0.2
          flutter:
            uses-material-design: true
          YAML
      - name: Write main.dart VERIFIED COMPILE
        run: |
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'package:http/http.dart' as http;
          import 'package:share_plus/share_plus.dart';
          import 'dart:convert';
          String extractDocx(List<int> b){
            try{
              final a=ZipDecoder().decodeBytes(b);
              for(final f in a){
                if(f.name=='word/document.xml'){
                  final x=utf8.decode(f.content as List<int>);
                  return x.replaceAll(RegExp(r'<[^>]+>'), ' ').substring(0, x.length>2000?2000:x.length);
                }
              }
              return 'No xml';
            }catch(e){return 'Err';}
          }
          String extractPdf(List<int> b){
            try{
              final d=PdfDocument(inputBytes:b);
              final t=PdfTextExtractor(d).extractText();
              d.dispose();
              return t.isEmpty?'Scanned':t;
            }catch(e){return 'PDF Err';}
          }
          Future<List<Map<String,String>>> fetchWiki(String term) async {
            List<Map<String,String>> o=[];
            try{
              String title=term.trim().isEmpty?'History':term.trim();
              final u=Uri.parse('https://en.wikipedia.org/api/rest_v1/page/summary/'+Uri.encodeComponent(title));
              final r=await http.get(u,headers:{'User-Agent':'MTRDF/1.0'}).timeout(Duration(seconds:15));
              if(r.statusCode==200){
                final d=jsonDecode(r.body);
                String ex=(d['extract']??'').toString();
                if(ex.length>20) o.add({'title':'WIKIPEDIA: '+(d['title']??title).toString(),'snip':ex,'source':'wiki','url':'https://en.wikipedia.org/wiki/'+Uri.encodeComponent(title)});
              }
            }catch(e){}
            return o;
          }
          Future<List<Map<String,String>>> fetchDuck(String term) async {
            List<Map<String,String>> o=[];
            try{
              final u=Uri.parse('https://api.duckduckgo.com/?q='+Uri.encodeComponent(term)+'&format=json&pretty=1&no_html=1');
              final r=await http.get(u).timeout(Duration(seconds:15));
              if(r.statusCode==200){
                final d=jsonDecode(r.body);
                String at=(d['AbstractText']??'').toString();
                if(at.length>30) o.add({'title':'GOOGLE: '+(d['Heading']??term).toString(),'snip':at,'source':'google','url':(d['AbstractURL']??'').toString()});
              }
            }catch(e){}
            return o;
          }
          Future<List<Map<String,String>>> fetchYT(String term) async {
            List<Map<String,String>> o=[];
            o.add({'title':'YOUTUBE: '+term,'snip':'Open YouTube: https://www.youtube.com/results?search_query='+term,'source':'youtube','url':'https://www.youtube.com/results?search_query='+Uri.encodeComponent(term)});
            return o;
          }
          Future<List<Map<String,String>>> fetchAll(String q) async {
            String clean=q.toLowerCase().replaceAll('define ','').replaceAll('what is ','').trim();
            if(clean.isEmpty) clean='history';
            List<Map<String,String>> all=[];
            var w=await fetchWiki(clean);
            all.addAll(w);
            var d=await fetchDuck(clean);
            all.addAll(d);
            var y=await fetchYT(clean);
            all.addAll(y);
            if(all.isEmpty) all.add({'title':'WIKIPEDIA: History','snip':'History is past events. Offline docs work at 0 B/S','source':'wiki','url':''});
            return all;
          }
          Future<void> saveHist(String q,String resp,String src) async {
            try{
              final box=Hive.box('mtrdf_v14');
              String? h=box.get('search_history');
              List<Map<String,String>> hist=[];
              if(h!=null) hist=List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e)));
              hist.insert(0,{'query':q,'response':resp,'source':src,'time':DateTime.now().toIso8601String()});
              if(hist.length>100) hist=hist.sublist(0,100);
              box.put('search_history',jsonEncode(hist));
            }catch(e){}
          }
          Future<List<Map<String,String>>> getHist() async {
            try{
              final box=Hive.box('mtrdf_v14');
              String? h=box.get('search_history');
              if(h!=null) return List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e)));
            }catch(e){}
            return [];
          }
          String snippet(String c,String q){
            if(c.isEmpty) return '';
            final low=c.toLowerCase();
            int p=low.indexOf(q.toLowerCase());
            if(p<0) return c.length>400?c.substring(0,400)+'...':c;
            int s=p-100; if(s<0) s=0;
            int e=p+300; if(e>c.length) e=c.length;
            return c.substring(s,e);
          }
          bool matches(String c,String q){
            if(c.isEmpty||q.isEmpty) return false;
            return c.toLowerCase().contains(q.toLowerCase());
          }
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Hive.initFlutter();
            await Hive.openBox('mtrdf_v14');
            runApp(App());
          }
          class App extends StatelessWidget{
            @override Widget build(BuildContext c){return MaterialApp(debugShowCheckedModeBanner:false,home:Tabs());}
          }
          class Tabs extends StatefulWidget{
            @override State<Tabs> createState()=>_TabsS();
          }
          class _TabsS extends State<Tabs>{
            int i=0;
            final pages=[Home(),DocsPage(),ResearchPage(),OnlineHubPage()];
            @override Widget build(BuildContext c){
              return Scaffold(
                body:pages[i],
                bottomNavigationBar:BottomNavigationBar(
                  type:BottomNavigationBarType.fixed,
                  currentIndex:i,
                  selectedItemColor:Colors.green,
                  onTap:(x)=>setState(()=>i=x),
                  items:[
                    BottomNavigationBarItem(icon:Icon(Icons.school),label:'Subjects'),
                    BottomNavigationBarItem(icon:Icon(Icons.folder),label:'My Docs'),
                    BottomNavigationBarItem(icon:Icon(Icons.search),label:'Research'),
                    BottomNavigationBarItem(icon:Icon(Icons.public),label:'Online AI')
                  ]
                )
              );
            }
          }
          class Home extends StatelessWidget{
            @override Widget build(BuildContext c){
              final subs=['Mathematics','Biology','Chemistry','Physics','History','Geography','English','Agriculture'];
              return Scaffold(appBar:AppBar(title:Text('MTRDF V14.18.7 GREEN'),backgroundColor:Colors.green,foregroundColor:Colors.white),body:ListView.builder(padding:EdgeInsets.all(12),itemCount:subs.length,itemBuilder:(_,j){return Card(child:ListTile(title:Text(subs[j]),subtitle:Text('Offline+Google+YouTube+Wiki'),onTap:()=>Navigator.push(c,MaterialPageRoute(builder:(_)=>ChatPage(subject:subs[j])))));}));
            }
          }
          class DocsPage extends StatefulWidget{
            @override State<DocsPage> createState()=>_DocsS();
          }
          class _DocsS extends State<DocsPage>{
            List<Map<String,String>> docs=[];
            @override void initState(){super.initState();ld();}
            Future<void> ld() async {
              final p=await SharedPreferences.getInstance();
              String? s=p.getString('mtrdf_docs_v10');
              if(s!=null) setState(()=>docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))));
            }
            Future<void> sv() async {
              final p=await SharedPreferences.getInstance();
              p.setString('mtrdf_docs_v10',jsonEncode(docs));
            }
            Future<void> pk() async {
              try{
                FilePickerResult? r=await FilePicker.platform.pickFiles(type:FileType.custom,allowedExtensions:['docx','pdf'],withData:true);
                if(r!=null&&r.files.first.bytes!=null){
                  String n=r.files.first.name;
                  List<int> by=r.files.first.bytes!.toList();
                  String t=n.toLowerCase().endsWith('.pdf')?extractPdf(by):extractDocx(by);
                  setState(()=>docs.add({'name':n,'content':t}));
                  sv();
                }
              }catch(e){}
            }
            @override Widget build(BuildContext c){
              return Scaffold(appBar:AppBar(title:Text('My Docs '+docs.length.toString()),backgroundColor:Colors.green,foregroundColor:Colors.white),body:docs.isEmpty?Center(child:Text('No docs')):ListView.builder(padding:EdgeInsets.all(12),itemCount:docs.length,itemBuilder:(_,j){return Card(child:ListTile(title:Text(docs[j]['name']??''),subtitle:Text((docs[j]['content']??'').length.toString())));}),floatingActionButton:FloatingActionButton(onPressed:pk,child:Icon(Icons.add)));
            }
          }
          class ResearchPage extends StatefulWidget{
            const ResearchPage({super.key});
            @override State<ResearchPage> createState()=>_ResS();
          }
          class _ResS extends State<ResearchPage>{
            final ctrl=TextEditingController();
            List<Map<String,String>> res=[];
            bool searching=false;
            Future<void> sr(String q) async {
              if(q.trim().isEmpty) return;
              setState(()=>searching=true);
              final p=await SharedPreferences.getInstance();
              String? s=p.getString('mtrdf_docs_v10');
              List<Map<String,String>> ds=[];
              if(s!=null) ds=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)));
              List<Map<String,String>> r=[];
              for(var d in ds){if(matches(d['content']??'',q)) r.add({'title':'FROM DOC: '+(d['name']??''),'snip':snippet(d['content']??'',q),'source':'local','url':''});}
              var o=await fetchAll(q);
              r.addAll(o);
              if(o.isNotEmpty) saveHist(q,o.map((e)=>e['title']!+': '+e['snip']!).join('\n---\n'),o.first['source']??'online');
              setState(()=>{res=r,searching=false});
            }
            @override Widget build(BuildContext c){
              return Scaffold(appBar:AppBar(title:Text('Research'),backgroundColor:Colors.blue,foregroundColor:Colors.white),body:Column(children:[Padding(padding:EdgeInsets.all(12),child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'Search docs + Google + Wiki...',border:OutlineInputBorder()),onSubmitted:sr)),searching?LinearProgressIndicator():SizedBox(),Expanded(child:ListView.builder(padding:EdgeInsets.all(12),itemCount:res.length,itemBuilder:(_,i){var r=res[i];return Card(child:ListTile(title:Text(r['title']??''),subtitle:Text((r['snip']??'')+'\n'+(r['url']??'')),trailing:IconButton(icon:Icon(Icons.share),onPressed:()=>Share.share((r['title']??'')+'\n'+(r['snip']??'')))));}))]));
            }
          }
          class OnlineHubPage extends StatefulWidget{
            @override State<OnlineHubPage> createState()=>_OnlineS();
          }
          class _OnlineS extends State<OnlineHubPage>{
            final ctrl=TextEditingController();
            List<Map<String,String>> results=[];
            bool searching=false;
            Future<void> doSearch(String q,{String mode='all'}) async {
              if(q.trim().isEmpty) return;
              setState(()=>{searching=true,results=[]});
              List<Map<String,String>> r=[];
              if(mode=='all'||mode=='wikipedia'){var w=await fetchWiki(q);r.addAll(w);}
              if(mode=='all'||mode=='google'){var g=await fetchDuck(q);r.addAll(g);}
              if(mode=='all'||mode=='youtube'){var y=await fetchYT(q);r.addAll(y);}
              if(r.isNotEmpty) saveHist(q,r.map((e)=>e['title']!+': '+e['snip']!).join('\n'),mode);
              setState(()=>{results=r,searching=false});
            }
            @override Widget build(BuildContext c){
              return Scaffold(appBar:AppBar(title:Text('ONLINE AI HUB'),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white),body:Column(children:[Padding(padding:EdgeInsets.all(8),child:Column(children:[TextField(controller:ctrl,decoration:InputDecoration(hintText:'Ask Google YouTube Wiki...',border:OutlineInputBorder())),SizedBox(height:8),Row(children:[Expanded(child:ElevatedButton(onPressed:()=>doSearch(ctrl.text,mode:'wikipedia'),child:Text('WIKI'))),SizedBox(width:4),Expanded(child:ElevatedButton(onPressed:()=>doSearch(ctrl.text,mode:'google'),child:Text('GOOGLE'))),SizedBox(width:4),Expanded(child:ElevatedButton(onPressed:()=>doSearch(ctrl.text,mode:'youtube'),child:Text('YOUTUBE'))),SizedBox(width:4),Expanded(child:ElevatedButton(onPressed:()=>doSearch(ctrl.text,mode:'all'),child:Text('ALL')))]),searching?LinearProgressIndicator():SizedBox()])),Expanded(child:ListView.builder(padding:EdgeInsets.all(12),itemCount:results.length,itemBuilder:(_,i){var r=results[i];return Card(child:ListTile(title:Text(r['title']??''),subtitle:Text((r['snip']??'')+'\n'+(r['url']??'')),trailing:IconButton(icon:Icon(Icons.edit),onPressed:(){final tec=TextEditingController(text:r['snip']??'');showDialog(context:c,builder:(_)=>AlertDialog(title:Text('Edit & Save'),content:TextField(controller:tec,maxLines:5),actions:[TextButton(onPressed:()=>Navigator.pop(c),child:Text('Cancel')),TextButton(onPressed:(){setState(()=>results[i]['snip']=tec.text);saveHist(ctrl.text,tec.text,'edited');Navigator.pop(c);},child:Text('Save'))]));}));}))]));
            }
          }
          class ChatPage extends StatefulWidget{
            final String subject;
            const ChatPage({super.key,required this.subject});
            @override State<ChatPage> createState()=>_ChatS();
          }
          class _ChatS extends State<ChatPage>{
            final ctrl=TextEditingController();
            List<Map<String,String>> msgs=[{'role':'ai','text':'V14.18.7 GREEN - Google YouTube Wiki Save Edit'}];
            List<Map<String,String>> myDocs=[];
            bool sending=false;
            @override void initState(){super.initState();ld();}
            Future<void> ld() async {
              final p=await SharedPreferences.getInstance();
              String? s=p.getString('mtrdf_docs_v10');
              if(s!=null) setState(()=>myDocs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))));
            }
            Future<void> send() async {
              if(ctrl.text.isEmpty) return;
              String q=ctrl.text;
              setState(()=>{msgs.add({'role':'user','text':q}),sending=true});
              ctrl.clear();
              String off='';
              for(var d in myDocs){if(matches(d['content']??'',q)) off+='FROM '+(d['name']??'')+': '+snippet(d['content']??'',q)+'\n\n';}
              var on=await fetchAll(q);
              String comb=off;
              for(var r in on){comb+=r['title']!+'\n'+(r['snip']??'')+'\n'+(r['url']??'')+'\n\n';}
              setState(()=>{msgs.add({'role':'ai','text':comb}),sending=false});
              saveHist(q,comb,'chat');
            }
            @override Widget build(BuildContext c){
              return Scaffold(appBar:AppBar(title:Text(widget.subject),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white),body:Column(children:[Expanded(child:ListView.builder(padding:EdgeInsets.all(12),itemCount:msgs.length,itemBuilder:(_,i){var m=msgs[i];bool u=m['role']=='user';return Align(alignment:u?Alignment.centerRight:Alignment.centerLeft,child:Container(margin:EdgeInsets.all(4),padding:EdgeInsets.all(12),decoration:BoxDecoration(color:u?Colors.deepPurple:Colors.grey[200],borderRadius:BorderRadius.circular(12)),child:Text(m['text']??'')));})),sending?LinearProgressIndicator():SizedBox(),Padding(padding:EdgeInsets.all(8),child:Row(children:[Expanded(child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'Ask...',border:OutlineInputBorder(borderRadius:BorderRadius.circular(20))),onSubmitted:(_)=>send())),IconButton(icon:Icon(Icons.send),onPressed:send)]))]));
            }
          }
          DART
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Build APK
        run: flutter build apk --release --verbose
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MTRDF-V14-18-7-ANALYZED
          path: build/app/outputs/flutter-apk/app-release.apk
