on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Recreate
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          rm -rf test
      - name: Fix SDK
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          grep -q "INTERNET" android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml
      - name: Pubspec
        run: |
          cat > pubspec.yaml <<'YAML'
          name: mtrdf_2026_ai
          version: 15.3.0+101
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.3.10
            archive: ^3.6.1
            syncfusion_flutter_pdf: ^28.2.12
            hive_flutter: ^1.1.0
            http: ^1.6.0
            share_plus: ^12.0.2
            path_provider: ^2.1.2
          flutter:
            uses-material-design: true
          YAML
      - name: Write main.dart
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'package:http/http.dart' as http;
          import 'package:share_plus/share_plus.dart';
          import 'package:path_provider/path_provider.dart';
          String extractDocx(List<int> b){try{final a=ZipDecoder().decodeBytes(b);for(final f in a){if(f.name=='word/document.xml'){return utf8.decode(f.content as List<int>).replaceAll(RegExp(r'<[^>]+>'),' ');}}return '';}catch(e){return '';}}
          String extractPdf(List<int> b){try{final d=PdfDocument(inputBytes:b);final t=PdfTextExtractor(d).extractText();d.dispose();return t;}catch(e){return '';}}
          String decodeHtml(String t){return t.replaceAll('&amp;','&').replaceAll('&#039;',"'").replaceAll('&quot;','"').replaceAll(RegExp(r'<[^>]+>'),'');}
          String cleanAscii(String t){return t.replaceAll(RegExp(r'[^\x00-\x7F]'),'');}
          String extractCoreTopic(String input){
            String s=input.toLowerCase();
            s=s.replaceAll(RegExp(r'^(give me|i need|provide|list|show me|what are|what is|tell me about|explain|define|describe|discuss|state|outline|differentiate|difference)\s+'),'');
            s=s.replaceAll(RegExp(r'\d+\s*points?.*?for\s+'),'');
            s=s.replaceAll(RegExp(r'\d+\s*importances?\s+of\s+'),'importance of ');
            s=s.replaceAll(RegExp(r'importances?\s+of\s+studying\s+'),'importance of ');
            s=s.replaceAll(RegExp(r'importances?\s+of\s+'),'importance of ');
            s=s.replaceAll(RegExp(r'\d+\s*points?'),'');
            s=s.replaceAll(RegExp(r'well explained|with examples|with example|in table format|in a table|table format|detailed|elaborate|according to uneb|according to|for s\d+|for primary|uneb|exam format'),'');
            s=s.replaceAll(RegExp(r'\s+'),' ').trim();
            if(s.startsWith('of ')) s=s.substring(3);
            if(s.endsWith(' and')) s=s.substring(0,s.length-4).trim();
            if(s.isEmpty) return 'geography';
            return s;
          }
          Map<String,dynamic> parseInstructions(String input){
            String l=input.toLowerCase(); int points=6;
            var m=RegExp(r'(\d+)\s*points?').firstMatch(l);
            if(m!=null) points=int.tryParse(m.group(1)!)??6;
            if(points>20) points=20;
            return {'points':points,'core':extractCoreTopic(input)};
          }
          List<Map<String,String>> getPointsForCore(String core,int need){
            String l=core.toLowerCase();
            if(l.contains('weather')&&l.contains('climate')){
              return [
                {'title':'Definition of Weather','exp':'Weather is daily atmospheric condition at a specific time. Short term hours to days.','ex':'Today Kampala rainy 24C, tomorrow sunny 28C.'},
                {'title':'Definition of Climate','exp':'Climate is average weather over 30-35 years. Long term stable.','ex':'Uganda tropical modified by altitude mean 22C.'},
                {'title':'Time Period','exp':'Weather short hours/days, climate long 30 plus years.','ex':'Weather morning rain, climate March-May rains every year.'},
                {'title':'Elements','exp':'Both have temperature, rainfall, humidity, wind. Weather instant, climate average.','ex':'Weather today 28C, climate Gulu average 25C.'},
                {'title':'Change','exp':'Weather changes quickly, climate stable year to year.','ex':'Weather sunny to storm in 2 hours, Kabale climate cool 18C always.'},
                {'title':'Importance of Weather','exp':'Daily activities, travel, farming that day, aviation.','ex':'Farmers harvest maize after checking weather.'},
                {'title':'Importance of Climate','exp':'Determines crops, animals, settlement, economy.','ex':'Karamoja dry for cattle, Buganda wet for matooke.'},
                {'title':'UNEB Table','exp':'Weather short vs Climate long, Weather changes vs Climate stable.','ex':'Draw 2 column table with Uganda examples.'},
              ].take(need).toList();
            }
            if(l.contains('river')){
              return [
                {'title':'Definition of a River','exp':'A river is natural flowing water from highland to lowland into lake or sea.','ex':'River Nile from Lake Victoria Jinja to Lake Albert.'},
                {'title':'Transport','exp':'Cheap water transport for people and goods.','ex':'Boats on Nile to Murchison Falls.'},
                {'title':'Fishing','exp':'Fish for food and income.','ex':'Pakwach fishermen catch Nile perch.'},
                {'title':'Hydro Power','exp':'Water for hydro electric dams.','ex':'Bujagali dam on Nile powers Kampala.'},
                {'title':'Irrigation','exp':'Water for crops and domestic use.','ex':'Farmers in Arua irrigate using River Ege.'},
                {'title':'Tourism','exp':'Rafting, sport fishing, scenery.','ex':'Rafting on Nile Jinja earns dollars.'},
                {'title':'Settlement','exp':'People settle near rivers for fertile soils.','ex':'Jinja town grew near Nile.'},
                {'title':'UNEB Tip','exp':'Define 2 marks, importance 5 marks with Uganda examples.','ex':'Table Importance Example Location.'},
              ].take(need).toList();
            }
            if(l.contains('lake')){
              return [
                {'title':'Definition of a Lake','exp':'A lake is large inland standing water surrounded by land in a basin.','ex':'Lake Victoria largest tropical lake in Africa.'},
                {'title':'Formation','exp':'Tectonic depression, volcanic crater, river damming.','ex':'Lake Albert rift valley western Uganda.'},
                {'title':'Types in Uganda','exp':'Natural Victoria Kyoga Albert Edward Bunyonyi, Artificial Mburo.','ex':'Lake Bunyonyi Kabale crater lake.'},
                {'title':'Transport','exp':'Cheap water transport.','ex':'MV Kalangala Entebbe to Kalangala.'},
                {'title':'Fishing','exp':'Fish protein and income.','ex':'Nile perch sold in Kampala markets.'},
                {'title':'Tourism and Power','exp':'Tourism and hydro power water.','ex':'Nalubaale power station Jinja uses Lake Victoria.'},
                {'title':'Challenges','exp':'Pollution, overfishing, water hyacinth.','ex':'Hyacinth blocks boats on Victoria.'},
                {'title':'UNEB Tip','exp':'Define 2, types 3, importance 5 with Uganda examples.','ex':'Table Type Example Location.'},
              ].take(need).toList();
            }
            if(l.contains('geography')&&(l.contains('importance')||l.contains('studying')||l.contains('study'))){
              return [
                {'title':'Understanding Environment','exp':'Helps understand landforms, climate, vegetation and human life.','ex':'Kabale students understand cold due to altitude.'},
                {'title':'Agriculture','exp':'Helps choose crops according to climate and soils.','ex':'Buganda matooke wet climate, Karamoja cattle dry.'},
                {'title':'Planning','exp':'Helps plan roads, towns, water, schools.','ex':'Kampala-Gulu road planned by geography.'},
                {'title':'Tourism','exp':'Promotes tourism through lakes, mountains, parks.','ex':'Rwenzori and Bunyonyi attract tourists.'},
                {'title':'Disaster Management','exp':'Predict floods, landslides, droughts.','ex':'Bududa landslide prone areas learned.'},
                {'title':'Patriotism','exp':'Love Uganda, know resources, protect environment.','ex':'Learners plant trees along Nile.'},
                {'title':'Jobs Skills','exp':'Mapping, GIS, environmental jobs.','ex':'Jobs in UNMA, NEMA using geography.'},
                {'title':'UNEB Tip','exp':'Give 5 points each with Uganda example, no definition.','ex':'Point Explanation Example table.'},
              ].take(need).toList();
            }
            return [];
          }
          Future<List<Map<String,String>>> searchWikiSmart(String q) async {
            List<Map<String,String>> r=[]; String core=extractCoreTopic(q);
            String term=core.replaceAll('importance of ','').replaceAll('importance','').trim(); if(term.isEmpty) term=core;
            try{
              final u=Uri.parse('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&format=json&titles='+Uri.encodeComponent(term));
              final resp=await http.get(u,headers:{'User-Agent':'MTRDF/1.0'}).timeout(Duration(seconds:5));
              if(resp.statusCode==200){ final d=jsonDecode(resp.body); var pages=d['query']?['pages']; if(pages!=null){ for(var k in pages.keys){ String ex=cleanAscii(decodeHtml((pages[k]['extract']??'').toString())); if(ex.length>50){ r.add({'title':core,'snip':ex.length>700?ex.substring(0,700):ex,'source':'Wikipedia'}); break; } } } }
            }catch(e){}
            if(r.isEmpty&&term.contains(' ')){ String sc=term.split(' ').last; try{ final u=Uri.parse('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&format=json&titles='+Uri.encodeComponent(sc)); final resp=await http.get(u,headers:{'User-Agent':'MTRDF/1.0'}).timeout(Duration(seconds:5)); if(resp.statusCode==200){ final d=jsonDecode(resp.body); var pages=d['query']?['pages']; if(pages!=null){ for(var k in pages.keys){ String ex=cleanAscii(decodeHtml((pages[k]['extract']??'').toString())); if(ex.length>50){ r.add({'title':core,'snip':ex.length>700?ex.substring(0,700):ex,'source':'Wikipedia'}); break; } } } } }catch(e){} }
            if(r.isEmpty){ try{ final u2=Uri.parse('https://lite.duckduckgo.com/lite/?q='+Uri.encodeComponent(core)); final resp2=await http.get(u2,headers:{'User-Agent':'Mozilla/5.0'}).timeout(Duration(seconds:5)); if(resp2.statusCode==200){ var matches=RegExp(r'class=.result-snippet.[^>]*>(.*?)</td>').allMatches(resp2.body); for(var m in matches.take(3)){ String snip=cleanAscii(decodeHtml(m.group(1)??'')); if(snip.length>40) r.add({'title':core,'snip':snip,'source':'Web Search'}); } } }catch(e){} }
            if(core.contains('weather')||core.contains('climate')||core.contains('temperature')){ try{ final u3=Uri.parse('https://api.open-meteo.com/v1/forecast?latitude=0.3476&longitude=32.5825&current_weather=true'); final resp3=await http.get(u3).timeout(Duration(seconds:3)); if(resp3.statusCode==200){ var cw=jsonDecode(resp3.body)['current_weather']; if(cw!=null) r.add({'title':'Live Satellite','snip':'Temperature '+cw['temperature'].toString()+'C Wind '+cw['windspeed'].toString()+' km/h Time '+cw['time'].toString(),'source':'Satellite'}); } }catch(e){} }
            return r;
          }
          List<Map<String,String>> wikiToPoints(List<Map<String,String>> wiki,String core,int need){
            List<Map<String,String>> pts=[];
            if(wiki.isEmpty){ return [{'title':'Definition of '+core,'exp':core+' is important in Uganda curriculum.','ex':'UNEB examines with Uganda examples.'},{'title':'How it Works','exp':'Key steps bring change to useful product.','ex':'Rubber + sulfur + heat = tyre.'},{'title':'Importance in Uganda','exp':'Jobs and durable materials.','ex':'Tyres shoes for boda bodas.'},{'title':'Everyday Example','exp':'Things seen daily.','ex':'Car tyre in Kampala.'},{'title':'UNEB Tip','exp':'Define 2, process 3, example 2.','ex':'Write definition first.'},{'title':'Conclusion','exp':'Therefore '+core+' important for Uganda.','ex':'Revise with My Docs.'}].take(need).toList(); }
            for(var w in wiki){ if(pts.length>=need) break; String snip=cleanAscii(w['snip']??''); String src=w['source']??'Wikipedia'; if(src.contains('Satellite')){ pts.add({'title':'Live Satellite Weather','exp':snip,'ex':'Open-Meteo Kampala'}); continue; } List<String> sents=snip.split(RegExp(r'\.\s+')).where((s)=>s.trim().length>30).toList(); if(sents.isEmpty) sents=[snip]; for(var s in sents){ if(pts.length>=need) break; pts.add({'title':s.trim().split(' ').take(5).join(' '),'exp':s.trim(),'ex':'Source: '+src}); } }
            if(pts.length>=3&&pts.length<need) pts.add({'title':'Conclusion on '+core,'exp':'In summary '+core+' important in Uganda.','ex':'Geography helps Kabale farmers.'});
            return pts;
          }
          bool isStopWord(String w){ const stops=['between','difference','importance','give','points','with','examples','the','and','for','uneb','table','what','are','is','of','a','in','on','to']; return stops.contains(w.toLowerCase()); }
          Future<Map<String,dynamic>> deepResearchFormatted(String q,String subject,List<Map<String,String>> myDocs,List<Map<String,dynamic>> ctx) async {
            var instr=parseInstructions(q); String core=instr['core'];
            if(ctx.isNotEmpty){ String last=ctx.last['core']??''; if(core.length<4&&last.isNotEmpty){ core=last; instr['core']=last; } }
            int need=instr['points']; List<Map<String,String>> wiki=[]; try{ wiki=await searchWikiSmart(q); }catch(e){}
            List<Map<String,String>> points=getPointsForCore(core,need); if(points.isEmpty) points=wikiToPoints(wiki,core,need);
            List<Map<String,String>> docMatches=[];
            if(myDocs.isNotEmpty){ String lc=core.toLowerCase(); List<String> kws=lc.split(' ').where((w)=>w.length>3&&!isStopWord(w)).toList(); if(kws.isEmpty) kws=[lc]; for(var d in myDocs){ String content=(d['content']??'').toLowerCase(); int mc=0; for(var kw in kws){ if(content.contains(kw)) mc++; } bool strong=kws.length>=2?mc>=2:mc>=1; if(content.contains(lc)) strong=true; if(strong){ String full=d['content']??''; int pos=-1; for(var kw in kws){ pos=content.indexOf(kw); if(pos!=-1) break; } String snip=full; if(pos!=-1){ int st=pos-150; if(st<0) st=0; int en=pos+350; if(en>full.length) en=full.length; snip=full.substring(st,en); } docMatches.add({'title':d['name']??'Doc','snip':snip,'source':'My Docs'}); } } }
            return {'results':wiki,'points':points,'instr':instr,'core':core,'myDocs':docMatches};
          }
          Future<String> exportToPdfFile(String core,List<Map<String,String>> points,String intro) async { try{ final doc=PdfDocument(); final page=doc.pages.add(); final font=PdfStandardFont(PdfFontFamily.helvetica,11); String text=core.toUpperCase()+'\n\n'+intro+'\n\n'; for(int i=0;i<points.length;i++){ text+=(i+1).toString()+'. '+points[i]['title']!+'\n'+points[i]['exp']!+'\nEx: '+points[i]['ex']!+'\n\n'; } page.graphics.drawString(text,font,bounds:Rect.fromLTWH(0,0,page.getClientSize().width,page.getClientSize().height)); final bytes=await doc.save(); doc.dispose(); final dir=await getTemporaryDirectory(); final file=File(dir.path+'/MTRDF_'+core.replaceAll(' ','_')+'.pdf'); await file.writeAsBytes(bytes); return file.path; }catch(e){ return ''; } }
          String _xmlEsc(String t){ return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }
          Future<String> generateDocxReport(String title,List<Map<String,String>> sections,List
