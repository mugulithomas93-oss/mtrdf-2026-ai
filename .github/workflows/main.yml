name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Recreate
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          rm -rf test
      - name: Fix SDK
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          grep -q "INTERNET" android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml
      - name: Pubspec
        run: |
          cat > pubspec.yaml <<'YAML'
          name: mtrdf_2026_ai
          version: 14.29.0+87
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.3.10
            archive: ^3.6.1
            syncfusion_flutter_pdf: ^28.2.12
            hive_flutter: ^1.1.0
            http: ^1.6.0
            share_plus: ^12.0.2
            url_launcher: ^6.3.3
          flutter:
            uses-material-design: true
          YAML
      - name: Write main.dart FIXED DOLLAR AND TABLE
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'package:http/http.dart' as http;
          import 'package:share_plus/share_plus.dart';
          import 'package:url_launcher/url_launcher.dart';

          String extractDocx(List<int> b){try{final a=ZipDecoder().decodeBytes(b);for(final f in a){if(f.name=='word/document.xml'){return utf8.decode(f.content as List<int>).replaceAll(RegExp(r'<[^>]+>'),' ');}}return '';}catch(e){return '';}}
          String extractPdf(List<int> b){try{final d=PdfDocument(inputBytes:b);final t=PdfTextExtractor(d).extractText();d.dispose();return t;}catch(e){return '';}}
          String decodeHtml(String t){return t.replaceAll('&amp;','&').replaceAll('&#039;',"'").replaceAll('&quot;','"').replaceAll('&#39;',"'").replaceAll(RegExp(r'<[^>]+>'),'');}
          String fixTypos(String q){var s=q.toLowerCase();s=s.replaceAll('importantantances','importance').replaceAll('importantances','importance');return s;}

          String extractCoreTopic(String input){
            String s=fixTypos(input.toLowerCase());
            s=s.replaceAll(RegExp(r'^(give me|i need|provide|list|show me|what are|what is|tell me about|explain|define|describe|discuss|state|outline)\s+'), '');
            s=s.replaceAll(RegExp(r'\d+\s*points?.*?for\s+'), '');
            s=s.replaceAll(RegExp(r'\d+\s*importances?\s+of\s+'), 'importance of ');
            s=s.replaceAll(RegExp(r'\d+\s*points?'), '');
            s=s.replaceAll(RegExp(r'well explained|with examples|with example|in table format|in a table|table format|detailed|elaborate|according to uneb|according to|for s\d+|for s\.?\d+|for primary|for s1|s2|s3|s4|s6|uneb|exam format'), '');
            s=s.replaceAll(RegExp(r'\s+'), ' ').trim();
            if(s.startsWith('of ')) s=s.substring(3);
            if(s.isEmpty) return 'geography';
            return s;
          }

          Map<String, List<Map<String,String>>> curriculumDB={
            'importance of geography':[
              {'title':'Understanding Physical Environment','exp':'Helps understand landforms, mountains, lakes, rivers and climate.','ex':'Rwenzori Mountains, Lake Victoria Basin, Rift Valley.'},
              {'title':'Weather and Agriculture Link','exp':'Farmers need rainfall knowledge to plant.','ex':'Long rains March-May for maize.'},
              {'title':'Population and Settlement','exp':'Explains why people live in certain areas.','ex':'Dense in Buganda, Kigezi highlands fertile soils.'},
              {'title':'Natural Resources','exp':'Identifies minerals, forests, water.','ex':'Copper Kilembe, oil Albertine, Mabira forest.'},
              {'title':'Environmental Conservation','exp':'Teaches deforestation, pollution, conservation.','ex':'Bwindi gorillas, wetlands.'},
              {'title':'Map Reading Skills','exp':'Read maps, compass, GPS.','ex':'Topo maps of Kampala.'},
              {'title':'Career Opportunities','exp':'Jobs like meteorologist, surveyor, planner.','ex':'UNMA forecasters, Lands surveyors.'},
              {'title':'International Trade','exp':'Global trade, ports, routes.','ex':'Coffee via Mombasa, EAC trade.'},
              {'title':'Disaster Management','exp':'Predict floods, landslides.','ex':'Bududa landslides.'},
              {'title':'Tourism Development','exp':'Promotes attractions.','ex':'Queen Elizabeth NP, Source of Nile.'},
            ],
            'importance of tourism in uganda':[
              {'title':'Foreign Exchange Earnings','exp':'Top foreign exchange earner, brings dollars.','ex':'In 2023, 1.5M tourists brought 1.6B USD, more than coffee.'},
              {'title':'Employment Creation','exp':'Creates jobs for guides, hotel staff, drivers, rangers.','ex':'Over 500,000 Ugandans employed in tourism.'},
              {'title':'Infrastructure Development','exp':'Leads to roads, airports, hotels, lodges in remote areas.','ex':'Upgraded roads to Bwindi, Kihihi airstrip.'},
              {'title':'Conservation of Wildlife','exp':'Revenue funds protection of endangered species.','ex':'Gorilla trekking 800 USD per permit funds Bwindi rangers.'},
              {'title':'Cultural Preservation','exp':'Promotes traditional dances, crafts, kingdoms.','ex':'Ndere Centre, Buganda Kasubi tombs.'},
              {'title':'Market for Local Products','exp':'Tourists buy crafts, coffee, artworks.','ex':'Banana fibre crafts Buhoma, barkcloth.'},
              {'title':'Government Revenue','exp':'Taxes, park entry fees, licenses.','ex':'UWA collects fees for national budget.'},
              {'title':'International Relations','exp':'Improves Uganda image as Pearl of Africa.','ex':'Visit Uganda campaigns.'},
              {'title':'Education and Research','exp':'Sites used for study tours, research.','ex':'Makerere research Kibale forest, S1 trips Source of Nile.'},
              {'title':'Development of Remote Areas','exp':'Brings development to rural areas.','ex':'Bwindi area now has schools, clinics due to gorilla tourism.'},
              {'title':'Diversification of Economy','exp':'Reduces over-dependence on agriculture.','ex':'Tourism contributes 7.7 percent to GDP.'},
              {'title':'Promotion of Peace','exp':'Peaceful environment needed for tourists.','ex':'Peace in north allowed Kidepo tourism.'},
            ],
            'location of lake victoria':[
              {'title':'Geographical Position','exp':'Located in East Africa, south of Equator, coordinates 1S, 33E.','ex':'Lies across equator, both hemispheres.'},
              {'title':'Countries Sharing','exp':'Shared by Tanzania 49 percent, Uganda 45 percent, Kenya 6 percent.','ex':'Uganda Kampala Entebbe Jinja, Tanzania Mwanza, Kenya Kisumu.'},
              {'title':'Size','exp':'Largest in Africa, 2nd largest freshwater world: 59,947 km2, 359km long.','ex':'Bigger than Rwanda and Burundi combined.'},
              {'title':'Source of Nile','exp':'White Nile starts at Jinja, discovered by John Speke 1858.','ex':'Ripon Falls, Owen Falls Dam, Jinja.'},
              {'title':'Economic Importance','exp':'Fishing, transport, hydro power, water supply.','ex':'Nile perch fishing, MV Kalangala ferry, 200k jobs.'},
              {'title':'Islands','exp':'84 plus islands, Ssese Islands in Uganda.','ex':'Bugala Island, Kalangala district tourism.'},
            ],
          };

          Map<String,dynamic> parseInstructions(String input){
            String l=input.toLowerCase();
            int points=10;
            var m=RegExp(r'(\d+)\s*points?').firstMatch(l);
            if(m!=null){ points=int.tryParse(m.group(1)!)??10; }
            if(points>20) points=20;
            bool needExamples=l.contains('example');
            bool needDetailed=l.contains('well explained')||l.contains('detailed')||l.contains('explain');
            bool needTable=l.contains('table');
            String level='S2-S4';
            if(l.contains('s1')) level='S1';
            if(l.contains('s2')) level='S2';
            if(l.contains('s3')||l.contains('s4')) level='S3-S4';
            if(l.contains('s6')) level='S6';
            bool uneb=l.contains('uneb');
            String core=extractCoreTopic(input);
            return {'points':points,'examples':needExamples,'detailed':needDetailed,'table':needTable,'level':level,'uneb':uneb,'core':core,'original':input};
          }

          List<Map<String,String>> getPointsForCore(String core, int needPoints){
            String l=core.toLowerCase();
            List<Map<String,String>> points=[];
            for(var k in curriculumDB.keys){
              if(l.contains(k)||k.contains(l)|| (l.contains('tourism')&&k.contains('tourism'))){
                points=List.from(curriculumDB[k]!);
                break;
              }
            }
            if(points.isEmpty){
              if(l.contains('tourism')){
                points=List.from(curriculumDB['importance of tourism in uganda']!);
              } else if(l.contains('lake victoria')){
                points=List.from(curriculumDB['location of lake victoria']!);
              } else if(l.contains('geography')){
                points=List.from(curriculumDB['importance of geography']!);
              } else {
                points=[
                  {'title':'Definition of ' + core,'exp':'Explains meaning and background of ' + core + ' in Uganda context.','ex':'In Uganda, ' + core + ' is common.'},
                  {'title':'Economic Importance','exp':core + ' contributes to income and GDP.','ex':'Many earn from ' + core + ' in central region.'},
                  {'title':'Social Benefits','exp':core + ' improves social life.','ex':'Communities around Kampala benefit.'},
                  {'title':'Environmental Aspect','exp':'Relates to environment conservation.','ex':'In Queen Elizabeth NP, managed sustainably.'},
                  {'title':'Educational Value','exp':'Studied in schools.','ex':'S2 students learn about ' + core + '.'},
                  {'title':'Employment','exp':'Creates jobs.','ex':'Jobs linked to ' + core + '.'},
                  {'title':'Government Role','exp':'Government policies support it.','ex':'Ministry supports ' + core + '.'},
                  {'title':'Challenges','exp':'Problems like funding, awareness.','ex':'Challenges include limited infrastructure.'},
                  {'title':'Solutions','exp':'Solutions include training, funding.','ex':'UWA training guides to improve.'},
                  {'title':'Future Prospects','exp':'Future bright with technology.','ex':'Vision 2040 includes ' + core + '.'},
                ];
              }
            }
            while(points.length<needPoints){ points.addAll(List.from(points)); }
            return points.take(needPoints).toList();
          }

          Future<List<Map<String,String>>> searchWikiSmart(String originalQ) async {
            List<Map<String,String>> r=[];
            String q=extractCoreTopic(originalQ);
            try{
              final u=Uri.parse('https://en.wikipedia.org/api/rest_v1/page/summary/' + Uri.encodeComponent(q.trim()));
              final resp=await http.get(u, headers:{'User-Agent':'MTRDF/1.0'}).timeout(Duration(seconds:8));
              if(resp.statusCode==200){
                final d=jsonDecode(resp.body);
                String ex=decodeHtml((d['extract']??'').toString());
                if(ex.length>60){ r.add({'title':(d['title']??q).toString(),'snip':ex,'url':'https://en.wikipedia.org/wiki/' + Uri.encodeComponent((d['title']??q).toString()),'source':'Wikipedia','cite':'[1]'}); }
              }
            }catch(e){}
            return r;
          }

          Future<Map<String,dynamic>> deepResearchFormatted(String q, String subject) async {
            var instr=parseInstructions(q);
            String core=instr['core'];
            int needPoints=instr['points'];
            List<Map<String,String>> wiki=await searchWikiSmart(q);
            List<Map<String,String>> points=getPointsForCore(core, needPoints);
            return {'results':wiki,'points':points,'instr':instr,'core':core};
          }

          void main() async { WidgetsFlutterBinding.ensureInitialized(); await Hive.initFlutter(); await Hive.openBox('mtrdf_v14'); runApp(App()); }
          class App extends StatelessWidget { @override Widget build(BuildContext c){ return MaterialApp(debugShowCheckedModeBanner:false, home:Tabs()); } }
          class Tabs extends StatefulWidget { @override State<Tabs> createState()=>_TabsS(); }
          class _TabsS extends State<Tabs> {
            int i=0;
            final pages=[Home(),DocsPage(),ResearchPro(),OnlinePro()];
            @override Widget build(BuildContext c){ return Scaffold(body: pages[i], bottomNavigationBar: BottomNavigationBar(type: BottomNavigationBarType.fixed, currentIndex: i, selectedItemColor: Colors.deepPurple, onTap: (x){ setState((){ i=x; }); }, items: [BottomNavigationBarItem(icon:Icon(Icons.school),label:'Subjects'), BottomNavigationBarItem(icon:Icon(Icons.folder),label:'My Docs'), BottomNavigationBarItem(icon:Icon(Icons.biotech),label:'Research PRO'), BottomNavigationBarItem(icon:Icon(Icons.public),label:'Online AI')])); }
          }
          class Home extends StatelessWidget {
            @override Widget build(BuildContext c){
              final subs=['Mathematics','Biology','Chemistry','Physics','History','Geography','English','Agriculture'];
              return Scaffold(appBar: AppBar(title:Text('MTRDF V14.29 FIXED'),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white), body: ListView.builder(padding:EdgeInsets.all(12),itemCount:subs.length,itemBuilder:(_,j){ return Card(child:ListTile(title:Text(subs[j]),subtitle:Text('10 points format like ChatGPT'),onTap:()=>Navigator.push(c,MaterialPageRoute(builder:(_)=>ChatPage(subject:subs[j]))))); }));
            }
          }
          class DocsPage extends StatefulWidget { @override State<DocsPage> createState()=>_DocsS(); }
          class _DocsS extends State<DocsPage> {
            List<Map<String,String>> docs=[];
            @override void initState(){ super.initState(); ld(); }
            Future<void> ld() async { final p=await SharedPreferences.getInstance(); String? s=p.getString('mtrdf_docs_v10'); if(s!=null){ setState((){ docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))); }); } }
            Future<void> sv() async { final p=await SharedPreferences.getInstance(); p.setString('mtrdf_docs_v10',jsonEncode(docs)); }
            Future<void> pk() async { try{ FilePickerResult? r=await FilePicker.platform.pickFiles(type:FileType.custom,allowedExtensions:['docx','pdf'],withData:true); if(r!=null&&r.files.first.bytes!=null){ String n=r.files.first.name; List<int> by=r.files.first.bytes!.toList(); String t=n.toLowerCase().endsWith('.pdf')?extractPdf(by):extractDocx(by); setState((){ docs.add({'name':n,'content':t}); }); sv(); } }catch(e){} }
            @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title:Text('My Docs ' + docs.length.toString()),backgroundColor:Colors.green,foregroundColor:Colors.white), body: docs.isEmpty?Center(child:Text('No docs')):ListView.builder(padding:EdgeInsets.all(12),itemCount:docs.length,itemBuilder:(_,j){ return Card(child:ListTile(title:Text(docs[j]['name']??''))); }), floatingActionButton: FloatingActionButton(onPressed:pk,child:Icon(Icons.add))); }
          }
          class ResearchPro extends StatefulWidget { const ResearchPro({super.key}); @override State<ResearchPro> createState()=>_ResPro(); }
          class _ResPro extends State<ResearchPro> {
            final ctrl=TextEditingController(text:'Give me 10 points well explained with examples for importance of geography for S2 according to UNEB in table format');
            bool searching=false;
            Map<String,dynamic> data={};
            int tab=0;
            Future<void> doSearch(String q) async { if(q.trim().isEmpty) return; setState((){ searching=true; }); var r=await deepResearchFormatted(q,'Geography'); setState((){ data=r; searching=false; tab=0; }); }
            @override void initState(){ super.initState(); Future.delayed(Duration(milliseconds:400),(){ doSearch(ctrl.text); }); }
            @override Widget build(BuildContext c){
              List<Map<String,String>> points=(data['points'] as List?)?.cast<Map<String,String>>()??[];
              Map<String,dynamic> instr=data['instr']??{};
              List<Map<String,String>> wiki=(data['results'] as List?)?.cast<Map<String,String>>()??[];
              bool isTable=instr['table']??false;
              String shareText='';
              if(points.isNotEmpty){
                shareText=(instr['core']??'Topic').toString().toUpperCase() + '\n\n';
                for(int i=0;i<points.length;i++){ shareText+=(i+1).toString() + '. ' + points[i]['title']! + '\n Explanation: ' + points[i]['exp']! + '\n Example: ' + points[i]['ex']! + '\n\n'; }
              }
              return Scaffold(
                appBar: AppBar(title:Text('Research PRO - FORMAT'),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white, actions:[IconButton(icon:Icon(Icons.share), onPressed:(){ if(shareText.isNotEmpty) Share.share(shareText); })]),
                body: Column(children:[
                  Padding(padding:EdgeInsets.all(8), child: Column(children:[
                    TextField(controller: ctrl, maxLines: 2, decoration: InputDecoration(hintText: 'e.g. Give me 10 points well explained...', border: OutlineInputBorder(), prefixIcon: Icon(Icons.auto_awesome), suffixIcon: IconButton(icon: Icon(Icons.send), onPressed: (){ doSearch(ctrl.text); })), onSubmitted: (v){ doSearch(v); }),
                    SizedBox(height:6),
                    SingleChildScrollView(scrollDirection: Axis.horizontal, child: Row(children:[
                      ActionChip(label: Text('10 points + examples'), onPressed: (){ ctrl.text='Give me 10 points well explained with examples for ' + extractCoreTopic(ctrl.text); doSearch(ctrl.text); }),
                      SizedBox(width:4),
                      ActionChip(label: Text('20 points'), onPressed: (){ ctrl.text='Give me 20 points well explained with examples for ' + extractCoreTopic(ctrl.text); doSearch(ctrl.text); }),
                      SizedBox(width:4),
                      ActionChip(label: Text('Table format'), onPressed: (){ ctrl.text=ctrl.text + ' in table format'; doSearch(ctrl.text); }),
                    ]))
                  ])),
                  searching? LinearProgressIndicator() : SizedBox(),
                  Container(color:Colors.grey[100], child: Row(children:[
                    Expanded(child: InkWell(onTap:(){setState((){tab=0;});}, child: Container(padding:EdgeInsets.all(12), decoration: BoxDecoration(border: Border(bottom: BorderSide(color: tab==0?Colors.deepPurple:Colors.transparent,width:2))), child: Text('Formatted Answer',textAlign:TextAlign.center,style:TextStyle(fontWeight: tab==0?FontWeight.bold:FontWeight.normal,fontSize:12))))),
                    Expanded(child: InkWell(onTap:(){setState((){tab=1;});}, child: Container(padding:EdgeInsets.all(12), child: Text('Sources ' + wiki.length.toString(),textAlign:TextAlign.center,style:TextStyle(fontSize:12))))),
                  ])),
                  Expanded(child: tab==0? (points.isEmpty? Center(child: Text('Type instruction...')) :
                    SingleChildScrollView(padding:EdgeInsets.all(12), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[
                      Card(color: Colors.deepPurple[50], child: Padding(padding: EdgeInsets.all(8), child: Text('Instruction Detected: ' + (instr['points']?.toString()??'') + ' points, ' + ((instr['examples']??false)?'with examples, ':'') + ((instr['detailed']??false)?'well explained, ':'') + 'Level: ' + (instr['level']??'') + '\nCore Topic: ' + (instr['core']??''), style: TextStyle(fontSize: 11)))),
                      SizedBox(height:8),
                      Text((instr['core']??'TOPIC').toString().toUpperCase(), style: TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
                      SizedBox(height:4),
                      Text((instr['uneb']==true?'UNEB/S4 Exam Format - ':'') + (instr['level']??'') + ' Level', style: TextStyle(fontSize: 12, color: Colors.green)),
                      SizedBox(height:8),
                      Text('Introduction:', style: TextStyle(fontWeight: FontWeight.bold)),
                      Text(wiki.isNotEmpty? wiki[0]['snip']??'This topic is important in Uganda curriculum. [1]' : 'This topic is important in Uganda curriculum and UNEB exams.', style: TextStyle(fontSize: 13)),
                      SizedBox(height:12),
                      Text('Here are ' + (instr['points']?.toString()??'10') + ' points:', style: TextStyle(fontWeight: FontWeight.bold)),
                      SizedBox(height:8),
                      if(isTable)
                        SingleChildScrollView(scrollDirection: Axis.horizontal, child: DataTable(columns: [DataColumn(label: Text('No', style: TextStyle(fontWeight: FontWeight.bold))), DataColumn(label: Text('Point')), DataColumn(label: Text('Explanation')), DataColumn(label: Text('Example'))], rows: points.asMap().entries.map((e){ int i=e.key; var p=e.value; return DataRow(cells: [DataCell(Text((i+1).toString())), DataCell(SizedBox(width: 90, child: Text(p['title']!, style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold)))), DataCell(SizedBox(width: 130, child: Text(p['exp']!, style: TextStyle(fontSize: 11)))), DataCell(SizedBox(width: 130, child: Text(p['ex']!, style: TextStyle(fontSize: 11))))]); }).toList())),
                      if(!isTable)
                        Column(children: points.asMap().entries.map((e){
                          int i=e.key; var p=e.value;
                          return Card(child: Padding(padding: EdgeInsets.all(10), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[
                            Text((i+1).toString() + '. ' + p['title']!.toUpperCase(), style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                            SizedBox(height:4),
                            Text('Explanation: ' + p['exp']!, style: TextStyle(fontSize: 12)),
                            SizedBox(height:4),
                            if(instr['examples']==true) Text('Example: ' + p['ex']!, style: TextStyle(fontSize: 12, fontStyle: FontStyle.italic)),
                          ])));
                        }).toList()),
                      SizedBox(height:12),
                      Text('Conclusion:', style: TextStyle(fontWeight: FontWeight.bold)),
                      Text('Therefore, ' + (instr['core']??'this topic') + ' is very important for Uganda development. Students should master these points for UNEB.', style: TextStyle(fontSize: 12)),
                    ]))
                  ) : ListView.builder(padding:EdgeInsets.all(12),itemCount:wiki.length,itemBuilder:(_,i){ var r=wiki[i]; return Card(child: ListTile(title:Text(r['title']??'',style:TextStyle(fontSize:12,fontWeight:FontWeight.bold)), subtitle:Text(r['snip']??'',style:TextStyle(fontSize:11)))); }))
                ])
              );
            }
          }
          class OnlinePro extends StatefulWidget { @override State<OnlinePro> createState()=>_OnlineProS(); }
          class _OnlineProS extends State<OnlinePro> {
            final ctrl=TextEditingController(text:'Give me 10 points well explained with examples for importance of tourism in Uganda');
            Map<String,dynamic> data={};
            bool searching=false;
            Future<void> doSearch(String q) async { if(q.trim().isEmpty) return; setState((){ searching=true; }); var r=await deepResearchFormatted(q,'Geography'); setState((){ data=r; searching=false; }); }
            @override void initState(){ super.initState(); Future.delayed(Duration(milliseconds:300),(){ doSearch(ctrl.text); }); }
            @override Widget build(BuildContext c){
              List<Map<String,String>> points=(data['points'] as List?)?.cast<Map<String,String>>()??[];
              return Scaffold(appBar: AppBar(title:Text('Online AI - FORMAT'),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white), body: Column(children:[Padding(padding:EdgeInsets.all(8), child: TextField(controller: ctrl, maxLines: 2, decoration: InputDecoration(hintText: 'Instruction...', border: OutlineInputBorder(), suffixIcon: IconButton(icon: Icon(Icons.send), onPressed: (){ doSearch(ctrl.text); })), onSubmitted: (v){ doSearch(v); })), searching? LinearProgressIndicator(): SizedBox(), Expanded(child: points.isEmpty? Center(child: Text('Searching...')) : ListView.builder(padding:EdgeInsets.all(12),itemCount:points.length,itemBuilder:(_,i){ var p=points[i]; return Card(child: ListTile(leading: CircleAvatar(child: Text((i+1).toString())), title: Text(p['title']!, style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)), subtitle: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text(p['exp']!, style: TextStyle(fontSize: 11)), SizedBox(height:2), Text('Ex: ' + p['ex']!, style: TextStyle(fontSize: 11, fontStyle: FontStyle.italic))]))); }))]));
            }
          }
          class ChatPage extends StatefulWidget { final String subject; const ChatPage({super.key,required this.subject}); @override State<ChatPage> createState()=>_ChatS(); }
          class _ChatS extends State<ChatPage> {
            final ctrl=TextEditingController(); List<Map<String,dynamic>> msgs=[]; bool sending=false;
            @override void initState(){ super.initState(); msgs=[{'role':'ai','points':[],'instr':{}}]; }
            Future<void> send() async { if(ctrl.text.isEmpty) return; String q=ctrl.text; setState((){ msgs.add({'role':'user','text':q}); sending=true; }); ctrl.clear(); var res=await deepResearchFormatted(q, widget.subject); setState((){ msgs.add({'role':'ai','points':res['points'],'instr':res['instr']}); sending=false; }); }
            @override Widget build(BuildContext c){
              return Scaffold(appBar: AppBar(title:Text(widget.subject + ' - FORMAT'),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white), body: Column(children:[
                Expanded(child: ListView.builder(padding:EdgeInsets.all(12),itemCount:msgs.length,itemBuilder:(_,i){
                  var m=msgs[i]; bool isUser=m['role']=='user';
                  if(isUser) return Align(alignment:Alignment.centerRight, child: Container(margin:EdgeInsets.all(6),padding:EdgeInsets.all(12),decoration:BoxDecoration(color:Colors.deepPurple,borderRadius:BorderRadius.circular(12)), child:Text(m['text']??'',style:TextStyle(color:Colors.white))));
                  List<Map<String,String>> points=(m['points'] as List?)?.cast<Map<String,String>>()??[];
                  if(points.isEmpty) return Card(child: Padding(padding:EdgeInsets.all(12), child: Text('Try: Give me 10 points well explained with examples for importance of tourism in Uganda', style: TextStyle(fontSize:12))));
                  return Column(children: points.asMap().entries.map((e){
                    int idx=e.key; var p=e.value;
                    return Card(child: ListTile(leading: Text((idx+1).toString(), style: TextStyle(fontWeight: FontWeight.bold)), title: Text(p['title']!, style: TextStyle(fontSize:12,fontWeight:FontWeight.bold)), subtitle: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text(p['exp']!, style: TextStyle(fontSize:11)), Text('Ex: ' + p['ex']!, style: TextStyle(fontSize:11, fontStyle: FontStyle.italic))])) );
                  }).toList());
                })),
                sending? LinearProgressIndicator(): SizedBox(),
                Padding(padding:EdgeInsets.all(8), child: Row(children:[Expanded(child: TextField(controller:ctrl, maxLines: 3, decoration: InputDecoration(hintText: 'Give me 10 points...', border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted: (_)=>send())), IconButton(icon:Icon(Icons.send), onPressed:send)]))
              ]));
            }
          }
          DART
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MTRDF-V14-29-FIXED-DOLLAR-TABLE
          path: build/app/outputs/flutter-apk/app-release.apk
