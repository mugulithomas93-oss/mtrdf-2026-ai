                      Text('Therefore, ' + (instr['core']??'this topic') + ' is very important for Uganda development. Master for UNEB.', style: TextStyle(fontSize: 12)),
                      SizedBox(height:12),
                      Row(children:[ElevatedButton.icon(onPressed: () async { String path=await exportToPdfFile(instr['core']??'topic', points, intro); if(path.isNotEmpty) Share.shareXFiles([XFile(path)]); }, icon: Icon(Icons.picture_as_pdf), label: Text('Export PDF')), SizedBox(width:8), ElevatedButton.icon(onPressed: (){ Share.share(shareText); }, icon: Icon(Icons.share), label: Text('Share'))]),
                    ]))
                  ) : tab==1? ListView.builder(padding:EdgeInsets.all(12),itemCount:wiki.length,itemBuilder:(_,i){ var r=wiki[i]; return Card(child: ListTile(title:Text(r['title']??'',style:TextStyle(fontSize:12,fontWeight:FontWeight.bold)), subtitle:Text(r['snip']??'',style:TextStyle(fontSize:11)), trailing: IconButton(icon: Icon(Icons.open_in_new), onPressed: () async { if((r['url']??'').isNotEmpty){ final uri=Uri.parse(r['url']!); if(await canLaunchUrl(uri)) await launchUrl(uri,mode:LaunchMode.externalApplication); } }))); }) : ListView.builder(padding:EdgeInsets.all(12),itemCount:myDocMatches.length,itemBuilder:(_,i){ var r=myDocMatches[i]; return Card(color: Colors.yellow[50], child: ListTile(leading: Icon(Icons.folder, color: Colors.green), title:Text(r['title']??'',style:TextStyle(fontSize:12,fontWeight:FontWeight.bold)), subtitle:Text(r['snip']??'',style:TextStyle(fontSize:11)))); }))
                ])
              );
            }
