name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Recreate
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "ACCESS_NETWORK_STATE" $MANIFEST || sed -i 's/<uses-permission android:name="android.permission.INTERNET"\/>/<uses-permission android:name="android.permission.INTERNET" \/>\n <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" \/>/' $MANIFEST
      - name: Pubspec
        run: |
          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          version: 14.14.0+62
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.1.9
            archive: ^3.6.1
            syncfusion_flutter_pdf: ^28.2.7
            hive_flutter: ^1.1.0
            share_plus: ^12.0.2
            connectivity_plus: ^6.0.5
            http: ^1.2.2
          flutter:
            uses-material-design: true
          YAML
      - name: Write V14.14 ONLINE SEARCH FIXED
        run: |
          python3 << 'PY'
          code = """
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';

          String extractDocx(List<int> bytes) {
            try {
              final archive = ZipDecoder().decodeBytes(bytes);
              for (final f in archive) {
                if (f.name == 'word/document.xml') {
                  final xml = utf8.decode(f.content as List<int>);
                  return RegExp(r'<w:t[^>]*>([^<]+)</w:t>').allMatches(xml).map((m) => m.group(1)?? '').join(' ');
                }
              }
              return "No xml";
            } catch (e) { return "Error " + e.toString(); }
          }

          String extractPdf(List<int> bytes) {
            try {
              final doc = PdfDocument(inputBytes: bytes);
              final t = PdfTextExtractor(doc).extractText();
              doc.dispose();
              return t.isEmpty? "Scanned PDF" : t;
            } catch (e) { return "PDF " + e.toString(); }
          }

          Future<bool> checkOnlineRobust() async {
            try {
              var con = await Connectivity().checkConnectivity();
              return!con.contains(ConnectivityResult.none);
            } catch (e) { return true; }
          }

          // V14.14 FIXED ONLINE RESEARCH - STRIPS define/what is + USES SUMMARY API
          Future<List<Map<String, String>>> fetchOnlineResearch(String query) async {
            List<Map<String, String>> online = [];
            String clean = query.toLowerCase().replaceAll("define ", "").replaceAll("what is ", "").replaceAll("what are ", "").replaceAll("?", "").trim();
            // Keep only first 2 words for Wikipedia title
            List<String> words = clean.split(RegExp(r'\\s+')).where((w)=>w.length>2).toList();
            String searchTerm = words.isNotEmpty? words.take(2).join(" ") : clean;
            if (searchTerm.isEmpty) searchTerm = query;
            String titleCase = searchTerm.split(" ").map((w)=> w.isEmpty? "" : w[0].toUpperCase() + w.substring(1)).join(" ");

            // 1. Try Wikipedia Summary API - MOST RELIABLE
            try {
              final summaryUrl = Uri.parse('https://en.wikipedia.org/api/rest_v1/page/summary/' + Uri.encodeComponent(titleCase));
              final res = await http.get(summaryUrl, headers: {"User-Agent":"MTRDF/1.0 (Uganda Edu App)"}).timeout(Duration(seconds: 15));
              if (res.statusCode == 200) {
                final data = jsonDecode(res.body);
                String extract = data['extract']?? '';
                String title = data['title']?? titleCase;
                if (extract.isNotEmpty) {
                  online.add({"title": "WIKIPEDIA: " + title, "snip": extract + "\\n\\nSource: Wikipedia Summary API - Online AI", "source": "online"});
                }
              }
            } catch (e) {}

            // 2. Try Wikipedia Search API if summary failed
            if (online.isEmpty) {
              try {
                final wikiUrl = Uri.parse('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + Uri.encodeComponent(searchTerm) + '&format=json&srlimit=2&origin=*');
                final wikiRes = await http.get(wikiUrl, headers: {"User-Agent":"MTRDF/1.0"}).timeout(Duration(seconds: 15));
                if (wikiRes.statusCode == 200) {
                  final data = jsonDecode(wikiRes.body);
                  final search = data['query']?['search'] as List?;
                  if (search!= null && search.isNotEmpty) {
                    for (var item in search.take(2)) {
                      String title = item['title']?? '';
                      String snip = (item['snippet']?? '').replaceAll(RegExp(r'<[^>]*>'), '');
                      if (title.isNotEmpty && snip.isNotEmpty) {
                        online.add({"title": "WIKIPEDIA SEARCH: " + title, "snip": snip + "\\n\\nSource: Wikipedia Search", "source": "online"});
                      }
                    }
                  }
                }
              } catch (e) {}
            }

            // 3. DuckDuckGo as backup
            try {
              final ddgUrl = Uri.parse('https://api.duckduckgo.com/?q=' + Uri.encodeComponent(searchTerm) + '&format=json&pretty=1&no_html=1');
              final ddgRes = await http.get(ddgUrl).timeout(Duration(seconds: 15));
              if (ddgRes.statusCode == 200) {
                final data = jsonDecode(ddgRes.body);
                String at = data['AbstractText']?? '';
                String head = data['Heading']?? searchTerm;
                String src = data['AbstractSource']?? 'DuckDuckGo';
                if (at.isNotEmpty && at.length > 30) {
                  online.add({"title": "ONLINE AI: " + head, "snip": at + "\\n\\nSource: " + src + " - Online AI", "source": "online"});
                }
              }
            } catch (e) {}

            // 4. If still empty, return offline hint with error details
            if (online.isEmpty) {
              online.add({"title": "ONLINE CHECK: No Wikipedia result for '" + searchTerm + "'", "snip": "Tried to search Wikipedia for '" + searchTerm + "' (original query: '" + query + "') but network may be slow (49.8 K/S seen in your screenshot). Try again with simpler word like 'history' alone. Your data is ON (" + searchTerm + "), API returned empty. Check internet speed.\\n\\nTip: Type just 'history' not 'define history' for best online results.", "source": "online"});
            }

            return online;
          }

          String snippet(String c, String q) {
            final low = c.toLowerCase();
            int pos = low.indexOf(q.toLowerCase());
            if (pos == -1) {
              for (var k in q.toLowerCase().split(RegExp(r'\\s+')).where((w) => w.length > 2)) {
                int x = low.indexOf(k);
                if (x!= -1) { pos = x; break; }
              }
            }
            if (pos == -1) return c.length > 500? c.substring(0, 500) + "..." : c;
            int s = pos - 200; if (s < 0) s = 0;
            int e = pos + 500; if (e > c.length) e = c.length;
            String t = c.substring(s, e);
            if (s > 0) t = "..." + t;
            if (e < c.length) t = t + "...";
            return t;
          }

          bool matches(String content, String query, String subject) {
            final low = content.toLowerCase();
            final qq = query.toLowerCase().trim();
            if (qq.isEmpty) return false;
            if (low.contains(qq)) return true;
            for (var k in qq.split(RegExp(r'\\s+'))) { if (k.length > 2 && low.contains(k)) return true; }
            return false;
          }

          Widget highlight(String text, String query) {
            final low = text.toLowerCase();
            final kws = query.toLowerCase().split(RegExp(r'\\s+')).where((w) => w.length > 2).toList();
            if (kws.isEmpty) return Text(text);
            String? best; int bestPos = -1;
            for (var k in kws) { int p = low.indexOf(k); if (p!= -1 && (bestPos == -1 || p < bestPos)) { bestPos = p; best = k; } }
            if (best == null) return Text(text);
            List<TextSpan> spans = []; int idx = 0;
            while (true) {
              int p = low.indexOf(best, idx);
              if (p == -1) { spans.add(TextSpan(text: text.substring(idx))); break; }
              if (p > idx) spans.add(TextSpan(text: text.substring(idx, p)));
              spans.add(TextSpan(text: text.substring(p, p + best.length), style: TextStyle(backgroundColor: Colors.yellow, fontWeight: FontWeight.bold)));
              idx = p + best.length;
            }
            return RichText(text: TextSpan(style: TextStyle(color: Colors.black87), children: spans));
          }

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Hive.initFlutter();
            await Hive.openBox('mtrdf_v14');
            runApp(App());
          }

          class App extends StatelessWidget { @override Widget build(BuildContext c) { return MaterialApp(debugShowCheckedModeBanner: false, home: Tabs()); } }
          class Tabs extends StatefulWidget { @override State<Tabs> createState() => _TabsS(); }
          class _TabsS extends State<Tabs> {
            int i = 0; final pages = [Home(), Docs(), GeoMap(), Research()];
            @override Widget build(BuildContext c) {
              return Scaffold(body: pages[i], bottomNavigationBar: BottomNavigationBar(type: BottomNavigationBarType.fixed, currentIndex: i, selectedItemColor: Colors.green, onTap: (x) => setState(() => i = x), items: [BottomNavigationBarItem(icon: Icon(Icons.school), label: "Subjects"), BottomNavigationBarItem(icon: Icon(Icons.folder), label: "My Docs"), BottomNavigationBarItem(icon: Icon(Icons.map), label: "GeographyLab"), BottomNavigationBarItem(icon: Icon(Icons.search), label: "Research")]));
            }
          }

          class Home extends StatelessWidget {
            @override Widget build(BuildContext c) {
              final subs = ["Mathematics","Biology","Chemistry","Physics","History","Geography","English","Agriculture"];
              return Scaffold(appBar: AppBar(title: Text("MTRDF V14.14 ONLINE FIXED"), backgroundColor: Colors.green, foregroundColor: Colors.white), body: ListView.builder(padding: EdgeInsets.all(12), itemCount: subs.length, itemBuilder: (_, j) { return Card(child: ListTile(leading: Icon(Icons.book, color: Colors.green), title: Text(subs[j]), subtitle: Text("Offline+Online AI V14.14"), onTap: () => Navigator.push(c, MaterialPageRoute(builder: (_) => Chat(subject: subs[j]))))); }));
            }
          }

          class Docs extends StatefulWidget { @override State<Docs> createState() => _DocsS(); }
          class _DocsS extends State<Docs> {
            List<Map<String,String>> docs = []; bool loading = false;
            @override void initState() { super.initState(); _load(); }
            Future<void> _load() async { final p = await SharedPreferences.getInstance(); String? s = p.getString("mtrdf_docs_v10"); if (s!= null) docs = List<Map<String,String>>.from(jsonDecode(s).map((e) => Map<String,String>.from(e))); final box = Hive.box('mtrdf_v14'); String? h = box.get('docs'); if (h!= null) { try { docs = List<Map<String,String>>.from(jsonDecode(h).map((e) => Map<String,String>.from(e))); } catch (e) {} } setState(() {}); }
            Future<void> _save() async { final p = await SharedPreferences.getInstance(); p.setString("mtrdf_docs_v10", jsonEncode(docs)); Hive.box('mtrdf_v14').put('docs', jsonEncode(docs)); }
            Future<void> _pick() async { setState(() => loading = true); try { FilePickerResult? r = await FilePicker.platform.pickFiles(type: FileType.custom, allowedExtensions: ['docx','pdf'], withData: true); if (r!= null && r.files.first.bytes!= null) { String name = r.files.first.name; List<int> bytes = r.files.first.bytes!.toList(); String txt = name.toLowerCase().endsWith('.pdf')? extractPdf(bytes) : extractDocx(bytes); setState(() => docs.add({"name": name, "content": txt, "type": name.toLowerCase().endsWith('.pdf')? "pdf" : "docx"})); _save(); } } catch (e) {} setState(() => loading = false); }
            @override Widget build(BuildContext c) { return Scaffold(appBar: AppBar(title: Text("My Docs " + docs.length.toString() + " V14.14"), backgroundColor: Colors.green, foregroundColor: Colors.white), body: loading? Center(child: CircularProgressIndicator()) : docs.isEmpty? Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Text("No docs - Add your History DOCX"), SizedBox(height: 12), ElevatedButton(onPressed: _pick, child: Text("Add DOCX Now"))])) : ListView.builder(padding: EdgeInsets.all(12), itemCount: docs.length, itemBuilder: (_, j) { var d = docs[j]; return Card(child: ListTile(title: Text(d["name"]?? ""), subtitle: Text((d["type"]?? "") + " " + (d["content"]?? "").length.toString()), trailing: IconButton(icon: Icon(Icons.delete), onPressed: () { setState(() => docs.removeAt(j)); _save(); }))); }), floatingActionButton: FloatingActionButton.extended(onPressed: _pick, backgroundColor: Colors.green, icon: Icon(Icons.add, color: Colors.white), label: Text("Add DOCX/PDF", style: TextStyle(color: Colors.white)))); }
          }

          class GeoMap extends StatelessWidget {
            @override Widget build(BuildContext context) {
              final lakes = [{"name":"Lake Victoria","q":"Lake Victoria","x":0.75,"y":0.6},{"name":"Lake Albert","q":"Lake Albert","x":0.25,"y":0.25},{"name":"Lake Kyoga","q":"Lake Kyoga","x":0.65,"y":0.3},{"name":"Lake Edward","q":"Rift Valley","x":0.15,"y":0.65}];
              return Scaffold(appBar: AppBar(title: Text("GeographyLab V14.14"), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Column(children: [Expanded(flex: 3, child: Stack(children: [Container(width: double.infinity, height: double.infinity, color: Color(0xFFE8F5E9), child: CustomPaint(painter: UgandaPainter())), for (var l in lakes) Positioned(left: MediaQuery.of(context).size.width * (l["x"] as double) - 30, top: 250 * (l["y"] as double), child: GestureDetector(onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => Research(initialQuery: l["q"] as String))), child: Column(children: [Icon(Icons.location_on, color: Colors.red, size: 32), Container(padding: EdgeInsets.symmetric(horizontal: 6, vertical: 2), decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(6), border: Border.all(color: Colors.red)), child: Text(l["name"] as String, style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold)))]))), Positioned(top: 8, left: 8, child: Container(padding: EdgeInsets.symmetric(horizontal: 8, vertical: 4), decoration: BoxDecoration(color: Colors.green, borderRadius: BorderRadius.circular(12)), child: Text("OFFLINE CANVAS - 0 B/S", style: TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.bold)))) ])), Expanded(flex: 2, child
