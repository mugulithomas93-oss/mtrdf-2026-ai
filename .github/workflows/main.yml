name: Build APK
on: 
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APK
        run: |
          echo "=== FILES ==="
          ls -la
          mkdir -p lib
          if [ -f main.dart ]; then
            echo "Moving main.dart to lib/"
            mv main.dart lib/main.dart
          fi
          echo "=== lib/main.dart ==="
          cat lib/main.dart
          echo "=== pubspec.yaml ==="
          cat pubspec.yaml || echo "No pubspec, will create"
          if [ ! -f pubspec.yaml ]; then
            flutter create . --project-name mtrdf_2026_ai --platforms=android --overwrite
            # restore our file after create
            cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main() => runApp(const MTRDFApp());
          class MTRDFApp extends StatelessWidget {
            const MTRDFApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'MTRDF 2026 AI',
                home: const HomePage(),
              );
            }
          }
          class HomePage extends StatelessWidget {
            const HomePage({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('MTRDF 2026 AI'), backgroundColor: Colors.green),
                body: GridView.count(
                  crossAxisCount: 2,
                  padding: const EdgeInsets.all(12),
                  children: const [
                    Card(child: Center(child: Text('Mathematics'))),
                    Card(child: Center(child: Text('Biology'))),
                    Card(child: Center(child: Text('Chemistry'))),
                    Card(child: Center(child: Text('Physics'))),
                    Card(child: Center(child: Text('History'))),
                    Card(child: Center(child: Text('Geography'))),
                    Card(child: Center(child: Text('English'))),
                    Card(child: Center(child: Text('Agriculture'))),
                    Card(child: Center(child: Text('Commerce'))),
                    Card(child: Center(child: Text('ICT'))),
                    Card(child: Center(child: Text('RE'))),
                  ],
                ),
              );
            }
          }
          DART
          fi
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name mtrdf_2026_ai
          fi
          flutter pub get
          flutter build apk --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: MTRDF-2026-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
