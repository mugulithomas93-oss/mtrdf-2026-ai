name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build MTRDF REAL AI
        run: |
          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          description: MTRDF 2026 Real UNEB AI
          publish_to: 'none'
          version: 3.0.0+18
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main(){ runApp(const MTRDFApp()); }
          class MTRDFApp extends StatelessWidget{ const MTRDFApp({super.key}); @override Widget build(BuildContext c){ return MaterialApp(debugShowCheckedModeBanner:false, title:'MTRDF 2026', theme:ThemeData(primarySwatch:Colors.green), home: const HomePage()); } }
          class HomePage extends StatelessWidget{
            const HomePage({super.key});
            @override Widget build(BuildContext c){
              final subjects=["Mathematics","Biology","Chemistry","Physics","History","Geography","English","Agriculture"];
              return Scaffold(
                appBar: AppBar(title: const Text('MTRDF 2026 AI - S.4'), backgroundColor: Colors.green, foregroundColor: Colors.white, centerTitle: true),
                body: ListView.builder(padding: const EdgeInsets.all(12), itemCount: subjects.length, itemBuilder: (context,i){
                  return Card(elevation:3, child: ListTile(leading: const Icon(Icons.menu_book, color:Colors.green), title: Text(subjects[i], style: const TextStyle(fontWeight:FontWeight.bold)), subtitle: const Text("Tap to open AI Tutor + UNEB Notes"), trailing: const Icon(Icons.smart_toy, color:Colors.green), onTap:(){ Navigator.push(context, MaterialPageRoute(builder: (_)=> AITutorPage(subjectName: subjects[i]))); }));
                }),
              );
            }
          }
          class AITutorPage extends StatefulWidget{ final String subjectName; const AITutorPage({super.key, required this.subjectName}); @override State<AITutorPage> createState()=>_AITutorPageState(); }
          class _AITutorPageState extends State<AITutorPage>{
            final _c=TextEditingController();
            final List<Map<String,String>> _msgs=[{"role":"ai","text":"Hello! I am MTRDF 2026 AI - UNEB Expert! Ask any question."}];
            String _real(String q, String sub){
              q=q.toLowerCase().trim();
              if(sub=="History"){
                if(q.contains("define") && q.contains("history")) return "HISTORY - UNEB (2 marks):\nHistory is the study of past human activities in chronological order to understand present and predict future.\n\nImportance:\n1. Learn from past\n2. Promote unity\n3. Understand heritage\n4. Source of income\nUNEB: mention chronological order.";
                if(q.contains("colonial")) return "COLONIALISM: System where strong nations (Britain) controlled weak states for gain.\nReasons: raw materials, market, prestige, strategic areas.\nEffects: Loss of independence, cash crops, infrastructure but exploitation.";
                if(q.contains("maji maji")||q.contains("maji")) return "MAJI MAJI 1905-07: Led by Kinjekitile Ngwale. Used water medicine to turn bullets to water.\nCause: German harsh rule, cotton forced growing, tax.\nFailed: Superior German guns, disunity.\nResult: Many deaths, but showed nationalism.";
                if(q.contains("1900")||q.contains("buganda")) return "BUGANDA AGREEMENT 1900: Between Buganda (Apollo Kagwa) and British (Sir Johnston).\nTerms: Buganda = province, Mailo land 1000 sq miles to chiefs, Lukiiko recognized, taxes.\nEffect: Chiefs became landlords.";
              }
              if(sub=="Biology"){
                if(q.contains("photosynthesis")) return "PHOTOSYNTHESIS: 6CO2+6H2O --light/chlorophyll--> C6H12O6+6O2\nSite: Chloroplast.\nLight stage: grana, splits water -> O2+ATP\nDark stage: stroma, CO2 makes glucose.\nFactors: Light, CO2, Temp, Water.";
                if(q.contains("mitosis")) return "MITOSIS: Division giving 2 identical diploid cells.\nStages: Prophase, Metaphase, Anaphase, Telophase.\nImportance: Growth, repair, asexual reproduction, keeps chromosome number.";
              }
              if(sub=="Mathematics"){
                if(q.contains("pythagoras")) return "PYTHAGORAS: c2=a2+b2. Ex: a=6,b=8 => c2=36+64=100 => c=10cm.\nUNEB: show formula, substitution, answer with units.";
                if(q.contains("quadratic")) return "QUADRATIC: ax2+bx+c=0\nFormula: x=[-b±√(b2-4ac)]/2a\nEx: x2+5x+6=0 => (x+2)(x+3)=0 => x=-2 or -3.";
              }
              if(sub=="Chemistry" && q.contains("acid")) return "ACID: Proton donor, pH<7, blue litmus red.\nStrong: HCl, H2SO4. Weak: CH3COOH.\nReacts metal->H2, base->salt+water.";
              if(sub=="Physics" && q.contains("newton")) return "NEWTON: 1st Inertia, 2nd F=ma, 3rd Action=-Reaction.\nEx: F=10N,m=2kg => a=5m/s2.";
              if(sub=="Geography" && q.contains("rift")) return "RIFT VALLEY: Long narrow depression by faulting (tensional forces). Central block sinks (graben).\nExamples: Albert, Tanganyika, Malawi. Importance: lakes, tourism, minerals.";
              return "MTRDF AI - $sub - Q: '$q'\n\nUNEB ANSWER:\n1) Definition (2m)\n2) Explanation with 4 points (4m)\n3) Importance/Application (2m)\n4) Diagram/Formula (2m)\n\nAsk specific like 'Define photosynthesis' or 'What is Maji Maji' for full notes.";
            }
            void _send(){ if(_c.text.trim().isEmpty) return; String q=_c.text; setState((){ _msgs.add({"role":"user","text":q}); _msgs.add({"role":"ai","text":_real(q, widget.subjectName)}); }); _c.clear(); }
            @override Widget build(BuildContext context){
              return Scaffold(
                appBar: AppBar(title: Text('AI - ${widget.subjectName}'), backgroundColor: Colors.green, foregroundColor: Colors.white),
                body: Column(children:[
                  Expanded(child: ListView.builder(padding: const EdgeInsets.all(12), itemCount: _msgs.length, itemBuilder: (_,i){ final m=_msgs[i]; bool u=m["role"]=="user"; return Align(alignment: u? Alignment.centerRight: Alignment.centerLeft, child: Container(margin: const EdgeInsets.symmetric(vertical:4), padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: u? Colors.green: Colors.grey[200], borderRadius: BorderRadius.circular(12)), child: Text(m["text"]!, style: TextStyle(color: u? Colors.white: Colors.black)))); })),
                  const Divider(height:1),
                  Padding(padding: const EdgeInsets.all(8), child: Row(children:[Expanded(child: TextField(controller: _c, decoration: InputDecoration(hintText: "Ask ${widget.subjectName}...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted: (_)=>_send())), const SizedBox(width:8), CircleAvatar(backgroundColor: Colors.green, child: IconButton(icon: const Icon(Icons.send, color: Colors.white), onPressed: _send))]))
                ]),
              );
            }
          }
          DART
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MTRDF-REAL-AI-SMART
          path: build/app/outputs/flutter-apk/app-release.apk
