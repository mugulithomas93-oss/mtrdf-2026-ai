name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Recreate
        run: flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
      - name: Fix SDK
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if! grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"; then
            sed -i '/android.permission.INTERNET/a \ <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi
      - name: Pubspec V14.18
        run: |
          echo "name: mtrdf_2026_ai" > pubspec.yaml
          echo "version: 14.18.0+66" >> pubspec.yaml
          echo "environment:" >> pubspec.yaml
          echo " sdk: '>=3.0.0 <4.0.0'" >> pubspec.yaml
          echo "dependencies:" >> pubspec.yaml
          echo " flutter:" >> pubspec.yaml
          echo " sdk: flutter" >> pubspec.yaml
          echo " shared_preferences: ^2.2.2" >> pubspec.yaml
          echo " file_picker: ^10.1.9" >> pubspec.yaml
          echo " archive: ^3.6.1" >> pubspec.yaml
          echo " syncfusion_flutter_pdf: ^28.2.7" >> pubspec.yaml
          echo " hive_flutter: ^1.1.0" >> pubspec.yaml
          echo " connectivity_plus: ^6.0.5" >> pubspec.yaml
          echo " http: ^1.2.2" >> pubspec.yaml
          echo " share_plus: ^12.0.2" >> pubspec.yaml
          echo "flutter:" >> pubspec.yaml
          echo " uses-material-design: true" >> pubspec.yaml
      - name: Write main.dart FULL INTERNET
        run: |
          rm -f lib/main.dart
          echo "import 'package:flutter/material.dart';import 'package:shared_preferences/shared_preferences.dart';import 'package:file_picker/file_picker.dart';import 'package:archive/archive.dart';import 'package:syncfusion_flutter_pdf/pdf.dart';import 'package:hive_flutter/hive_flutter.dart';import 'package:connectivity_plus/connectivity_plus.dart';import 'package:http/http.dart' as http;import 'package:share_plus/share_plus.dart';import 'dart:convert';String extractDocx(List<int> b){try{final a=ZipDecoder().decodeBytes(b);for(final f in a){if(f.name=='word/document.xml'){final x=utf8.decode(f.content as List<int>);return RegExp(r'<w:t[^>]*>([^<]+)</w:t>').allMatches(x).map((m)=>m.group(1)??'').join(' ');}}return 'No xml';}catch(e){return 'Err';}}String extractPdf(List<int> b){try{final d=PdfDocument(inputBytes:b);final t=PdfTextExtractor(d).extractText();d.dispose();return t.isEmpty?'Scanned':t;}catch(e){return 'PDF Err';}}Future<bool> isOnline() async {try{var c=await Connectivity().checkConnectivity();return!c.contains(ConnectivityResult.none);}catch(e){return true;}}Future<List<Map<String,String>>> fetchWiki(String term) async {List<Map<String,String>> o=[];String title=term.split(' ').map((w)=>w.isEmpty?'':w[0].toUpperCase()+w.substring(1)).join(' ');try{final u=Uri.parse('https://en.wikipedia.org/api/rest_v1/page/summary/'+Uri.encodeComponent(title));final r=await http.get(u,headers:{'User-Agent':'MTRDF/1.0'}).timeout(Duration(seconds:20));if(r.statusCode==200){final d=jsonDecode(r.body);String ex=d['extract']??'';if(ex.isNotEmpty) o.add({'title':'WIKIPEDIA: '+(d['title']??title),'snip':ex,'source':'wikipedia','url':'https://en.wikipedia.org/wiki/'+Uri.encodeComponent(title)});}}catch(e){}return o;}Future<List<Map<String,String>>> fetchDuck(String term) async {List<Map<String,String>> o=[];try{final u=Uri.parse('https://api.duckduckgo.com/?q='+Uri.encodeComponent(term)+'&format=json&pretty=1&no_html=1');final r=await http.get(u).timeout(Duration(seconds:20));if(r.statusCode==200){final d=jsonDecode(r.body);String at=d['AbstractText']??'';if(at.length>30) o.add({'title':'GOOGLE: '+(d['Heading']??term),'snip':at,'source':'google','url':d['AbstractURL']??''});}}catch(e){}return o;}Future<List<Map<String,String>>> fetchYT(String term) async {List<Map<String,String>> o=[];try{final u=Uri.parse('https://www.youtube.com/results?search_query='+Uri.encodeComponent(term));final r=await http.get(u,headers:{'User-Agent':'Mozilla/5.0'}).timeout(Duration(seconds:20));if(r.statusCode==200){final body=r.body;final reg=RegExp(r'\"videoId\":\"([^\"]+)\".*?\"title\":\\{\"runs\":\\[\\{\"text\":\"([^\"]+)\"');final ms=reg.allMatches(body).take(3);for(var m in ms){String vid=m.group(1)??'';String t=m.group(2)??'';if(t.isNotEmpty&&vid.isNotEmpty) o.add({'title':'YOUTUBE: '+t,'snip':'YouTube video about '+term+' https://youtu.be/'+vid,'source':'youtube','url':'https://youtu.be/'+vid});}}}catch(e){}return o;}Future<List<Map<String,String>>> fetchAll(String q) async {List<Map<String,String>> all=[];String clean=q.toLowerCase().replaceAll('define ','').replaceAll('what is ','').replaceAll('?','').trim();clean=clean.replaceAll(RegExp(r'\\s+'),' ');List<String> ws=clean.split(' ').where((w)=>w.length>2).toList();List<String> uniq=[];for(var w in ws){if(!uniq.contains(w)) uniq.add(w);}String term=uniq.isNotEmpty?uniq.join(' '):clean;if(term.isEmpty) term='history';String first=uniq.isNotEmpty?uniq.first:term;var w1=await fetchWiki(first);all.addAll(w1);var w2=await fetchWiki(term);for(var x in w2){if(!all.any((a)=>a['title']==x['title'])) all.add(x);}var d1=await fetchDuck(term);all.addAll(d1);var y1=await fetchYT(term);all.addAll(y1);if(all.isEmpty){all.add({'title':'WIKIPEDIA: History','snip':'History is study of past events. Fallback because slow 0.00 B/S. Offline CBC notes still works!','source':'wikipedia','url':''});}return all;}Future<void> saveHist(String q,String resp,String src) async {try{final box=Hive.box('mtrdf_v14');String? h=box.get('search_history');List<Map<String,String>> hist=[];if(h!=null) hist=List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e)));hist.insert(0,{'query':q,'response':resp,'source':src,'time':DateTime.now().toIso8601String()});if(hist.length>100) hist=hist.sublist(0,100);box.put('search_history',jsonEncode(hist));}catch(e){}}Future<List<Map<String,String>>> getHist() async {try{final box=Hive.box('mtrdf_v14');String? h=box.get('search_history');if(h!=null) return List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e)));}catch(e){}return [];}String snippet(String c,String q){final low=c.toLowerCase();int p=low.indexOf(q.toLowerCase());if(p==-1){for(var k in q.toLowerCase().split(RegExp(r'\\s+')).where((w)=>w.length>2)){int x=low.indexOf(k);if(x!=-1){p=x;break;}}}if(p==-1) return c.length>500?c.substring(0,500)+'...':c;int s=p-200;if(s<0) s=0;int e=p+500;if(e>c.length) e=c.length;String t=c.substring(s,e);if(s>0) t='...'+t;if(e<c.length) t=t+'...';return t;}bool matches(String c,String q,String subj){final low=c.toLowerCase();final qq=q.toLowerCase().trim();if(qq.isEmpty) return false;if(low.contains(qq)) return true;for(var k in qq.split(RegExp(r'\\s+'))){if(k.length>2&&low.contains(k)) return true;}return false;}void main() async {WidgetsFlutterBinding.ensureInitialized();await Hive.initFlutter();await Hive.openBox('mtrdf_v14');runApp(App());}class App extends StatelessWidget{@override Widget build(BuildContext c){return MaterialApp(debugShowCheckedModeBanner:false,home:Tabs());}}class Tabs extends StatefulWidget{@override State<Tabs> createState()=>_TabsS();}class _TabsS extends State<Tabs>{int i=0;final p=[Home(),Docs(),GeoMap(),Research(),OnlineHub()];@override Widget build(BuildContext c){return Scaffold(body:p[i],bottomNavigationBar:BottomNavigationBar(type:BottomNavigationBarType.fixed,currentIndex:i,selectedItemColor:Colors.green,selectedFontSize:10,unselectedFontSize:9,onTap:(x)=>setState(()=>i=x),items:[BottomNavigationBarItem(icon:Icon(Icons.school,size:20),label:'Subjects'),BottomNavigationBarItem(icon:Icon(Icons.folder,size:20),label:'My Docs'),BottomNavigationBarItem(icon:Icon(Icons.map,size:20),label:'GeoLab'),BottomNavigationBarItem(icon:Icon(Icons.search,size:20),label:'Research'),BottomNavigationBarItem(icon:Icon(Icons.public,size:20),label:'Online AI')]));}}class Home extends StatelessWidget{@override Widget build(BuildContext c){final subs=['Mathematics','Biology','Chemistry','Physics','History','Geography','English','Agriculture'];return Scaffold(appBar:AppBar(title:Text('MTRDF V14.18 FULL INTERNET'),backgroundColor:Colors.green,foregroundColor:Colors.white),body:ListView.builder(padding:EdgeInsets.all(12),itemCount:subs.length,itemBuilder:(_,j){return Card(child:ListTile(leading:Icon(Icons.book,color:Colors.green),title:Text(subs[j]),subtitle:Text('Offline+Google+YouTube+Wiki'),onTap:()=>Navigator.push(c,MaterialPageRoute(builder:(_)=>Chat(subject:subs[j])))));}));}}class Docs extends StatefulWidget{@override State<Docs> createState()=>_DocsS();}class _DocsS extends State<Docs>{List<Map<String,String>> docs=[];bool l=false;@override void initState(){super.initState();ld();}Future<void> ld() async {final p=await SharedPreferences.getInstance();String? s=p.getString('mtrdf_docs_v10');if(s!=null) docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)));final b=Hive.box('mtrdf_v14');String? h=b.get('docs');if(h!=null){try{docs=List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e)));}catch(e){}}setState((){});}Future<void> sv() async {final p=await SharedPreferences.getInstance();p.setString('mtrdf_docs_v10',jsonEncode(docs));Hive.box('mtrdf_v14').put('docs',jsonEncode(docs));}Future<void> pk() async {setState(()=>l=true);try{FilePickerResult? r=await FilePicker.platform.pickFiles(type:FileType.custom,allowedExtensions:['docx','pdf'],withData:true);if(r!=null&&r.files.first.bytes!=null){String n=r.files.first.name;List<int> by=r.files.first.bytes!.toList();String t=n.toLowerCase().endsWith('.pdf')?extractPdf(by):extractDocx(by);setState(()=>docs.add({'name':n,'content':t,'type':n.toLowerCase().endsWith('.pdf')?'pdf':'docx'}));sv();}}catch(e){}setState(()=>l=false);}@override Widget build(BuildContext c){return Scaffold(appBar:AppBar(title:Text('My Docs '+docs.length.toString()),backgroundColor:Colors.green,foregroundColor:Colors.white),body:l?Center(child:CircularProgressIndicator()):docs.isEmpty?Center(child:Text('No docs')):ListView.builder(padding:EdgeInsets.all(12),itemCount:docs.length,itemBuilder:(_,j){var d=docs[j];return Card(child:ListTile(title:Text(d['name']??''),subtitle:Text((d['content']??'').length.toString()),trailing:IconButton(icon:Icon(Icons.delete),onPressed:(){setState(()=>docs.removeAt(j));sv();})));}),floatingActionButton:FloatingActionButton.extended(onPressed:pk,backgroundColor:Colors.green,icon:Icon(Icons.add,color:Colors.white),label:Text('Add DOCX/PDF',style:TextStyle(color:Colors.white))));}}class GeoMap extends StatelessWidget{@override Widget build(BuildContext context){final lakes=[{'name':'Lake Victoria','q':'Lake Victoria','x':0.75,'y':0.6},{'name':'Lake Albert','q':'Lake Albert','x':0.25,'y':0.25}];return Scaffold(appBar:AppBar(title:Text('GeographyLab'),backgroundColor:Colors.green,foregroundColor:Colors.white),body:Column(children:[Expanded(flex:3,child:Stack(children:[Container(width:double.infinity,height:double.infinity,color:Color(0xFFE8F5E9),child:CustomPaint(painter:UgandaPainter())),for(var la in lakes) Positioned(left:MediaQuery.of(context).size.width*(la['x'] as double)-30,top:250*(la['y'] as double),child:GestureDetector(onTap:()=>Navigator.push(context,MaterialPageRoute(builder:(_)=>Research(initialQuery:la['q'] as String))),child:Column(children:[Icon(Icons.location_on,color:Colors.red,size:32),Text(la['name'] as String,style:TextStyle(fontSize:10))]))),])),Expanded(flex:2,child:ListView(children:[for(var la in lakes)Card(child:ListTile(title:Text(la['name'] as String),onTap:()=>Navigator.push(context,MaterialPageRoute(builder:(_)=>Research(initialQuery:la['q'] as String))))),]))]));}}class UgandaPainter extends CustomPainter{@override void paint(Canvas c,Size s){final f=Paint()..color=Color(0xFFC8E6C9)..style=PaintingStyle.fill;Path p=Path();p.moveTo(s.width*0.2,s.height*0.2);p.lineTo(s.width*0.8,s.height*0.15);p.lineTo(s.width*0.85,s.height*0.75);p.lineTo(s.width*0.15,s.height*0.8);p.close();c.drawPath(p,f);} @override bool shouldRepaint(covariant CustomPainter old)=>false;}class Research extends StatefulWidget{final String initialQuery;const Research({super.key,this.initialQuery=''});@override State<Research> createState()=>_ResS();}class _ResS extends State<Research>{final ctrl=TextEditingController();List<Map<String,String>> res=[];String last='';bool searching=false;List<Map<String,String>> hist=[];@override void initState(){super.initState();ldHist();if(widget.initialQuery.isNotEmpty){ctrl.text=widget.initialQuery;Future.delayed(Duration(milliseconds:300),()=>sr(widget.initialQuery));}}Future<void> ldHist() async {var h=await getHist();setState(()=>hist=h);}Future<void> sr(String q) async {if(q.trim().isEmpty) return;setState(()=>searching=true);last=q;final p=await SharedPreferences.getInstance();String? s=p.getString('mtrdf_docs_v10');List<Map<String,String>> ds=[];if(s!=null) ds=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)));final b=Hive.box('mtrdf_v14');String? h=b.get('docs');if(h!=null){try{ds=List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e)));}catch(e){}}List<Map<String,String>> r=[];for(var d in ds){if(matches(d['content']??'',q,'research')) r.add({'title':'FROM DOC: '+(d['name']??''),'snip':snippet(d['content']??'',q),'source':'local','url':''});}try{var o=await fetchAll(q);r.addAll(o);if(o.isNotEmpty) saveHist(q,o.map((e)=>e['title']!+': '+e['snip']!).join('\\n---\\n'),o.first['source']??'online');}catch(e){r.add({'title':'ONLINE ERROR','snip':e.toString(),'source':'google','url':''});}setState(()=>{res=r,searching=false});ldHist();}@override Widget build(BuildContext c){return Scaffold(appBar:AppBar(title:Text('Research GOOGLE+YOUTUBE'),backgroundColor:Colors.blue,foregroundColor:Colors.white,actions:[IconButton(icon:Icon(Icons.history),onPressed:(){showModalBottomSheet(context:c,builder:(_)=>Container(padding:EdgeInsets.all(12),child:Column(children:[Text('History '+hist.length.toString()),Expanded(child:ListView.builder(itemCount:hist.length,itemBuilder:(_,i){var h=hist[i];return Card(child:ListTile(title:Text(h['query']??''),subtitle:Text((h['source']??'')+' '+(h['time']??'').substring(0,10)),onTap:(){ctrl.text=h['query']??'';Navigator.pop(c);sr(h['query']??'');}));}))]));})]),body:Column(children:[Padding(padding:EdgeInsets.all(12),child:Row(children:[Expanded(child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'Search docs + Google + YouTube + Wiki...',border:OutlineInputBorder(borderRadius:BorderRadius.circular(20))),onSubmitted:sr)),SizedBox(width:8),searching?CircularProgressIndicator():IconButton(icon:Icon(Icons.search,color:Colors.blue),onPressed:()=>sr(ctrl.text))])),Expanded(child:res.isEmpty?Center(child:Text(searching?'Searching 20s...':last.isEmpty?'Type history':'No results')):ListView.builder(padding:EdgeInsets.all(12),itemCount:res.length,itemBuilder:(_,i){var r=res[i];return Card(child:ListTile(leading:Icon(r['source']=='wikipedia'?Icons.public:r['source']=='youtube'?Icons.play_circle:Icons.search,color:r['source']=='youtube'?Colors.red:Colors.blue),title:Text(r['title']??'',style:TextStyle(fontWeight:FontWeight.bold,fontSize:13)),subtitle:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text(r['snip']??''),if((r['url']??'').isNotEmpty) Text(r['url']??'',style:TextStyle(fontSize:10,color:Colors.blue))]),trailing:PopupMenuButton(itemBuilder:(_)=>[PopupMenuItem(child:Text('Share'),value:'share'),PopupMenuItem(child:Text('Edit'),value:'edit')],onSelected:(v){if(v=='share'){Share.share((r['title']??'')+'\\n'+(r['snip']??'')+'\\n'+(r['url']??''));}else if(v=='edit'){final tec=TextEditingController(text:r['snip']??'');showDialog(context:c,builder:(_)=>AlertDialog(title:Text('Edit & Save'),content:TextField(controller:tec,maxLines:6),actions:[TextButton(onPressed:()=>Navigator.pop(c),child:Text('Cancel')),TextButton(onPressed:(){setState(()=>res[i]['snip']=tec.text);saveHist(last,tec.text,'edited');Navigator.pop(c);},child:Text('Save'))]));}})));}))]));}}class OnlineHub extends StatefulWidget{@override State<OnlineHub> createState()=>_OnlineHubS();}class _OnlineHubS extends State<OnlineHub>{final ctrl=TextEditingController();List<Map<String,String>> results=[];bool searching=false;@override Widget build(BuildContext c){return Scaffold(appBar:AppBar(title:Text('ONLINE AI HUB - Google+YouTube'),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white),body:Column(children:[Container(color:Colors.deepPurple[50],padding:EdgeInsets.all(8),child:Column(children:[TextField(controller:ctrl,decoration:InputDecoration(hintText:'Ask anything - Google, YouTube, Wikipedia...',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12))),SizedBox(height:8),Row(children:[Expanded(child:ElevatedButton(onPressed:()=>doSearch(ctrl.text.isEmpty?'history':ctrl.text,mode:'wikipedia'),child:Text('WIKI'),style:ElevatedButton.styleFrom(backgroundColor:Colors.blue,foregroundColor:Colors.white))),SizedBox(width:4),Expanded(child:ElevatedButton(onPressed:()=>doSearch(ctrl.text.isEmpty?'history':ctrl.text,mode:'google'),child:Text('GOOGLE'),style:ElevatedButton.styleFrom(backgroundColor:Colors.orange,foregroundColor:Colors.white))),SizedBox(width:4),Expanded(child:ElevatedButton(onPressed:()=>doSearch(ctrl.text.isEmpty?'history':ctrl.text,mode:'youtube'),child:Text('YOUTUBE'),style:ElevatedButton.styleFrom(backgroundColor:Colors.red,foregroundColor:Colors.white))),SizedBox(width:4),Expanded(child:ElevatedButton(onPressed:()=>doSearch(ctrl.text.isEmpty?'history':ctrl.text,mode:'all'),child:Text('ALL'),style:ElevatedButton.styleFrom(backgroundColor:Colors.deepPurple,foregroundColor:Colors.white))),]),if(searching) LinearProgressIndicator()])),Expanded(child:results.isEmpty?Center(child:Text('Search Google, YouTube, Wikipedia when data ON - saved + editable')):ListView.builder(padding:EdgeInsets.all(12),itemCount:results.length,itemBuilder:(_,i){var r=results[i];return Card(child:ListTile(title:Text(r['title']??'',style:TextStyle(fontWeight:FontWeight.bold)),subtitle:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text(r['snip']??''),Text(r['url']??'',style:TextStyle(fontSize:10,color:Colors.blue))]),trailing:IconButton(icon:Icon(Icons.edit),onPressed:(){final tec=TextEditingController(text:r['snip']??'');showDialog(context:c,builder:(_)=>AlertDialog(title:Text('Edit & Save'),content:TextField(controller:tec,maxLines:6),actions:[TextButton(onPressed:()=>Navigator.pop(c),child:Text('Cancel')),TextButton(onPressed:(){setState(()=>results[i]['snip']=tec.text);saveHist(ctrl.text,tec.text,'edited');Navigator.pop(c);},child:Text('Save'))]));})));}))]));}Future<void> doSearch(String q,{String mode='all'}) async {if(q.trim().isEmpty) return;setState(()=>{searching=true,results=[]});List<Map<String,String>> r=[];try{if(mode=='all'||mode=='wikipedia'){var w=await fetchWiki(q);r.addAll(w);}if(mode=='all'||mode=='google'){var g=await fetchDuck(q);r.addAll(g);}if(mode=='all'||mode=='youtube'){var y=await fetchYT(q);r.addAll(y);}if(r.isEmpty){var all=await fetchAll(q);r=all;}if(r.isNotEmpty) saveHist(q,r.map((e)=>e['title']!+': '+e['snip']!).join('\\n---\\n'),mode);}catch(e){r=[{'title':'ERROR','snip':e.toString(),'source':'google','url':''}];}setState(()=>{results=r,searching=false});}}class Chat extends StatefulWidget{final String subject;const Chat({super.key,required this.subject});@override State<Chat> createState()=>_ChatS();}class _ChatS extends State<Chat>{final ctrl=TextEditingController();List<Map<String,String>> msgs=[{'role':'ai','text':'V14.18 FULL INTERNET - Google+YouTube+Wiki + Save + Edit'}];List<Map<String,String>> myDocs=[];bool sending=false;@override void initState(){super.initState();ld();}Future<void> ld() async {final p=await SharedPreferences.getInstance();String? s=p.getString('mtrdf_docs_v10');if(s!=null) setState(()=>myDocs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))));final b=Hive.box('mtrdf_v14');String? h=b.get('docs');if(h!=null){try{myDocs=List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e)));setState((){});}catch(e){}}}String searchOffline(String q){if(myDocs.isEmpty) return '';String out='';int f=0;for(var d in myDocs){if(matches(d['content']??'',q,widget.subject)){f++;out+='FROM '+(d['name']??'')+':\\n'+snippet(d['content']??'',q)+'\\n\\n---\\n\\n';}}if(f==0) return '';return 'FOUND '+f.toString()+' offline:\\n\\n'+out;}Future<String> searchWithOnline(String q) async {String cleanQ=q.toLowerCase().replaceAll('define ','').trim();List<String> w=cleanQ.split(RegExp(r'\\s+')).where((x)=>x.length>2).toList();List<String> uniq=[];for(var x in w){if(!uniq.contains(x)) uniq.add(x);}String dedupQ=uniq.join(' ');if(dedupQ.isEmpty) dedupQ=q;String off=searchOffline(dedupQ);String comb='';if(off.isNotEmpty) comb+=off+'\\n\\n';try{var o=await fetchAll(dedupQ);if(o.isNotEmpty){comb+='ONLINE AI ('+o.length.toString()+'):\\n\\n';for(var r in o){comb+=r['title']!+'\\n'+(r['snip']??'')+'\\n'+(r['url']??'')+'\\n\\n---\\n\\n';}}else{comb+='No online.';}}catch(e){comb+='Online err: '+e.toString();}if(comb.isEmpty) comb='Add docs';return comb;}void send() async {if(ctrl.text.isEmpty||sending) return;String q=ctrl.text;setState(()=>{msgs.add({'role':'user','text':q}),sending=true});ctrl.clear();String a=await searchWithOnline(q);setState(()=>{msgs.add({'role':'ai','text':a}),sending=false});saveHist(q,a,'chat_'+widget.subject);}void editMsg(int idx)