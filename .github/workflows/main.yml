              return Scaffold(appBar: AppBar(title: Text('MTRDF AI Chat V14.37'), backgroundColor: Colors.deepPurple, foregroundColor: Colors.white, actions:[IconButton(icon: Icon(Icons.add), onPressed: (){ startNewChat(); })]), drawer: Drawer(child: ListView.builder(itemCount: conversations.length, itemBuilder: (_,i){ var conv=conversations[i]; return ListTile(title: Text(conv['title']??'', style: TextStyle(fontSize:12), maxLines:1), onTap: (){ Navigator.pop(c); loadConversation(i); }); })), body: Column(children:[
