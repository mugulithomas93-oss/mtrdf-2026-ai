name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create App Files
        run: |
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main() => runApp(const MTRDFApp());
          class MTRDFApp extends StatelessWidget {
            const MTRDFApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'MTRDF 2026 AI',
                theme: ThemeData(primarySwatch: Colors.green, useMaterial3: true),
                home: const HomePage(),
              );
            }
          }
          class HomePage extends StatelessWidget {
            const HomePage({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('MTRDF 2026 AI'), backgroundColor: Colors.green, foregroundColor: Colors.white, centerTitle: true),
                body: GridView.count(
                  crossAxisCount: 2,
                  padding: const EdgeInsets.all(12),
                  crossAxisSpacing: 12,
                  mainAxisSpacing: 12,
                  children: [
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.calculate, size: 40, color: Colors.blue), Text('Mathematics', style: TextStyle(fontWeight: FontWeight.bold))])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.biotech, size: 40, color: Colors.green), Text('Biology', style: TextStyle(fontWeight: FontWeight.bold))])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.science, size: 40, color: Colors.orange), Text('Chemistry', style: TextStyle(fontWeight: FontWeight.bold))])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.bolt, size: 40, color: Colors.purple), Text('Physics', style: TextStyle(fontWeight: FontWeight.bold))])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.history_edu, size: 40, color: Colors.brown), Text('History', style: TextStyle(fontWeight: FontWeight.bold))])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.public, size: 40, color: Colors.teal), Text('Geography', style: TextStyle(fontWeight: FontWeight.bold))])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.menu_book, size: 40, color: Colors.red), Text('English', style: TextStyle(fontWeight: FontWeight.bold))])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.grass, size: 40, color: Colors.lightGreen), Text('Agriculture', style: TextStyle(fontWeight: FontWeight.bold))])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.business, size: 40, color: Colors.indigo), Text('Commerce', style: TextStyle(fontWeight: FontWeight.bold))])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.computer, size: 40, color: Colors.cyan), Text('ICT', style: TextStyle(fontWeight: FontWeight.bold))])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.auto_stories, size: 40, color: Colors.amber), Text('RE', style: TextStyle(fontWeight: FontWeight.bold))])),
                  ],
                ),
              );
            }
          }
          DART
          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          description: MTRDF 2026 AI Education App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.2
          flutter:
            uses-material-design: true
          YAML
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          # restore our good file (create overwrites it)
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main() => runApp(const MTRDFApp());
          class MTRDFApp extends StatelessWidget {
            const MTRDFApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'MTRDF 2026 AI',
                theme: ThemeData(primarySwatch: Colors.green, useMaterial3: true),
                home: const HomePage(),
              );
            }
          }
          class HomePage extends StatelessWidget {
            const HomePage({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('MTRDF 2026 AI'), backgroundColor: Colors.green, foregroundColor: Colors.white, centerTitle: true),
                body: GridView.count(
                  crossAxisCount: 2,
                  padding: const EdgeInsets.all(12),
                  crossAxisSpacing: 12,
                  mainAxisSpacing: 12,
                  children: [
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.calculate, size: 40, color: Colors.blue), Text('Mathematics')])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.biotech, size: 40, color: Colors.green), Text('Biology')])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.science, size: 40, color: Colors.orange), Text('Chemistry')])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.bolt, size: 40, color: Colors.purple), Text('Physics')])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.history_edu, size: 40, color: Colors.brown), Text('History')])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.public, size: 40, color: Colors.teal), Text('Geography')])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.menu_book, size: 40, color: Colors.red), Text('English')])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.grass, size: 40, color: Colors.lightGreen), Text('Agriculture')])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.business, size: 40, color: Colors.indigo), Text('Commerce')])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.computer, size: 40, color: Colors.cyan), Text('ICT')])),
                    Card(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.auto_stories, size: 40, color: Colors.amber), Text('RE')])),
                  ],
                ),
              );
            }
          }
          DART
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MTRDF-2026-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
