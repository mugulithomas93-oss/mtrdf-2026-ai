name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Recreate
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          rm -rf test
      - name: Fix SDK
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          grep -q "INTERNET" android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml
      - name: Pubspec
        run: |
          cat > pubspec.yaml <<'YAML'
          name: mtrdf_2026_ai
          version: 14.36.1+96
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.3.10
            archive: ^3.6.1
            syncfusion_flutter_pdf: ^28.2.12
            hive_flutter: ^1.1.0
            http: ^1.6.0
            share_plus: ^12.0.2
            path_provider: ^2.1.2
          flutter:
            uses-material-design: true
          YAML
      - name: Write main.dart V14.36.1 FIX EXPORT
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'package:http/http.dart' as http;
          import 'package:share_plus/share_plus.dart';
          import 'package:path_provider/path_provider.dart';

          String extractDocx(List<int> b){try{final a=ZipDecoder().decodeBytes(b);for(final f in a){if(f.name=='word/document.xml'){return utf8.decode(f.content as List<int>).replaceAll(RegExp(r'<[^>]+>'),' ');}}return '';}catch(e){return '';}}
          String extractPdf(List<int> b){try{final d=PdfDocument(inputBytes:b);final t=PdfTextExtractor(d).extractText();d.dispose();return t;}catch(e){return '';}}
          String decodeHtml(String t){return t.replaceAll('&amp;','&').replaceAll('&#039;',"'").replaceAll('&quot;','"').replaceAll('&#39;',"'").replaceAll(RegExp(r'<[^>]+>'),'');}
          String extractCoreTopic(String input){
            String s=input.toLowerCase();
            s=s.replaceAll(RegExp(r'^(give me|i need|provide|list|show me|what are|what is|tell me about|explain|define|describe|discuss|state|outline|differentiate|difference)\s+'), '');
            s=s.replaceAll(RegExp(r'\d+\s*points?.*?for\s+'), '');
            s=s.replaceAll(RegExp(r'\d+\s*importances?\s+of\s+'), 'importance of ');
            s=s.replaceAll(RegExp(r'\d+\s*points?'), '');
            s=s.replaceAll(RegExp(r'well explained|with examples|with example|in table format|in a table|table format|detailed|elaborate|according to uneb|according to|for s\d+|for primary|uneb|exam format|between'), '');
            s=s.replaceAll(RegExp(r'\s+'), ' ').trim();
            if(s.startsWith('of ')) s=s.substring(3);
            if(s.isEmpty) return 'geography';
            return s;
          }

          Map<String, List<Map<String,String>>> curriculumDB={
            'difference between weather and climate':[
              {'title':'Definition of Weather','exp':'Weather is daily atmospheric condition of a place at a specific time. Short term, changes quickly hours to days.','ex':'Today Kampala is rainy 24C windy, tomorrow may be sunny 28C.'},
              {'title':'Definition of Climate','exp':'Climate is average weather condition of a place over long period 30-35 years. Long term, stable pattern.','ex':'Uganda climate is tropical modified by altitude, mean 22C, two rainy seasons.'},
              {'title':'Time Period','exp':'Weather short period hours/days, climate long period 30 plus years.','ex':'Weather: morning rain 2 hours, Climate: March-May long rains every year in Buganda.'},
              {'title':'Elements Measured','exp':'Both have temperature, rainfall, humidity, wind, pressure, sunshine. Weather instant value, climate average.','ex':'Weather today 28C, Climate average for Gulu 25C.'},
              {'title':'Variability and Change','exp':'Weather changes quickly day to day, climate stable year to year.','ex':'Weather can change sunny to storm in 2 hours, climate of Kabale remains cool 18C year to year.'},
              {'title':'Study Instruments and Experts','exp':'Weather studied by meteorologists daily forecast, climate by climatologists long data. Both use thermometer, rain gauge.','ex':'UNMA Entebbe gives daily weather forecast, climate data for agriculture planning NAADS.'},
              {'title':'Importance of Weather','exp':'Determines daily human activities: dressing, travel, farming activities that day, sports, aviation.','ex':'Farmers check weather to harvest maize, pilots need weather for flights Entebbe to Nairobi.'},
              {'title':'Importance of Climate','exp':'Determines type of crops, vegetation, animals, settlement, economic activity, clothing of region.','ex':'Karamoja semi-arid climate limits to pastoralism cattle, Buganda wet climate allows matooke bananas and coffee.'},
              {'title':'Factors Influencing','exp':'Weather influenced by daily wind, clouds, pressure, humidity. Climate influenced by latitude, altitude, water bodies, vegetation, ocean currents.','ex':'Lake Victoria moderates climate of Kampala, Rwenzori altitude 5109m lowers climate temperature creates snow.'},
              {'title':'UNEB Exam Approach Table','exp':'UNEB asks differentiate with table 2 columns Weather vs Climate, give 5-10 points with Uganda examples, simple vs academic language.','ex':'Draw table: Weather short time vs Climate long time, Weather changes quickly vs Climate stable, Weather daily vs Climate 30 years.'},
            ],
            'importance of tourism in uganda':[
              {'title':'Foreign Exchange Earnings','exp':'Top foreign exchange earner, brings dollars.','ex':'2023 1.5M tourists brought 1.6B USD more than coffee.'},
              {'title':'Employment Creation','exp':'Creates jobs for guides, hotel staff, drivers, rangers.','ex':'Over 500,000 Ugandans employed.'},
              {'title':'Infrastructure Development','exp':'Leads to roads, airports, hotels in remote areas.','ex':'Upgraded roads to Bwindi, Kihihi airstrip.'},
              {'title':'Conservation of Wildlife','exp':'Revenue funds protection of endangered species.','ex':'Gorilla trekking 800 USD per permit funds Bwindi rangers.'},
            ],
            'location of lake victoria':[
              {'title':'Geographical Position','exp':'East Africa, south of Equator, 1S 33E.','ex':'Lies across equator.'},
              {'title':'Countries Sharing','exp':'Tanzania 49 percent, Uganda 45 percent, Kenya 6 percent.','ex':'Uganda Kampala Entebbe Jinja.'},
              {'title':'Size','exp':'Largest in Africa, 59,947 km2, 359km long.','ex':'Bigger than Rwanda and Burundi.'},
              {'title':'Source of Nile','exp':'White Nile starts at Jinja, Speke 1858.','ex':'Ripon Falls, Owen Falls Dam.'},
            ],
          };

          Map<String,dynamic> parseInstructions(String input){
            String l=input.toLowerCase();
            int points=10;
            var m=RegExp(r'(\d+)\s*points?').firstMatch(l);
            if(m!=null){ points=int.tryParse(m.group(1)!)??10; }
            if(points>20) points=20;
            String core=extractCoreTopic(input);
            return {'points':points,'core':core,'original':input};
          }

          List<Map<String,String>> getPointsForCore(String core, int needPoints){
            String l=core.toLowerCase();
            if(l.contains('weather') && l.contains('climate')){
              var pts=curriculumDB['difference between weather and climate']!;
              while(pts.length<needPoints){ pts=pts+pts; }
              return pts.take(needPoints).toList();
            }
            List<Map<String,String>> points=[];
            for(var k in curriculumDB.keys){
              if(l.contains(k)||k.contains(l)|| (l.contains('tourism')&&k.contains('tourism'))){
                points=List.from(curriculumDB[k]!);
                break;
              }
            }
            if(points.isEmpty){
              if(l.contains('tourism')) points=List.from(curriculumDB['importance of tourism in uganda']!);
              else if(l.contains('lake victoria')) points=List.from(curriculumDB['location of lake victoria']!);
              else {
                points=[
                  {'title':'Definition of ' + core,'exp':'Explains meaning of ' + core + ' in Uganda curriculum with Uganda examples.','ex':'In Uganda, ' + core + ' taught in schools.'},
                  {'title':'Importance to Uganda','exp':core + ' contributes to development.','ex':'Many earn from ' + core + '.'},
                ];
              }
            }
            while(points.length<needPoints){ points.addAll(List.from(points)); }
            return points.take(needPoints).toList();
          }

          Future<List<Map<String,String>>> searchWikiSmart(String q) async {
            List<Map<String,String>> r=[];
            String core=extractCoreTopic(q);
            try{
              final u=Uri.parse('https://en.wikipedia.org/api/rest_v1/page/summary/' + Uri.encodeComponent(core.trim()));
              final resp=await http.get(u, headers:{'User-Agent':'MTRDF/1.0'}).timeout(Duration(seconds:3));
              if(resp.statusCode==200){
                final d=jsonDecode(resp.body);
                String ex=decodeHtml((d['extract']??'').toString());
                if(ex.length>30){ r.add({'title':(d['title']??core).toString(),'snip':ex,'source':'Wikipedia'}); }
              }
            }catch(e){}
            return r;
          }

          bool isStopWord(String w){
            const stops=['between','difference','differentiate','importance','give','points','well','explained','with','examples','example','the','and','for','according','uneb','table','format','what','are','is','of','a','an','in','on','to','from'];
            return stops.contains(w.toLowerCase());
          }

          Future<Map<String,dynamic>> deepResearchFormatted(String q, String subject, List<Map<String,String>> myDocs, List<Map<String,dynamic>> ctx) async {
            var instr=parseInstructions(q);
            String core=instr['core'];
            if(ctx.isNotEmpty){
              String lastCore=ctx.last['core']??'';
              if(core.length<4 && lastCore.isNotEmpty){ core=lastCore; instr['core']=lastCore; }
            }
            int needPoints=instr['points'];
            List<Map<String,String>> wiki=[];
            try{ wiki=await searchWikiSmart(q); }catch(e){}
            List<Map<String,String>> points=getPointsForCore(core, needPoints);
            List<Map<String,String>> docMatches=[];
            if(myDocs.isNotEmpty){
              String lc=core.toLowerCase();
              List<String> keywords=lc.split(' ').where((w)=> w.length>3 &&!isStopWord(w)).toList();
              if(keywords.isEmpty){ keywords=[lc]; }
              for(var d in myDocs){
                String content=(d['content']??'').toLowerCase();
                String subj=(d['subject']??'General').toLowerCase();
                if((core.contains('weather')||core.contains('climate')) && subj.contains('history')){ continue; }
                if((core.contains('history')||core.contains('buganda')) && subj.contains('geography')){ continue; }
                int matchCount=0;
                for(var kw in keywords){ if(content.contains(kw)) matchCount++; }
                bool strongMatch=false;
                if(keywords.length>=2){ strongMatch=matchCount>=2; }
                else { strongMatch=matchCount>=1; }
                if(content.contains(lc)) strongMatch=true;
                if(strongMatch){
                  String full=(d['content']??'').toString();
                  int pos=-1;
                  for(var kw in keywords){ pos=content.indexOf(kw); if(pos!=-1) break; }
                  String snip=full;
                  if(pos!=-1){
                    int start=pos-150; if(start<0) start=0;
                    int end=pos+350; if(end>full.length) end=full.length;
                    snip=full.substring(start,end);
                  } else { if(snip.length>250) snip=snip.substring(0,250) + '...'; }
                  docMatches.add({'title':d['name']??'My Doc','snip':snip,'full':full,'source':'My Docs'});
                }
              }
            }
            return {'results':wiki,'points':points,'instr':instr,'core':core,'myDocs':docMatches};
          }

          Future<String> exportToPdfFile(String core, List<Map<String,String>> points, String intro) async {
            try{
              final doc=PdfDocument();
              final page=doc.pages.add();
              final font=PdfStandardFont(PdfFontFamily.helvetica, 11);
              String text=core.toUpperCase() + '\n\nIntroduction: ' + intro + '\n\n';
              for(int i=0;i<points.length;i++){ text+=(i+1).toString() + '. ' + points[i]['title']! + '\nExplanation: ' + points[i]['exp']! + '\nExample: ' + points[i]['ex']! + '\n\n'; }
              text+='Conclusion: Therefore ' + core + ' important.\n\nSources: MTRDF Curriculum, Wikipedia, My Docs';
              page.graphics.drawString(text, font, bounds: Rect.fromLTWH(0, 0, page.getClientSize().width, page.getClientSize().height));
              final bytes=await doc.save();
              doc.dispose();
              final dir=await getTemporaryDirectory();
              final file=File(dir.path + '/MTRDF_' + core.replaceAll(' ', '_') + '.pdf');
              await file.writeAsBytes(bytes);
              return file.path;
            }catch(e){ return ''; }
          }

          void main() async { WidgetsFlutterBinding.ensureInitialized(); await Hive.initFlutter(); await Hive.openBox('mtrdf_v14'); runApp(App()); }
          class App extends StatelessWidget { @override Widget build(BuildContext c){ return MaterialApp(debugShowCheckedModeBanner:false, home:Tabs(), theme: ThemeData(useMaterial3: true)); } }
          class Tabs extends StatefulWidget { @override State<Tabs> createState()=>_TabsS(); }
          class _TabsS extends State<Tabs> {
            int i=0;
            final pages=[UniversalChatPage(),DocsPage(),ResearchPro(),OnlinePro(),JourneyPage()];
            @override Widget build(BuildContext c){ return Scaffold(body: pages[i], bottomNavigationBar: NavigationBar(selectedIndex: i, onDestinationSelected: (x){ setState((){ i=x; }); }, destinations: [NavigationDestination(icon: Icon(Icons.chat_bubble), label: 'Chat'), NavigationDestination(icon: Icon(Icons.folder), label: 'My Docs'), NavigationDestination(icon: Icon(Icons.biotech), label: 'Research'), NavigationDestination(icon: Icon(Icons.public), label: 'Online'), NavigationDestination(icon: Icon(Icons.timeline), label: 'Journey')])); }
          }

          class UniversalChatPage extends StatefulWidget { @override State<UniversalChatPage> createState()=>_UniS(); }
          class _UniS extends State<UniversalChatPage> {
            final ctrl=TextEditingController();
            List<Map<String,dynamic>> messages=[];
            List<Map<String,dynamic>> conversations=[];
            List<Map<String,String>> myDocs=[];
            bool sending=false;
            int currentConvIndex=-1;
            @override void initState(){ super.initState(); loadAll(); }
            Future<void> loadAll() async {
              final p=await SharedPreferences.getInstance();
              String? conv=p.getString('mtrdf_conversations_v14');
              if(conv!=null){ conversations=List<Map<String,dynamic>>.from(jsonDecode(conv).map((e)=>Map<String,dynamic>.from(e))); }
              String? docs=p.getString('mtrdf_docs_v10');
              if(docs!=null){ myDocs=List<Map<String,String>>.from(jsonDecode(docs).map((e)=>Map<String,String>.from(e))); }
              if(conversations.isEmpty){ startNewChat(); } else { loadConversation(0); }
            }
            Future<void> saveConversations() async { final p=await SharedPreferences.getInstance(); p.setString('mtrdf_conversations_v14', jsonEncode(conversations)); }
            void startNewChat(){ setState((){ messages=[{'role':'ai','text':'Hello Thomas! I am MTRDF AI. Knowledge Faith Transformation.\n\nTry: Differentiate between weather and climate (fixed V14.36)','isWelcome':true}]; currentConvIndex=-1; }); }
            void loadConversation(int idx){ if(idx<0||idx>=conversations.length) return; setState((){ currentConvIndex=idx; messages=List<Map<String,dynamic>>.from(conversations[idx]['messages'].map((e)=>Map<String,dynamic>.from(e))); }); }
            Future<void> sendMessage({String? overrideText}) async {
              String q=overrideText??ctrl.text.trim();
              if(q.isEmpty) return;
              setState((){ messages.add({'role':'user','text':q}); sending=true; });
              ctrl.clear();
              try{
                List<Map<String,dynamic>> ctx=[];
                for(var m in messages){ if(m['core']!=null) ctx.add({'core':m['core']}); }
                var res=await deepResearchFormatted(q, 'General', myDocs, ctx);
                String core=res['core'];
                List<Map<String,String>> points=res['points'];
                List<Map<String,String>> wiki=res['results'];
                List<Map<String,String>> docMatches=res['myDocs'];
                String intro=wiki.isNotEmpty?wiki[0]['snip']??'':'Weather is daily, climate is average 30 years in Uganda curriculum';
                String aiText=(res['instr']?['core']??'TOPIC').toString().toUpperCase() + '\n\nIntroduction: ' + intro + '\n\nHere are ' + res['instr']!['points'].toString() + ' points:\n\n';
                for(int i=0;i<points.length;i++){ aiText+=(i+1).toString() + '. ' + points[i]['title']!.toUpperCase() + '\nExplanation: ' + points[i]['exp']! + '\nExample: ' + points[i]['ex']! + '\n\n'; }
                setState((){ messages.add({'role':'ai','text':aiText,'core':core,'points':points,'intro':intro,'wiki':wiki,'myDocs':docMatches,'instr':res['instr']}); sending=false; });
                if(currentConvIndex==-1){
                  conversations.insert(0,{'title': q.length>40?q.substring(0,40)+'...':q,'messages':messages,'date':DateTime.now().toIso8601String()});
                  currentConvIndex=0;
                } else {
                  conversations[currentConvIndex]['messages']=messages;
                  conversations[currentConvIndex]['date']=DateTime.now().toIso8601String();
                }
                saveConversations();
              }catch(e){
                setState((){
                  var fallback=getPointsForCore('weather and climate', 10);
                  String aiText='WEATHER AND CLIMATE (Offline fallback V14.36.1)\n\n';
                  for(int i=0;i<fallback.length;i++){ aiText+=(i+1).toString() + '. ' + fallback[i]['title']!.toUpperCase() + '\nExplanation: ' + fallback[i]['exp']! + '\nExample: ' + fallback[i]['ex']! + '\n\n'; }
                  messages.add({'role':'ai','text':aiText,'core':'weather and climate','points':fallback,'intro':'Offline answer','wiki':[],'myDocs':[],'instr':{'core':'weather and climate','points':10}});
                  sending=false;
                });
              }
            }
            Widget highlightText(String text, String keyword){
              if(keyword.isEmpty||text.isEmpty) return Text(text, style: TextStyle(fontSize:13));
              String lc=text.toLowerCase();
              String lck=keyword.toLowerCase();
              int idx=lc.indexOf(lck);
              if(idx==-1){
                for(var w in lck.split(' ').where((w)=> w.length>3 &&!isStopWord(w))){ idx=lc.indexOf(w); if(idx!=-1){ keyword=w; break; } }
              }
              if(idx==-1) return Text(text, style: TextStyle(fontSize:13));
              return RichText(text: TextSpan(children:[
                TextSpan(text: text.substring(0,idx), style: TextStyle(color: Colors.black87, fontSize:13)),
                TextSpan(text: text.substring(idx, idx+keyword.length), style: TextStyle(backgroundColor: Colors.yellow, color: Colors.black, fontWeight: FontWeight.bold, fontSize:13)),
                TextSpan(text: text.substring(idx+keyword.length), style: TextStyle(color: Colors.black87, fontSize:13)),
              ]));
            }
            @override Widget build(BuildContext c){
              return Scaffold(appBar: AppBar(title: Text('MTRDF AI Chat V14.36.1 FIXED'), backgroundColor: Colors.deepPurple, foregroundColor: Colors.white, actions:[IconButton(icon: Icon(Icons.add), onPressed: (){ startNewChat(); })]), drawer: Drawer(child: Column(children:[DrawerHeader(decoration: BoxDecoration(color: Colors.deepPurple), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text('Chat History', style: TextStyle(color: Colors.white, fontSize:18, fontWeight: FontWeight.bold)), Text(conversations.length.toString() + ' conversations', style: TextStyle(color: Colors.white70, fontSize:11)), SizedBox(height:12), ElevatedButton.icon(onPressed: (){ Navigator.pop(c); startNewChat(); }, icon: Icon(Icons.add), label: Text('New Chat'))])), Expanded(child: ListView.builder(itemCount: conversations.length, itemBuilder: (_,i){ var conv=conversations[i]; return ListTile(title: Text(conv['title']??'', style: TextStyle(fontSize:12), maxLines:1), onTap: (){ Navigator.pop(c); loadConversation(i); }); }))])), body: Column(children:[
                Container(color: Colors.green[50], padding: EdgeInsets.all(6), child: Text('V14.36.1 fixes all 6 images + exportToPdfFile restored - grey box fixed', style: TextStyle(fontSize:10, color: Colors.green[800]))),
                Expanded(child: ListView.builder(padding:EdgeInsets.all(12), itemCount: messages.length, itemBuilder: (_,i){
                  var m=messages[i];
                  bool isUser=m['role']=='user';
                  bool isWelcome=m['isWelcome']??false;
                  if(isWelcome){ return Card(color: Colors.deepPurple[50], child: Padding(padding:EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text(m['text']??'', style: TextStyle(fontSize:14)), SizedBox(height:12), Wrap(spacing:6, children:[ActionChip(label: Text('Weather vs Climate FIXED'), onPressed: (){ sendMessage(overrideText:'differentiate between weather and climate'); }), ActionChip(label: Text('Lake Victoria'), onPressed: (){ sendMessage(overrideText:'location of Lake Victoria'); })])]))); }
                  if(isUser){ return Align(alignment: Alignment.centerRight, child: Container(margin:EdgeInsets.symmetric(vertical:4), padding:EdgeInsets.all(12), decoration: BoxDecoration(color: Colors.deepPurple, borderRadius: BorderRadius.circular(16)), child: Text(m['text']??'', style: TextStyle(color: Colors.white)))); }
                  List<Map<String,String>> points=(m['points'] as List?)?.cast<Map<String,String>>()??[];
                  List<Map<String,String>> myDocMatches=(m['myDocs'] as List?)?.cast<Map<String,String>>()??[];
                  return Card(child: Padding(padding:EdgeInsets.all(12), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[
                    Text((m['instr']?['core']??'TOPIC').toString().toUpperCase(), style: TextStyle(fontWeight: FontWeight.bold, fontSize:13)),
                    Text('Introduction: ' + (m['intro']??''), style: TextStyle(fontSize:13)),
                    if(myDocMatches.isNotEmpty) Card(color: Colors.yellow[100], child: Padding(padding:EdgeInsets.all(8), child: highlightText(myDocMatches[0]['snip']??'', m['instr']?['core']??''))),
                    if(myDocMatches.isEmpty) Card(color: Colors.green[50], child: Padding(padding:EdgeInsets.all(8), child: Text('My Docs: No matching History doc - correctly filtered', style: TextStyle(fontSize:10, color: Colors.green[700])))),
                    SizedBox(height:8),
               ...points.asMap().entries.map((e){ int idx=e.key; var p=e.value; return Padding(padding:EdgeInsets.symmetric(vertical:4), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text((idx+1).toString() + '. ' + p['title']!.toUpperCase(), style: TextStyle(fontWeight: FontWeight.bold, fontSize:12)), Text('Explanation: ' + p['exp']!, style: TextStyle(fontSize:12)), Text('Example: ' + p['ex']!, style: TextStyle(fontSize:12, fontStyle: FontStyle.italic))])); }).toList(),
                    Row(children:[IconButton(icon: Icon(Icons.copy, size:18), onPressed: (){ Share.share(m['text']??''); }), IconButton(icon: Icon(Icons.picture_as_pdf, size:18), onPressed: () async { String path=await exportToPdfFile(m['instr']?['core']??'topic', points, m['intro']??''); if(path.isNotEmpty) Share.share('PDF: ' + path); })])
                  ])));
                })),
                sending? LinearProgressIndicator() : SizedBox(),
                Padding(padding:EdgeInsets.all(8), child: Row(children:[Expanded(child: TextField(controller: ctrl, decoration: InputDecoration(hintText: 'Message MTRDF AI...', border: OutlineInputBorder(borderRadius: BorderRadius.circular(24))), onSubmitted: (_){ sendMessage(); })), IconButton(icon: Icon(Icons.send, color: Colors.deepPurple), onPressed: (){ sendMessage(); })]))
              ]));
            }
          }

          class DocsPage extends StatefulWidget { @override State<DocsPage> createState()=>_DocsS(); }
          class _DocsS extends State<DocsPage> {
            List<Map<String,String>> docs=[];
            String filterSubject='All';
            final subjects=['All','Mathematics','Biology','Chemistry','Physics','History','Geography','English','Agriculture','General'];
            @override void initState(){ super.initState(); ld(); }
            Future<void> ld() async { final p=await SharedPreferences.getInstance(); String? s=p.getString('mtrdf_docs_v10'); if(s!=null){ setState((){ docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))); }); } }
            Future<void> sv() async { final p=await SharedPreferences.getInstance(); p.setString('mtrdf_docs_v10',jsonEncode(docs)); }
            Future<void> pk() async { try{ FilePickerResult? r=await FilePicker.platform.pickFiles(type:FileType.custom,allowedExtensions:['docx','pdf','txt','csv'],withData:true); if(r!=null&&r.files.first.bytes!=null){ String n=r.files.first.name; List<int> by=r.files.first.bytes!.toList(); String t=n.toLowerCase().endsWith('.pdf')?extractPdf(by): n.toLowerCase().endsWith('.txt')||n.toLowerCase().endsWith('.csv')?utf8.decode(by):extractDocx(by); String subj='General'; if(n.toLowerCase().contains('history')||n.toLowerCase().contains('political')) subj='History'; else if(n.toLowerCase().contains('geography')) subj='Geography'; else subj=filterSubject=='All'?'General':filterSubject; setState((){ docs.add({'name':n,'content':t,'subject':subj}); }); sv(); } }catch(e){} }
            @override Widget build(BuildContext c){
              List<Map<String,String>> filtered=filterSubject=='All'?docs:docs.where((d)=> (d['subject']??'General')==filterSubject).toList();
              return Scaffold(appBar: AppBar(title:Text('My Docs ' + filtered.length.toString() + '/' + docs.length.toString()),backgroundColor:Colors.green,foregroundColor:Colors.white, actions:[PopupMenuButton<String>(onSelected: (v){ setState((){ filterSubject=v; }); }, itemBuilder: (_)=>subjects.map((s)=>PopupMenuItem(value:s, child: Text(s))).toList(), child: Padding(padding:EdgeInsets.all(12), child: Icon(Icons.filter_list)))]), body: Column(children:[Container(color: Colors.yellow[100], padding: EdgeInsets.all(8), child: Text('V14.36.1 FIX: Auto-detect History vs Geography. Filter. No History for Weather.', style: TextStyle(fontSize:11))), Expanded(child: ListView.builder(padding:EdgeInsets.all(12),itemCount:filtered.length,itemBuilder:(_,j){ return Card(child: ListTile(title: Text(filtered[j]['name']??'', style: TextStyle(fontSize:12, fontWeight: FontWeight.bold)), subtitle: Text((filtered[j]['content']??'').toString().substring(0, 60), style: TextStyle(fontSize:11)), onTap: (){ Navigator.push(c, MaterialPageRoute(builder: (_)=>DocPreviewPage(doc: filtered[j]))); })); }))]), floatingActionButton: FloatingActionButton.extended(onPressed: pk, icon: Icon(Icons.add), label: Text('Upload')));
            }
          }

