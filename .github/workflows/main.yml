name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build MTRDF V14.1 FIX
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          version: 14.1.0+49
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.1.9
            archive: ^3.6.1
            path_provider: ^2.1.2
            syncfusion_flutter_pdf: ^28.2.7
            flutter_map: ^7.0.2
            latlong2: ^0.9.0
            hive_flutter: ^1.1.0
            pdf: ^3.11.1
            share_plus: ^12.0.2
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:flutter_map/flutter_map.dart';
          import 'package:latlong2/latlong.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'dart:convert';

          String extractDocx(List<int> bytes) {
            try {
              final archive = ZipDecoder().decodeBytes(bytes);
              for (final f in archive) {
                if (f.name == 'word/document.xml') {
                  final xml = utf8.decode(f.content as List<int>);
                  return RegExp(r'<w:t[^>]*>([^<]+)</w:t>').allMatches(xml).map((m) => m.group(1)??'').join(' ');
                }
              }
              return "No xml";
            } catch (e) { return "Error $e"; }
          }
          String extractPdf(List<int> bytes) {
            try {
              final doc = PdfDocument(inputBytes: bytes);
              String text = PdfTextExtractor(doc).extractText();
              doc.dispose();
              return text.isEmpty? "PDF scanned?" : text;
            } catch (e) { return "PDF Error $e"; }
          }
          String snippet(String content, String query) {
            final lower = content.toLowerCase();
            final kws = query.toLowerCase().split(RegExp(r'\s+')).where((w)=>w.length>2).toList();
            int pos=-1; for(var kw in kws){ int p=lower.indexOf(kw); if(p!=-1){ pos=p; break; } }
            if(pos==-1) pos=lower.indexOf(query.toLowerCase());
            if(pos==-1) return content.length>600? content.substring(0,600)+"..." : content;
            int s=pos-250; if(s<0) s=0; int e=pos+600; if(e>content.length) e=content.length;
            String t=content.substring(s,e); if(s>0) t="..."+t; if(e<content.length) t=t+"..."; return t;
          }
          bool matches(String content, String query, String subject) {
            final lower=content.toLowerCase(); final q=query.toLowerCase().trim(); if(q.isEmpty) return false;
            final subj=subject.toLowerCase();
            // SUBJECT FILTER - V14.1 FIX for Biology bug
            if(subj!="geographylab" && subj!="research" && subj.isNotEmpty){
              if(lower.contains(subj)) return lower.contains(q) || q.split(RegExp(r'\s+')).any((kw)=>kw.length>2 && lower.contains(kw));
              // if doc doesn't contain subject, still allow if query contains subject word, but penalize generic "define"
              if(q.contains(subj)) return true;
              if(q.split(RegExp(r'\s+')).length==2 && q.startsWith("define ")){
                // define biology -> must have biology in doc, not just define
                String target=q.replaceAll("define ","").trim();
                if(target.length>2 &&!lower.contains(target) && lower.contains("geography")) return false;
              }
            }
            if(lower.contains(q)) return true;
            final kws=q.split(RegExp(r'\s+')).where((w)=>w.length>2).toList();
            for(var kw in kws){ if(lower.contains(kw)) return true; }
            return false;
          }
          Widget highlightText(String text, String query) {
            final lower=text.toLowerCase(); final kws=query.toLowerCase().split(RegExp(r'\s+')).where((w)=>w.length>2).toList();
            if(kws.isEmpty) return Text(text);
            String? best; int bestPos=-1; for(var kw in kws){ int p=lower.indexOf(kw); if(p!=-1 && (bestPos==-1||p<bestPos)){ bestPos=p; best=kw; } }
            if(best==null) return Text(text);
            List<TextSpan> spans=[]; int idx=0;
            while(true){ int pos=lower.indexOf(best, idx); if(pos==-1){ spans.add(TextSpan(text:text.substring(idx))); break; } if(pos>idx) spans.add(TextSpan(text:text.substring(idx,pos))); spans.add(TextSpan(text:text.substring(pos,pos+best.length), style: TextStyle(backgroundColor: Colors.yellow, fontWeight: FontWeight.bold, color: Colors.black))); idx=pos+best.length; }
            return RichText(text: TextSpan(style: TextStyle(color: Colors.black87, fontSize: 14), children: spans));
          }
          void main() async { WidgetsFlutterBinding.ensureInitialized(); await Hive.initFlutter(); await Hive.openBox('mtrdf_v14'); runApp(const App()); }
          class App extends StatelessWidget{ const App({super.key}); @override Widget build(BuildContext c){ return MaterialApp(debugShowCheckedModeBanner:false, home: Tabs()); } }
          class Tabs extends StatefulWidget{ @override State<Tabs> createState()=>_TabsS(); }
          class _TabsS extends State<Tabs>{ int i=0; final pages=[Home(), Docs(), GeoMap(), Research()]; @override Widget build(BuildContext c){ return Scaffold(body: pages[i], bottomNavigationBar: BottomNavigationBar(type: BottomNavigationBarType.fixed, currentIndex:i, onTap:(x)=>setState(()=>i=x), selectedItemColor:Colors.green, items: const [BottomNavigationBarItem(icon: Icon(Icons.school), label:"Subjects"), BottomNavigationBarItem(icon: Icon(Icons.folder), label:"My Docs"), BottomNavigationBarItem(icon: Icon(Icons.map), label:"GeographyLab"), BottomNavigationBarItem(icon: Icon(Icons.search), label:"Research")])); } }
          class Home extends StatelessWidget{ @override Widget build(BuildContext c){ final s=["Mathematics","Biology","Chemistry","Physics","History","Geography","English","Agriculture"]; return Scaffold(appBar: AppBar(title: Text('MTRDF V14.1 FIX'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: ListView.builder(padding: EdgeInsets.all(12), itemCount:s.length, itemBuilder:(_,j){ return Card(child: ListTile(leading: Icon(Icons.book, color: Colors.green), title: Text(s[j]), subtitle: Text("V14.1 - Subject Filter FIX"), onTap:(){ Navigator.push(c, MaterialPageRoute(builder:(_)=> Chat(subject: s[j]))); })); })); } }
          class Docs extends StatefulWidget{ @override State<Docs> createState()=>_DocsS(); }
          class _DocsS extends State<Docs>{ List<Map<String,String>> docs=[]; bool loading=false; @override void initState(){ super.initState(); _load(); } Future<void> _load() async { final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs_v10"); if(s!=null) docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))); final box=Hive.box('mtrdf_v14'); String? h=box.get('docs'); if(h!=null){ try{ docs=List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e))); }catch(e){} } setState((){}); } Future<void> _save() async { final p=await SharedPreferences.getInstance(); p.setString("mtrdf_docs_v10", jsonEncode(docs)); Hive.box('mtrdf_v14').put('docs', jsonEncode(docs)); } Future<void> _pick() async { setState(()=>loading=true); try{ FilePickerResult? r=await FilePicker.platform.pickFiles(type: FileType.custom, allowedExtensions:['docx','pdf'], withData:true); if(r!=null&&r.files.first.bytes!=null){ String name=r.files.first.name; List<int> bytes=r.files.first.bytes!.toList(); String t=name.toLowerCase().endsWith('.pdf')? extractPdf(bytes): extractDocx(bytes); setState(()=>docs.add({"name":name,"content":t,"date":DateTime.now().toString().substring(0,10),"type":name.toLowerCase().endsWith('.pdf')?"pdf":"docx"})); _save(); } }catch(e){} setState(()=>loading=false); } @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text('My Docs V14.1 - ${docs.length}'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: loading? Center(child: CircularProgressIndicator(color: Colors.green)): docs.isEmpty? Center(child: Text("No docs")): ListView.builder(padding: EdgeInsets.all(12), itemCount:docs.length, itemBuilder:(_,j){ var d=docs[j]; return Card(child: ListTile(leading: Icon(d["type"]=="pdf"? Icons.picture_as_pdf: Icons.description, color: d["type"]=="pdf"? Colors.red: Colors.blue), title: Text(d["name"]??""), subtitle: Text("${d["type"]} - ${(d["content"]??"").length} chars"), trailing: IconButton(icon: Icon(Icons.delete), onPressed:(){ setState(()=>docs.removeAt(j)); _save(); })))); }), floatingActionButton: FloatingActionButton.extended(onPressed: _pick, backgroundColor: Colors.green, icon: Icon(Icons.add, color: Colors.white), label: Text("Add DOCX/PDF", style: TextStyle(color: Colors.white)))); } }
          class GeoMap extends StatelessWidget{
            @override Widget build(BuildContext context){
              final lakes=[{"name":"Lake Victoria","lat":0.0,"lng":33.0,"q":"Lake Victoria climatology","color":Colors.blue}, {"name":"Lake Albert","lat":1.8,"lng":30.8,"q":"Lake Albert Rift Valley","color":Colors.brown}, {"name":"Lake Kyoga","lat":1.5,"lng":33.0,"q":"Lake Kyoga Nile","color":Colors.teal}, {"name":"Lake Edward","lat":-0.3,"lng":29.6,"q":"Rift Valley lakes","color":Colors.orange}];
              return Scaffold(appBar: AppBar(title: Text('GeographyLab - V14.1 MAP'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Column(children:[ Expanded(flex:3, child: FlutterMap(options: MapOptions(initialCenter: LatLng(1.5,32.0), initialZoom: 6.5), children:[ TileLayer(urlTemplate: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', userAgentPackageName: 'mtrdf_2026_ai'), MarkerLayer(markers: lakes.map((l)=> Marker(point: LatLng(l["lat"] as double, l["lng"] as double), width:120, height:50, child: GestureDetector(onTap:(){ Navigator.push(context, MaterialPageRoute(builder:(_)=> Research(initialQuery: l["q"] as String))); }, child: Column(children:[Icon(Icons.location_on, color: l["color"] as Color, size:30), Container(padding: EdgeInsets.symmetric(horizontal:4,vertical:1), decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(4), border: Border.all(color: l["color"] as Color)), child: Text(l["name"] as String, style: TextStyle(fontSize:9,fontWeight: FontWeight.bold))) ])))).toList()), ]), ), Expanded(flex:2, child: ListView(padding: EdgeInsets.all(8), children:[ Card(color: Colors.green[50], child: ListTile(leading: Icon(Icons.map, color: Colors.green), title: Text("V14.1 MAP - Tap pin → Research"), subtitle: Text("Subject filter FIX for Biology bug"))),...lakes.map((l)=> Card(child: ListTile(leading: Icon(Icons.water, color: l["color"] as Color), title: Text(l["name"] as String), subtitle: Text("Tap → '${l["q"]}'"), onTap:(){ Navigator.push(context, MaterialPageRoute(builder:(_)=> Research(initialQuery: l["q"] as String))); }))).toList(), ]), ]), );
            }
          }
          class Research extends StatefulWidget{ final String initialQuery; const Research({super.key, this.initialQuery=""}); @override State<Research> createState()=>_ResS(); }
          class _ResS extends State<Research>{ final _c=TextEditingController(); List<Map<String,String>> res=[]; String lastQuery=""; @override void initState(){ super.initState(); if(widget.initialQuery.isNotEmpty){ _c.text=widget.initialQuery; Future.delayed(Duration(milliseconds:300), ()=>_search(widget.initialQuery)); } } Future<void> _search(String q) async { lastQuery=q; final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs_v10"); List<Map<String,String>> docs=[]; if(s!=null) docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))); final box=Hive.box('mtrdf_v14'); String? h=box.get('docs'); if(h!=null){ try{ docs=List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e))); }catch(e){} } List<Map<String,String>> r=[]; for(var d in docs){ if(matches(d["content"]??"", q, "research")) r.add({"title":"FROM ${(d["type"]??"").toUpperCase()}: ${d["name"]??""}", "snip":snippet(d["content"]??"", q)}); } setState(()=>res=r); } @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text('Research V14.1'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Column(children: [Padding(padding: EdgeInsets.all(12), child: Row(children: [Expanded(child: TextField(controller:_c, decoration: InputDecoration(hintText:"Search...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted:_search)), IconButton(icon: Icon(Icons.search, color: Colors.green), onPressed:()=>_search(_c.text))])), Expanded(child: res.isEmpty? Center(child: Text(lastQuery.isEmpty? "Tap map pin" : "No match")): ListView.builder(padding: EdgeInsets.all(12), itemCount:res.length, itemBuilder:(_,i){ var r=res[i]; return Card(color: Colors.green[50], child: ListTile(title: Text(r["title"]??"", style: TextStyle(fontWeight: FontWeight.bold, fontSize:13)), subtitle: highlightText(r["snip"]??"", lastQuery))); })) ])); } }
          class Chat extends StatefulWidget{ final String subject; const Chat({super.key, required this.subject}); @override State<Chat> createState()=>_ChatS(); }
          class _ChatS extends State<Chat>{ final _c=TextEditingController(); final List<Map<String,String>> msgs=[{"role":"ai","text":"V14.1 Subject Filter FIX - Biology won't show Geography"}]; List<Map<String,String>> myDocs=[]; @override void initState(){ super.initState(); _load(); } Future<void> _load() async { final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs_v10"); if(s!=null) setState(()=>myDocs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)))); final box=Hive.box('mtrdf_v14'); String? h=box.get('docs'); if(h!=null){ try{ myDocs=List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e))); setState((){}); }catch(e){} } } String _search(String q){ if(myDocs.isEmpty) return "No docs."; String out=""; int f=0; for(var d in myDocs){ if(matches(d["content"]??"", q, widget.subject)){ f++; out+="FROM '${d["name"]??""}':\n${snippet(d["content"]??"", q)}\n\n---\n\n"; } } if(f==0) return "No match for '$q' in ${widget.subject}. You have ${myDocs.length} docs but none for ${widget.subject}. Add a ${widget.subject} DOCX/PDF in My Docs. (V14.1 FIX: Biology won't return Geography)"; return "✅ V14.1 FOUND $f for ${widget.subject}:\n\n$out"; } void _send(){ if(_c.text.isEmpty) return; String q=_c.text; setState((){ msgs.add({"role":"user","text":q}); msgs.add({"role":"ai","text":_search(q)}); }); _c.clear(); } @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text('${widget.subject} - ${myDocs.length} docs V14.1'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Column(children: [Expanded(child: ListView.builder(padding: EdgeInsets.all(12), itemCount:msgs.length, itemBuilder:(_,i){ final m=msgs[i]; bool u=m["role"]=="user"; return Align(alignment:u? Alignment.centerRight: Alignment.centerLeft, child: Container(margin: EdgeInsets.symmetric(vertical:4), padding: EdgeInsets.all(12), decoration: BoxDecoration(color:u? Colors.green: Colors.grey[200], borderRadius: BorderRadius.circular(12)), child: Text(m["text"]??""))); })), Padding(padding: EdgeInsets.all(8), child: Row(children: [Expanded(child: TextField(controller:_c, decoration: InputDecoration(hintText:"Ask ${widget.subject}...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted:(_)=>_send())), IconButton(icon: Icon(Icons.send, color: Colors.green), onPressed:_send)])) ])); } }
          DART
          flutter pub get
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTRDF-V14-1-FIX
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
