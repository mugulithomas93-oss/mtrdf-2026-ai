name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Recreate
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          rm -rf test
      - name: Fix SDK
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          grep -q "INTERNET" android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml
      - name: Pubspec
        run: |
          cat > pubspec.yaml <<'YAML'
          name: mtrdf_2026_ai
          version: 14.21.0+77
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.1.9
            archive: ^3.6.1
            syncfusion_flutter_pdf: ^28.2.7
            hive_flutter: ^1.1.0
            http: ^1.2.2
            share_plus: ^12.0.2
            url_launcher: ^6.2.5
          flutter:
            uses-material-design: true
          YAML
      - name: Write main.dart GREEN
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'package:http/http.dart' as http;
          import 'package:share_plus/share_plus.dart';
          import 'package:url_launcher/url_launcher.dart';

          String extractDocx(List<int> b) {
            try {
              final a = ZipDecoder().decodeBytes(b);
              for (final f in a) {
                if (f.name == 'word/document.xml') {
                  final x = utf8.decode(f.content as List<int>);
                  return x.replaceAll(RegExp(r'<[^>]+>'), ' ');
                }
              }
              return 'No xml';
            } catch (e) { return 'Err'; }
          }

          String extractPdf(List<int> b) {
            try {
              final d = PdfDocument(inputBytes: b);
              final t = PdfTextExtractor(d).extractText();
              d.dispose();
              return t.isEmpty? 'Scanned' : t;
            } catch (e) { return 'PDF Err'; }
          }

          Future<List<Map<String,String>>> fetchWiki(String term) async {
            List<Map<String,String>> o = [];
            try {
              String t = term.trim().isEmpty? 'History' : term.trim();
              final u1 = Uri.parse('https://en.wikipedia.org/api/rest_v1/page/summary/${Uri.encodeComponent(t)}');
              final r1 = await http.get(u1, headers: {'User-Agent':'MTRDF/1.0'}).timeout(Duration(seconds:10));
              if (r1.statusCode == 200) {
                final d = jsonDecode(r1.body);
                String ex = (d['extract']??'').toString();
                if (ex.length > 30) o.add({'title':'WIKIPEDIA: ${d['title']??t}','snip':ex,'source':'wiki','url':'https://en.wikipedia.org/wiki/${Uri.encodeComponent(t)}'});
              }
            } catch (e) {}
            if (o.isEmpty) {
              try {
                String t = term.trim().isEmpty? 'History' : term.trim();
                final u2 = Uri.parse('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${Uri.encodeComponent(t)}&format=json&origin=*');
                final r2 = await http.get(u2, headers: {'User-Agent':'MTRDF/1.0'}).timeout(Duration(seconds:10));
                if (r2.statusCode == 200) {
                  final d = jsonDecode(r2.body);
                  var search = d['query']?['search'] as List?;
                  if (search!= null) {
                    for (var s in search.take(3)) {
                      String title = (s['title']??'').toString();
                      String snip = (s['snippet']??'').toString().replaceAll(RegExp(r'<[^>]+>'), '');
                      if (title.isNotEmpty) o.add({'title':'WIKIPEDIA: $title','snip':snip,'source':'wiki','url':'https://en.wikipedia.org/wiki/${Uri.encodeComponent(title)}'});
                    }
                  }
                }
              } catch (e) {}
            }
            return o;
          }

          Future<List<Map<String,String>>> fetchDuck(String term) async {
            List<Map<String,String>> o = [];
            try {
              final u = Uri.parse('https://api.duckduckgo.com/?q=${Uri.encodeComponent(term)}&format=json&pretty=1&no_html=1');
              final r = await http.get(u).timeout(Duration(seconds:10));
              if (r.statusCode == 200) {
                final d = jsonDecode(r.body);
                String at = (d['AbstractText']??'').toString();
                if (at.length > 30) o.add({'title':'GOOGLE: ${d['Heading']??term}','snip':at,'source':'google','url':(d['AbstractURL']??'').toString()});
              }
            } catch (e) {}
            if (o.isEmpty) {
              var w = await fetchWiki(term);
              for (var item in w) { o.add({'title':item['title']!.replaceAll('WIKIPEDIA:', 'GOOGLE:'),'snip':item['snip']!,'source':'google','url':item['url']!}); }
            }
            return o;
          }

          Future<List<Map<String,String>>> fetchYT(String term) async {
            return [{'title':'YOUTUBE: $term','snip':'Tap OPEN to watch $term','source':'youtube','url':'https://www.youtube.com/results?search_query=${Uri.encodeComponent(term)}'}];
          }

          Future<List<Map<String,String>>> fetchAll(String q) async {
            String clean = q.toLowerCase().replaceAll('define ', '').trim();
            if (clean.isEmpty) clean = 'history';
            List<Map<String,String>> all = [];
            all.addAll(await fetchWiki(clean));
            all.addAll(await fetchDuck(clean));
            all.addAll(await fetchYT(clean));
            if (all.isEmpty) all.add({'title':'OFFLINE','snip':'No internet','source':'offline','url':''});
            return all;
          }

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Hive.initFlutter();
            await Hive.openBox('mtrdf_v14');
            runApp(App());
          }

          class App extends StatelessWidget {
            @override Widget build(BuildContext c) { return MaterialApp(debugShowCheckedModeBanner:false, home:Tabs()); }
          }

          class Tabs extends StatefulWidget { @override State<Tabs> createState()=>_TabsS(); }
          class _TabsS extends State<Tabs> {
            int i=0;
            final pages=[Home(),DocsPage(),ResearchPage(),OnlineHubPage()];
            @override Widget build(BuildContext c) {
              return Scaffold(
                body: pages[i],
                bottomNavigationBar: BottomNavigationBar(
                  type: BottomNavigationBarType.fixed,
                  currentIndex: i,
                  selectedItemColor: Colors.green,
                  onTap: (x){ setState((){ i=x; }); },
                  items: [
                    BottomNavigationBarItem(icon:Icon(Icons.school),label:'Subjects'),
                    BottomNavigationBarItem(icon:Icon(Icons.folder),label:'My Docs'),
                    BottomNavigationBarItem(icon:Icon(Icons.search),label:'Research'),
                    BottomNavigationBarItem(icon:Icon(Icons.public),label:'Online AI')
                  ]
                )
              );
            }
          }

          class Home extends StatelessWidget {
            @override Widget build(BuildContext c) {
              final subs=['Mathematics','Biology','Chemistry','Physics','History','Geography','English','Agriculture'];
              return Scaffold(
                appBar: AppBar(title:Text('MTRDF V14.21 GREEN'),backgroundColor:Colors.green,foregroundColor:Colors.white),
                body: ListView.builder(padding:EdgeInsets.all(12),itemCount:subs.length,itemBuilder:(_,j){
                  return Card(child:ListTile(title:Text(subs[j]),onTap:()=>Navigator.push(c,MaterialPageRoute(builder:(_)=>ChatPage(subject:subs[j])))));
                })
              );
            }
          }

          class DocsPage extends StatefulWidget { @override State<DocsPage> createState()=>_DocsS(); }
          class _DocsS extends State<DocsPage> {
            List<Map<String,String>> docs=[];
            @override void initState(){ super.initState(); ld(); }
            Future<void> ld() async {
              final p=await SharedPreferences.getInstance();
              String? s=p.getString('mtrdf_docs_v10');
              if(s!=null){ setState((){ docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))); }); }
            }
            Future<void> sv() async {
              final p=await SharedPreferences.getInstance();
              p.setString('mtrdf_docs_v10',jsonEncode(docs));
            }
            Future<void> pk() async {
              try{
                FilePickerResult? r=await FilePicker.platform.pickFiles(type:FileType.custom,allowedExtensions:['docx','pdf'],withData:true);
                if(r!=null&&r.files.first.bytes!=null){
                  String n=r.files.first.name;
                  List<int> by=r.files.first.bytes!.toList();
                  String t=n.toLowerCase().endsWith('.pdf')?extractPdf(by):extractDocx(by);
                  setState((){ docs.add({'name':n,'content':t}); });
                  sv();
                }
              }catch(e){}
            }
            @override Widget build(BuildContext c){
              return Scaffold(
                appBar: AppBar(title:Text('My Docs ${docs.length}'),backgroundColor:Colors.green,foregroundColor:Colors.white),
                body: docs.isEmpty?Center(child:Text('No docs')):ListView.builder(padding:EdgeInsets.all(12),itemCount:docs.length,itemBuilder:(_,j){ return Card(child:ListTile(title:Text(docs[j]['name']??''))); }),
                floatingActionButton: FloatingActionButton(onPressed:pk,child:Icon(Icons.add))
              );
            }
          }

          class ResearchPage extends StatefulWidget { const ResearchPage({super.key}); @override State<ResearchPage> createState()=>_ResS(); }
          class _ResS extends State<ResearchPage> {
            final ctrl=TextEditingController();
            List<Map<String,String>> res=[];
            bool searching=false;
            String status='';
            Future<void> sr(String q) async {
              if(q.trim().isEmpty) return;
              setState((){ searching=true; status='Searching...'; });
              final p=await SharedPreferences.getInstance();
              String? s=p.getString('mtrdf_docs_v10');
              List<Map<String,String>> ds=[];
              if(s!=null) ds=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)));
              List<Map<String,String>> r=[];
              for(var d in ds){ if(d['content']!.toLowerCase().contains(q.toLowerCase())) r.add({'title':'FROM DOC: ${d['name']}','snip':d['content']!.substring(0,d['content']!.length>300?300:d['content']!.length),'source':'local','url':''}); }
              var o=await fetchAll(q);
              r.addAll(o);
              setState((){ res=r; searching=false; status='Done ${r.length}'; });
            }
            @override Widget build(BuildContext c){
              return Scaffold(
                appBar: AppBar(title:Text('Research'),backgroundColor:Colors.blue,foregroundColor:Colors.white),
                body: Column(children:[
                  Padding(
                    padding: EdgeInsets.all(12),
                    child: TextField(
                      controller: ctrl,
                      decoration: InputDecoration(
                        hintText: 'Search history...',
                        border: OutlineInputBorder(),
                        suffixIcon: IconButton(icon:Icon(Icons.search), onPressed:(){ sr(ctrl.text); })
                      ),
                      onSubmitted: (v){ sr(v); }
                    )
                  ),
                  searching? LinearProgressIndicator() : Text(status),
                  Expanded(child: ListView.builder(
                    padding: EdgeInsets.all(12),
                    itemCount: res.length,
                    itemBuilder: (_,i){
                      var r=res[i];
                      return Card(child:ListTile(
                        title: Text(r['title']??''),
                        subtitle: Text('${r['snip']}\n${r['url']}'),
                        trailing: IconButton(icon:Icon(Icons.share), onPressed:(){ Share.share('${r['title']}\n${r['snip']}'); })
                      ));
                    }
                  ))
                ])
              );
            }
          }

          class OnlineHubPage extends StatefulWidget { @override State<OnlineHubPage> createState()=>_OnlineS(); }
          class _OnlineS extends State<OnlineHubPage> {
            final ctrl=TextEditingController(text:'history');
            List<Map<String,String>> results=[];
            bool searching=false;
            String log='Ready';
            Future<void> doSearch(String q,{String mode='all'}) async {
              if(q.trim().isEmpty) return;
              setState((){ searching=true; results=[]; log='Searching $mode'; });
              List<Map<String,String>> r=[];
              if(mode=='all'||mode=='wikipedia'){ r.addAll(await fetchWiki(q)); }
              if(mode=='all'||mode=='google'){ r.addAll(await fetchDuck(q)); }
              if(mode=='all'||mode=='youtube'){ r.addAll(await fetchYT(q)); }
              setState((){ results=r; searching=false; log='Done ${r.length}'; });
            }
            @override void initState(){ super.initState(); Future.delayed(Duration(milliseconds:500),(){ doSearch('history',mode:'all'); }); }
            @override Widget build(BuildContext c){
              return Scaffold(
                appBar: AppBar(title:Text('ONLINE AI FIXED'),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white),
                body: Column(children:[
                  Padding(padding:EdgeInsets.all(8), child: Column(children:[
                    TextField(
                      controller: ctrl,
                      decoration: InputDecoration(hintText:'Ask...',border:OutlineInputBorder()),
                      onSubmitted: (v){ doSearch(v,mode:'all'); }
                    ),
                    SizedBox(height:8),
                    Row(children:[
                      Expanded(child:ElevatedButton(onPressed:(){ doSearch(ctrl.text,mode:'wikipedia'); }, child:Text('WIKI'))),
                      SizedBox(width:4),
                      Expanded(child:ElevatedButton(onPressed:(){ doSearch(ctrl.text,mode:'google'); }, child:Text('GOOGLE'))),
                      SizedBox(width:4),
                      Expanded(child:ElevatedButton(onPressed:(){ doSearch(ctrl.text,mode:'youtube'); }, child:Text('YOUTUBE'))),
                      SizedBox(width:4),
                      Expanded(child:ElevatedButton(onPressed:(){ doSearch(ctrl.text,mode:'all'); }, child:Text('ALL')))
                    ]),
                    searching? LinearProgressIndicator() : Text(log)
                  ])),
                  Expanded(child: ListView.builder(padding:EdgeInsets.all(12),itemCount:results.length,itemBuilder:(_,i){
                    var r=results[i];
                    return Card(child:ListTile(
                      title: Text(r['title']??''),
                      subtitle: Text('${r['snip']}\n${r['url']}'),
                      trailing: IconButton(icon:Icon(Icons.open_in_new), onPressed:() async {
                        if((r['url']??'').isNotEmpty){
                          final uri=Uri.parse(r['url']!);
                          if(await canLaunchUrl(uri)) await launchUrl(uri,mode:LaunchMode.externalApplication);
                        }
                      })
                    ));
                  }))
                ])
              );
            }
          }

          class ChatPage extends StatefulWidget {
            final String subject;
            const ChatPage({super.key,required this.subject});
            @override State<ChatPage> createState()=>_ChatS();
          }
          class _ChatS extends State<ChatPage> {
            final ctrl=TextEditingController();
            List<Map<String,String>> msgs=[{'role':'ai','text':'V14.21 GREEN - Online fixed'}];
            bool sending=false;
            Future<void> send() async {
              if(ctrl.text.isEmpty) return;
              String q=ctrl.text;
              setState((){ msgs.add({'role':'user','text':q}); sending=true; });
              ctrl.clear();
              var on=await fetchAll(q);
              String comb='';
              for(var r in on){ comb+='${r['title']}\n${r['snip']}\n\n'; }
              setState((){ msgs.add({'role':'ai','text':comb}); sending=false; });
            }
            @override Widget build(BuildContext c){
              return Scaffold(
                appBar: AppBar(title:Text(widget.subject),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white),
                body: Column(children:[
                  Expanded(child: ListView.builder(padding:EdgeInsets.all(12),itemCount:msgs.length,itemBuilder:(_,i){
                    var m=msgs[i]; bool u=m['role']=='user';
                    return Align(alignment:u?Alignment.centerRight:Alignment.centerLeft, child: Container(margin:EdgeInsets.all(4),padding:EdgeInsets.all(12),decoration:BoxDecoration(color:u?Colors.deepPurple:Colors.grey[200],borderRadius:BorderRadius.circular(12)), child:Text(m['text']??'')));
                  })),
                  sending? LinearProgressIndicator() : SizedBox(),
                  Padding(padding:EdgeInsets.all(8), child: Row(children:[
                    Expanded(child: TextField(controller:ctrl, decoration:InputDecoration(hintText:'Ask...',border:OutlineInputBorder(borderRadius:BorderRadius.circular(20))), onSubmitted:(_)=>send())),
                    IconButton(icon:Icon(Icons.send), onPressed:send)
                  ]))
                ])
              );
            }
          }
          DART
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MTRDF-V14-21-GREEN
          path: build/app/outputs/flutter-apk/app-release.apk
