name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Recreate
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          rm -rf test
      - name: Fix SDK
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          grep -q "INTERNET" android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml
      - name: Pubspec
        run: |
          cat > pubspec.yaml <<'YAML'
          name: mtrdf_2026_ai
          version: 14.37.0+97
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.3.10
            archive: ^3.6.1
            syncfusion_flutter_pdf: ^28.2.12
            hive_flutter: ^1.1.0
            http: ^1.6.0
            share_plus: ^12.0.2
            path_provider: ^2.1.2
          flutter:
            uses-material-design: true
          YAML
      - name: Write main.dart V14.37 REPORT LAB
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'package:http/http.dart' as http;
          import 'package:share_plus/share_plus.dart';
          import 'package:path_provider/path_provider.dart';

          String extractDocx(List<int> b){try{final a=ZipDecoder().decodeBytes(b);for(final f in a){if(f.name=='word/document.xml'){return utf8.decode(f.content as List<int>).replaceAll(RegExp(r'<[^>]+>'),' ');}}return '';}catch(e){return '';}}
          String extractPdf(List<int> b){try{final d=PdfDocument(inputBytes:b);final t=PdfTextExtractor(d).extractText();d.dispose();return t;}catch(e){return '';}}
          String decodeHtml(String t){return t.replaceAll('&amp;','&').replaceAll('&#039;',"'").replaceAll('&quot;','"').replaceAll('&#39;',"'").replaceAll(RegExp(r'<[^>]+>'),'');}
          String extractCoreTopic(String input){
            String s=input.toLowerCase();
            s=s.replaceAll(RegExp(r'^(give me|i need|provide|list|show me|what are|what is|tell me about|explain|define|describe|discuss|state|outline|differentiate|difference)\s+'), '');
            s=s.replaceAll(RegExp(r'\d+\s*points?.*?for\s+'), '');
            s=s.replaceAll(RegExp(r'\d+\s*importances?\s+of\s+'), 'importance of ');
            s=s.replaceAll(RegExp(r'\d+\s*points?'), '');
            s=s.replaceAll(RegExp(r'well explained|with examples|with example|in table format|in a table|table format|detailed|elaborate|according to uneb|according to|for s\d+|for primary|uneb|exam format|between'), '');
            s=s.replaceAll(RegExp(r'\s+'), ' ').trim();
            if(s.startsWith('of ')) s=s.substring(3);
            if(s.isEmpty) return 'geography';
            return s;
          }

          Map<String, List<Map<String,String>>> curriculumDB={
            'difference between weather and climate':[
              {'title':'Definition of Weather','exp':'Weather is daily atmospheric condition of a place at a specific time. Short term, changes quickly hours to days.','ex':'Today Kampala is rainy 24C windy, tomorrow may be sunny 28C.'},
              {'title':'Definition of Climate','exp':'Climate is average weather condition of a place over long period 30-35 years. Long term, stable pattern.','ex':'Uganda climate is tropical modified by altitude, mean 22C, two rainy seasons.'},
              {'title':'Time Period','exp':'Weather short period hours/days, climate long period 30 plus years.','ex':'Weather: morning rain 2 hours, Climate: March-May long rains every year in Buganda.'},
              {'title':'Elements Measured','exp':'Both have temperature, rainfall, humidity, wind, pressure, sunshine. Weather instant value, climate average.','ex':'Weather today 28C, Climate average for Gulu 25C.'},
              {'title':'Variability and Change','exp':'Weather changes quickly day to day, climate stable year to year.','ex':'Weather can change sunny to storm in 2 hours, climate of Kabale remains cool 18C year to year.'},
              {'title':'Study Instruments and Experts','exp':'Weather studied by meteorologists daily forecast, climate by climatologists long data. Both use thermometer, rain gauge.','ex':'UNMA Entebbe gives daily weather forecast, climate data for agriculture planning NAADS.'},
              {'title':'Importance of Weather','exp':'Determines daily human activities: dressing, travel, farming activities that day, sports, aviation.','ex':'Farmers check weather to harvest maize, pilots need weather for flights Entebbe to Nairobi.'},
              {'title':'Importance of Climate','exp':'Determines type of crops, vegetation, animals, settlement, economic activity, clothing of region.','ex':'Karamoja semi-arid climate limits to pastoralism cattle, Buganda wet climate allows matooke bananas and coffee.'},
              {'title':'Factors Influencing','exp':'Weather influenced by daily wind, clouds, pressure, humidity. Climate influenced by latitude, altitude, water bodies, vegetation, ocean currents.','ex':'Lake Victoria moderates climate of Kampala, Rwenzori altitude 5109m lowers climate temperature creates snow.'},
              {'title':'UNEB Exam Approach Table','exp':'UNEB asks differentiate with table 2 columns Weather vs Climate, give 5-10 points with Uganda examples, simple vs academic language.','ex':'Draw table: Weather short time vs Climate long time, Weather changes quickly vs Climate stable, Weather daily vs Climate 30 years.'},
            ],
          };

          Map<String,dynamic> parseInstructions(String input){
            String l=input.toLowerCase();
            int points=10;
            var m=RegExp(r'(\d+)\s*points?').firstMatch(l);
            if(m!=null){ points=int.tryParse(m.group(1)!)??10; }
            if(points>20) points=20;
            String core=extractCoreTopic(input);
            return {'points':points,'core':core,'original':input};
          }

          List<Map<String,String>> getPointsForCore(String core, int needPoints){
            String l=core.toLowerCase();
            if(l.contains('weather') && l.contains('climate')){
              var pts=curriculumDB['difference between weather and climate']!;
              while(pts.length<needPoints){ pts=pts+pts; }
              return pts.take(needPoints).toList();
            }
            List<Map<String,String>> points=[];
            for(var k in curriculumDB.keys){
              if(l.contains(k)||k.contains(l)){
                points=List.from(curriculumDB[k]!);
                break;
              }
            }
            if(points.isEmpty){
              points=[
                {'title':'Definition of ' + core,'exp':'Explains meaning of ' + core + ' in Uganda curriculum with Uganda examples.','ex':'In Uganda, ' + core + ' taught in schools.'},
                {'title':'Importance to Uganda','exp':core + ' contributes to development.','ex':'Many earn from ' + core + '.'},
              ];
            }
            while(points.length<needPoints){ points.addAll(List.from(points)); }
            return points.take(needPoints).toList();
          }

          Future<List<Map<String,String>>> searchWikiSmart(String q) async {
            List<Map<String,String>> r=[];
            String core=extractCoreTopic(q);
            try{
              final u=Uri.parse('https://en.wikipedia.org/api/rest_v1/page/summary/' + Uri.encodeComponent(core.trim()));
              final resp=await http.get(u, headers:{'User-Agent':'MTRDF/1.0'}).timeout(Duration(seconds:3));
              if(resp.statusCode==200){
                final d=jsonDecode(resp.body);
                String ex=decodeHtml((d['extract']??'').toString());
                if(ex.length>30){ r.add({'title':(d['title']??core).toString(),'snip':ex,'source':'Wikipedia'}); }
              }
            }catch(e){}
            return r;
          }

          bool isStopWord(String w){
            const stops=['between','difference','differentiate','importance','give','points','well','explained','with','examples','example','the','and','for','according','uneb','table','format','what','are','is','of','a','an','in','on','to','from'];
            return stops.contains(w.toLowerCase());
          }

          Future<Map<String,dynamic>> deepResearchFormatted(String q, String subject, List<Map<String,String>> myDocs, List<Map<String,dynamic>> ctx) async {
            var instr=parseInstructions(q);
            String core=instr['core'];
            if(ctx.isNotEmpty){
              String lastCore=ctx.last['core']??'';
              if(core.length<4 && lastCore.isNotEmpty){ core=lastCore; instr['core']=lastCore; }
            }
            int needPoints=instr['points'];
            List<Map<String,String>> wiki=[];
            try{ wiki=await searchWikiSmart(q); }catch(e){}
            List<Map<String,String>> points=getPointsForCore(core, needPoints);
            List<Map<String,String>> docMatches=[];
            if(myDocs.isNotEmpty){
              String lc=core.toLowerCase();
              List<String> keywords=lc.split(' ').where((w)=> w.length>3 &&!isStopWord(w)).toList();
              if(keywords.isEmpty){ keywords=[lc]; }
              for(var d in myDocs){
                String content=(d['content']??'').toLowerCase();
                String subj=(d['subject']??'General').toLowerCase();
                if((core.contains('weather')||core.contains('climate')) && subj.contains('history')){ continue; }
                int matchCount=0;
                for(var kw in keywords){ if(content.contains(kw)) matchCount++; }
                bool strongMatch=false;
                if(keywords.length>=2){ strongMatch=matchCount>=2; } else { strongMatch=matchCount>=1; }
                if(content.contains(lc)) strongMatch=true;
                if(strongMatch){
                  String full=(d['content']??'').toString();
                  int pos=-1;
                  for(var kw in keywords){ pos=content.indexOf(kw); if(pos!=-1) break; }
                  String snip=full;
                  if(pos!=-1){
                    int start=pos-150; if(start<0) start=0;
                    int end=pos+350; if(end>full.length) end=full.length;
                    snip=full.substring(start,end);
                  } else { if(snip.length>250) snip=snip.substring(0,250) + '...'; }
                  docMatches.add({'title':d['name']??'My Doc','snip':snip,'full':full,'source':'My Docs'});
                }
              }
            }
            return {'results':wiki,'points':points,'instr':instr,'core':core,'myDocs':docMatches};
          }

          Future<String> exportToPdfFile(String core, List<Map<String,String>> points, String intro) async {
            try{
              final doc=PdfDocument();
              final page=doc.pages.add();
              final font=PdfStandardFont(PdfFontFamily.helvetica, 11);
              String text=core.toUpperCase() + '\n\nIntroduction: ' + intro + '\n\n';
              for(int i=0;i<points.length;i++){ text+=(i+1).toString() + '. ' + points[i]['title']! + '\nExplanation: ' + points[i]['exp']! + '\nExample: ' + points[i]['ex']! + '\n\n'; }
              text+='Conclusion: Therefore ' + core + ' important.\n\nSources: MTRDF Curriculum, Wikipedia, My Docs';
              page.graphics.drawString(text, font, bounds: Rect.fromLTWH(0, 0, page.getClientSize().width, page.getClientSize().height));
              final bytes=await doc.save();
              doc.dispose();
              final dir=await getTemporaryDirectory();
              final file=File(dir.path + '/MTRDF_' + core.replaceAll(' ', '_') + '.pdf');
              await file.writeAsBytes(bytes);
              return file.path;
            }catch(e){ return ''; }
          }

          // --- DOCX GENERATOR FOR REPORT LAB (Real.docx file) ---
          Future<String> generateDocxReport(String title, List<Map<String,String>> sections, List<Map<String,String>> sources) async {
            try{
              String bodyXml='';
              bodyXml+='<w:p><w:pPr><w:pStyle w:val="Heading1"/></w:pPr><w:r><w:t>' + _xmlEsc(title) + '</w:t></w:r></w:p>';
              bodyXml+='<w:p><w:r><w:rPr><w:i/></w:rPr><w:t>MTRDF AI - Knowledge Faith Transformation - Generated ' + DateTime.now().toIso8601String().substring(0,10) + '</w:t></w:r></w:p>';
              for(int i=0;i<sections.length;i++){
                var s=sections[i];
                bodyXml+='<w:p><w:pPr><w:pStyle w:val="Heading2"/></w:pPr><w:r><w:rPr><w:b/></w:rPr><w:t>' + _xmlEsc((i+1).toString() + '. ' + (s['heading']??'')) + '</w:t></w:r></w:p>';
                bodyXml+='<w:p><w:r><w:t>' + _xmlEsc(s['content']??'') + '</w:t></w:r></w:p>';
                if(s['example']!=null && s['example']!.isNotEmpty){
                  bodyXml+='<w:p><w:r><w:rPr><w:i/></w:rPr><w:t>Example: ' + _xmlEsc(s['example']!) + '</w:t></w:r></w:p>';
                }
              }
              bodyXml+='<w:p><w:pPr><w:pStyle w:val="Heading1"/></w:pPr><w:r><w:t>Sources and Verification Checklist</w:t></w:r></w:p>';
              for(var src in sources){
                bodyXml+='<w:p><w:r><w:t>[' + _xmlEsc(src['type']??'') + '] ' + _xmlEsc(src['text']??'') + '</w:t></w:r></w:p>';
              }
              bodyXml+='<w:p><w:r><w:t>Verification Checklist: Compare claims against UNEB and NCDC official publications, syllabus, original exam papers. Keep personal observations labelled as observations and proposals labelled as proposals.</w:t></w:r></w:p>';

              String documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + bodyXml + '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>';
              String contentTypes='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
              String rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
              String wordRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';

              final archive=Archive();
              archive.addFile(ArchiveFile('[Content_Types].xml', contentTypes.length, utf8.encode(contentTypes)));
              archive.addFile(ArchiveFile('_rels/.rels', rels.length, utf8.encode(rels)));
              archive.addFile(ArchiveFile('word/_rels/document.xml.rels', wordRels.length, utf8.encode(wordRels)));
              archive.addFile(ArchiveFile('word/document.xml', documentXml.length, utf8.encode(documentXml)));
              final bytes=ZipEncoder().encode(archive);
              if(bytes==null) return '';
              final dir=await getTemporaryDirectory();
              final file=File(dir.path + '/MTRDF_Report_' + title.replaceAll(' ', '_').substring(0, title.length>20?20:title.length) + '.docx');
              await file.writeAsBytes(bytes);
              return file.path;
            }catch(e){ return 'Error: ' + e.toString(); }
          }
          String _xmlEsc(String t){ return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&apos;'); }

          // --- ADVANCED REASONING + CLASSIFICATION FOR REPORT LAB ---
          Map<String,dynamic> analyzeAndClassify(String rawText, List<Map<String,String>> myDocs){
            String lower=rawText.toLowerCase();
            // Split into ideas
            List<String> lines=rawText.split('\n').where((l)=> l.trim().length>10).toList();
            Map<String, List<String>> themes={};
            List<Map<String,String>> classified=[];

            // Theme keywords for 2026 UCE History
            final themeKeywords={
              'Examination Concerns':['exam','question','paper','uneb','mark','leak','cheat','malpractice','difficulty','time'],
              'Curriculum Alignment':['curriculum','syllabus','ncdc','competency','cbc','topic','coverage','content'],
              'Teacher Experiences':['teacher','teach','school','class','student','learn','training','workshop','fee'],
              'Assessment Issues':['assessment','grading','rubric','marking','score','performance','result','candidate'],
              'Proposals and Reforms':['propos','recommend','should','reform','improve','suggest','need','must'],
            };

            for(var line in lines){
              String l=line.toLowerCase();
              String theme='General Issues';
              for(var entry in themeKeywords.entries){
                for(var kw in entry.value){
                  if(l.contains(kw)){ theme=entry.key; break; }
                }
              }
              themes.putIfAbsent(theme, ()=>[]).add(line.trim());

              // Classify: Fact, Observation, Allegation, Proposal, Question
              String type='Observation';
              if(l.contains('alleged')||l.contains('claim')||l.contains('reportedly')||l.contains('supposedly')){ type='Allegation - Needs Verification'; }
              else if(l.contains('should')||l.contains('recommend')||l.contains('propose')||l.contains('suggest')){ type='Proposal'; }
              else if(l.contains('?')||l.contains('whether')||l.contains('verify')||l.contains('confirm')){ type='Question Requiring Verification'; }
              else if(l.contains('observed')||l.contains('experience')||l.contains('noticed')||l.contains('saw')){ type='Teacher Observation'; }
              else if(l.contains('fact')||l.contains('official')||l.contains('document')||l.contains('policy')){ type='Fact - Check Source'; }

              classified.add({'text':line.trim(),'type':type,'theme':theme});
            }

            // Detect duplication
            Map<String,int> count={};
            for(var c in classified){
              String key=(c['text']??'').toLowerCase().substring(0, (c['text']??'').length>30?30:(c['text']??'').length);
              count[key]=(count[key]??0)+1;
            }
            List<String> duplicates=count.entries.where((e)=> e.value>1).map((e)=> e.key).toList();

            return {'themes':themes,'classified':classified,'duplicates':duplicates,'totalLines':lines.length};
          }

          List<Map<String,String>> buildStructuredReport(String title, Map<String,dynamic> analysis, List<Map<String,String>> myDocs){
            List<Map<String,String>> sections=[];
            Map<String, List<String>> themes=analysis['themes'] as Map<String, List<String>>;
            List<Map<String,String>> classified=analysis['classified'] as List<Map<String,String>>;

            sections.add({'heading':'Executive Summary','content':'This report consolidates discussions from 2026 UCE History and Political Education examination analysis, including teacher WhatsApp discussions, examination concerns, curriculum alignment questions, and proposed reforms. Total inputs analyzed: ' + analysis['totalLines'].toString() + ' discussion points, ' + myDocs.length.toString() + ' uploaded documents.','example':'Purpose: Provide organized evidence for UNEB, NCDC, schools, teachers while distinguishing facts from opinions.'});
            sections.add({'heading':'Methodology - How Information Was Processed','content':'Step 1 Collect: Gathered WhatsApp messages, notes, PDFs, Word documents. Step 2 Analyse and Organize: Identified themes, removed duplication, classified claims. Step 3 Develop: Wrote sections with Uganda examples. Step 4 Generate DOCX/PDF: Used document-processing libraries. Step 5 Deliver: Provided verified download path.','example':'Capabilities used: Advanced reasoning, information organization, long-form writing, document creation, research assistance, quality control.'});

            int secNum=3;
            for(var entry in themes.entries){
              String themeContent=entry.value.join('\n\n').substring(0, entry.value.join('\n\n').length>800?800:entry.value.join('\n\n').length);
              sections.add({'heading':entry.key,'content':themeContent,'example':'Theme contains ' + entry.value.length.toString() + ' related points from teachers. See classification table.'});
              secNum++;
            }

            // Classification table as section
            String classTable='Classification of Claims:\n';
            for(var c in classified.take(15)){
              classTable+='- [' + (c['type']??'') + '] (' + (c['theme']??'') + '): ' + (c['text']??'') + '\n';
            }
            sections.add({'heading':'Classification - Facts vs Observations vs Allegations vs Proposals','content':classTable,'example':'Important: Allegations labelled as allegations, proposals as proposals, observations as observations. Facts require official verification.'});

            sections.add({'heading':'Evidence Needed and Verification Checklist','content':'What AI can do well: Organize evidence, identify contradictions, explain historical concepts, improve wording, make recommendations logically. What requires verification: Whether UNEB officially adopted proposed structure, whether exam questions complied with official guidance, whether reported training fees accurate, whether claims about institutional intentions supported.','example':'Strengthen accuracy: Compare against UNEB and NCDC publications, syllabus, original exam papers.'});

            sections.add({'heading':'Recommendations for Stakeholders','content':'For UNEB: Clarify assessment guidance, publish marking rubrics, address timing concerns. For NCDC: Align syllabus with competency-based assessment, provide sample papers. For Schools: Provide teacher training without excessive fees, support learners with materials. For Teachers: Document observations as observations, keep proposals as proposals, verify before sharing as established fact.','example':'For MTRDF AI: Build workflow that accepts WhatsApp, PDFs, images, extracts groups, separates verified from opinions, produces long reports with tables, generates DOCX/PDF, includes sources and verification checklist.'});

            sections.add({'heading':'Conclusion','content':'The valuable capability is not generating many words. It is combining understanding, reasoning, organization, writing, document production, and evidence checking into one workflow while being honest about what has and has not been verified. This approach creates substantial report with clear purpose instead of repeating same arguments.','example':'Limit: Very long tasks may require several stages, important details can be missed unless result reviewed against original material.'});

            if(analysis['duplicates'].length>0){
              sections.add({'heading':'Appendix - Duplicate Detection','content':'Repeated arguments found: ' + analysis['duplicates'].join(', ') + '. These were condensed in main report to avoid repetition.','example':'Duplication indicates strong concern among teachers.'});
            }

            return sections;
          }

          void main() async { WidgetsFlutterBinding.ensureInitialized(); await Hive.initFlutter(); await Hive.openBox('mtrdf_v14'); runApp(App()); }
          class App extends StatelessWidget { @override Widget build(BuildContext c){ return MaterialApp(debugShowCheckedModeBanner:false, home:Tabs(), theme: ThemeData(useMaterial3: true)); } }
          class Tabs extends StatefulWidget { @override State<Tabs> createState()=>_TabsS(); }
          class _TabsS extends State<Tabs> {
            int i=0;
            final pages=[UniversalChatPage(),DocsPage(),ResearchPro(),OnlinePro(),ReportLabPage(),JourneyPage()];
            @override Widget build(BuildContext c){ return Scaffold(body: pages[i], bottomNavigationBar: NavigationBar(selectedIndex: i, onDestinationSelected: (x){ setState((){ i=x; }); }, destinations: [NavigationDestination(icon: Icon(Icons.chat_bubble), label: 'Chat'), NavigationDestination(icon: Icon(Icons.folder), label: 'My Docs'), NavigationDestination(icon: Icon(Icons.biotech), label: 'Research'), NavigationDestination(icon: Icon(Icons.public), label: 'Online'), NavigationDestination(icon: Icon(Icons.description), label: 'Report Lab'), NavigationDestination(icon: Icon(Icons.timeline), label: 'Journey')])); }
          }

          // --- UNIVERSAL CHAT (same as V14.36.1) ---
          class UniversalChatPage extends StatefulWidget { @override State<UniversalChatPage> createState()=>_UniS(); }
          class _UniS extends State<UniversalChatPage> {
            final ctrl=TextEditingController();
            List<Map<String,dynamic>> messages=[];
            List<Map<String,dynamic>> conversations=[];
            List<Map<String,String>> myDocs=[];
            bool sending=false;
            int currentConvIndex=-1;
            @override void initState(){ super.initState(); loadAll(); }
            Future<void> loadAll() async {
              final p=await SharedPreferences.getInstance();
              String? conv=p.getString('mtrdf_conversations_v14');
              if(conv!=null){ conversations=List<Map<String,dynamic>>.from(jsonDecode(conv).map((e)=>Map<String,dynamic>.from(e))); }
              String? docs=p.getString('mtrdf_docs_v10');
              if(docs!=null){ myDocs=List<Map<String,String>>.from(jsonDecode(docs).map((e)=>Map<String,String>.from(e))); }
              if(conversations.isEmpty){ startNewChat(); } else { loadConversation(0); }
            }
            Future<void> saveConversations() async { final p=await SharedPreferences.getInstance(); p.setString('mtrdf_conversations_v14', jsonEncode(conversations)); }
            void startNewChat(){ setState((){ messages=[{'role':'ai','text':'Hello Thomas! I am MTRDF AI. Knowledge Faith Transformation.\n\nChat does 10 points Uganda examples.\nReport Lab does full UCE History report workflow like ChatGPT: Collect WhatsApp, Analyse, Develop long report, Generate DOCX/PDF.','isWelcome':true}]; currentConvIndex=-1; }); }
            void loadConversation(int idx){ if(idx<0||idx>=conversations.length) return; setState((){ currentConvIndex=idx; messages=List<Map<String,dynamic>>.from(conversations[idx]['messages'].map((e)=>Map<String,dynamic>.from(e))); }); }
            Future<void> sendMessage({String? overrideText}) async {
              String q=overrideText??ctrl.text.trim();
              if(q.isEmpty) return;
              setState((){ messages.add({'role':'user','text':q}); sending=true; });
              ctrl.clear();
              try{
                List<Map<String,dynamic>> ctx=[];
                for(var m in messages){ if(m['core']!=null) ctx.add({'core':m['core']}); }
                var res=await deepResearchFormatted(q, 'General', myDocs, ctx);
                String core=res['core'];
