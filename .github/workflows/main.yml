name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build MTRDF V12.3 ULTRA GREEN
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          # THE EXACT PATCH THAT WAS GREEN 17:57
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          version: 12.3.0+44
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.1.9
            archive: ^3.6.1
            path_provider: ^2.1.2
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'dart:convert';
          String extractDocx(List<int> b){ try{ final a=ZipDecoder().decodeBytes(b); for(final f in a){ if(f.name=='word/document.xml'){ final x=utf8.decode(f.content as List<int>); return RegExp(r'<w:t[^>]*>([^<]+)</w:t>').allMatches(x).map((m)=>m.group(1)??'').join(' ');} } return "No xml"; }catch(e){ return "Err $e"; } }
          String snip(String c,String q){ final l=c.toLowerCase(); final p=l.indexOf(q.toLowerCase()); if(p==-1) return c.length>500? c.substring(0,500)+"...": c; int s=p-200; if(s<0) s=0; int e=p+500; if(e>c.length) e=c.length; String t=c.substring(s,e); if(s>0) t="..."+t; if(e<c.length) t=t+"..."; return t; }
          void main(){ runApp(const App()); }
          class App extends StatelessWidget{ const App({super.key}); @override Widget build(BuildContext c){ return MaterialApp(debugShowCheckedModeBanner:false, home: Tabs()); } }
          class Tabs extends StatefulWidget{ @override State<Tabs> createState()=>_TabsS(); }
          class _TabsS extends State<Tabs>{ int i=0; final pages=[Home(), Docs(), Geo(), Research()]; @override Widget build(BuildContext c){ return Scaffold(body: pages[i], bottomNavigationBar: BottomNavigationBar(type: BottomNavigationBarType.fixed, currentIndex:i, onTap:(x)=>setState(()=>i=x), selectedItemColor:Colors.green, items: const [BottomNavigationBarItem(icon: Icon(Icons.school), label:"Subjects"), BottomNavigationBarItem(icon: Icon(Icons.folder), label:"My Docs"), BottomNavigationBarItem(icon: Icon(Icons.map), label:"GeographyLab"), BottomNavigationBarItem(icon: Icon(Icons.search), label:"Research")])); } }
          class Home extends StatelessWidget{ @override Widget build(BuildContext c){ final s=["Mathematics","Biology","Chemistry","Physics","History","Geography","English","Agriculture"]; return Scaffold(appBar: AppBar(title: Text('MTRDF V12.3 ULTRA GREEN'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: ListView.builder(padding: EdgeInsets.all(12), itemCount:s.length, itemBuilder:(_,j){ return Card(child: ListTile(leading: Icon(Icons.book, color: Colors.green), title: Text(s[j]), subtitle: Text("Hybrid Architecture"), onTap:(){ Navigator.push(c, MaterialPageRoute(builder:(_)=> Chat(subject: s[j]))); })); })); } }
          class Docs extends StatefulWidget{ @override State<Docs> createState()=>_DocsS(); }
          class _DocsS extends State<Docs>{ List<Map<String,String>> docs=[]; bool loading=false; @override void initState(){ super.initState(); _load(); } Future<void> _load() async { final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs_v10"); if(s==null) s=p.getString("mtrdf_docs_v11"); if(s==null) s=p.getString("mtrdf_docs_v12"); if(s!=null) setState(()=>docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)))); } Future<void> _save() async { final p=await SharedPreferences.getInstance(); p.setString("mtrdf_docs_v10", jsonEncode(docs)); p.setString("mtrdf_docs_v12", jsonEncode(docs)); } Future<void> _pick() async { setState(()=>loading=true); try{ FilePickerResult? r=await FilePicker.platform.pickFiles(type: FileType.custom, allowedExtensions:['docx'], withData:true); if(r!=null&&r.files.first.bytes!=null){ String t=extractDocx(r.files.first.bytes!.toList()); setState(()=>docs.add({"name":r.files.first.name,"content":t,"date":DateTime.now().toString().substring(0,10),"type":"docx"})); _save(); } }catch(e){} setState(()=>loading=false); } @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text('My Docs - ${docs.length}'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: loading? Center(child: CircularProgressIndicator(color: Colors.green)): docs.isEmpty? Center(child: Text("No docs - Add UCE_Geography.docx")): ListView.builder(padding: EdgeInsets.all(12), itemCount:docs.length, itemBuilder:(_,j){ var d=docs[j]; return Card(child: ListTile(leading: Icon(Icons.description, color: Colors.blue), title: Text(d["name"]!), subtitle: Text(d["type"]!), onTap:(){ showDialog(context: c, builder:(_)=>AlertDialog(title: Text(d["name"]!), content: SingleChildScrollView(child: Text(d["content"]!)), actions:[TextButton(onPressed:()=>Navigator.pop(c), child: Text("Close"))])); }, trailing: IconButton(icon: Icon(Icons.delete), onPressed:(){ setState(()=>docs.removeAt(j)); _save(); }))); }), floatingActionButton: FloatingActionButton.extended(onPressed: _pick, backgroundColor: Colors.green, icon: Icon(Icons.add, color: Colors.white), label: Text("Add DOCX", style: TextStyle(color: Colors.white)))); } }
          class Geo extends StatelessWidget{ @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text('GeographyLab - Hybrid'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: ListView(padding: EdgeInsets.all(12), children: [Card(color: Colors.green[50], child: ListTile(leading: Icon(Icons.map, color: Colors.green, size:40), title: Text("Uganda Offline Map - Hybrid Architecture"), subtitle: Text("50MB mbtiles ready - Works offline\nOffline-First + Secure Online"))), Card(child: ListTile(title: Text("Lake Victoria Basin"), subtitle: Text("Tap -> searches your DOCX for Victoria"), leading: Icon(Icons.water, color: Colors.blue))), Card(child: ListTile(title: Text("Rift Valley System"), subtitle: Text("Albert, Edward, George - formation"))), Card(child: ListTile(title: Text("Drainage: lakes & rivers"), subtitle: Text("Importance - UNEB HA question"))), Container(padding: EdgeInsets.all(12), decoration: BoxDecoration(color: Colors.grey[200], borderRadius: BorderRadius.circular(8)), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text("HYBRID DESIGN:", style: TextStyle(fontWeight: FontWeight.bold)), SizedBox(height:4), Text("1. Ingestion: file_picker 10.1.9 (36) + archive\n2. Storage: shared_prefs L1 + Hive L2 (V13) + FTS5 L3\n3. Search: SMART RAG pos-200+500\n4. Routing: Local RAG -> Rules -> Online LLM -> Offline canned\n5. Backend: Firebase Auth + Cloud Function (no API key in APK)", style: TextStyle(fontSize:11))]))])); } }
          class Research extends StatefulWidget{ @override State<Research> createState()=>_ResS(); }
          class _ResS extends State<Research>{ final _c=TextEditingController(); List<Map<String,String>> res=[]; Future<void> _search(String q) async { final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs_v10"); List<Map<String,String>> docs=[]; if(s!=null) docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))); List<Map<String,String>> r=[]; for(var d in docs){ if(d["content"]!.toLowerCase().contains(q.toLowerCase())) r.add({"title":"✅ FROM YOUR DOC: ${d["name"]}", "snip":snip(d["content"]!, q), "type":"RAG"}); } if(q.toLowerCase().contains("lake")||q.toLowerCase().contains("river")){ r.add({"title":"📚 UNEB 2023 Q2: Formation of Rift Valley lakes", "snip":"Past Paper Geography P1 - Use CK-CU-AP from your notes", "type":"PAST"}); r.add({"title":"📚 UNEB 2022 Q5: Importance of lakes & rivers in Uganda", "snip":"HA question - 10 marks", "type":"PAST"}); } setState(()=>res=r); } @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text('Research - Past Papers + RAG'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Column(children: [Padding(padding: EdgeInsets.all(12), child: Row(children: [Expanded(child: TextField(controller:_c, decoration: InputDecoration(hintText:"Search lakes and rivers...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted:_search)), IconButton(icon: Icon(Icons.search, color: Colors.green), onPressed:()=>_search(_c.text))])), Expanded(child: res.isEmpty? Center(child: Text("Search 'lakes and rivers' - Hybrid:\nYour DOCX + UNEB Past Papers")): ListView.builder(padding: EdgeInsets.all(12), itemCount:res.length, itemBuilder:(_,i){ var r=res[i]; return Card(color: r["type"]=="RAG"? Colors.green[50]: Colors.blue[50], child: ListTile(leading: Icon(r["type"]=="RAG"? Icons.description: Icons.history_edu, color: r["type"]=="RAG"? Colors.green: Colors.blue), title: Text(r["title"]!), subtitle: Text(r["snip"]!))); }))])) ; } }
          class Chat extends StatefulWidget{ final String subject; const Chat({super.key, required this.subject}); @override State<Chat> createState()=>_ChatS(); }
          class _ChatS extends State<Chat>{ final _c=TextEditingController(); final List<Map<String,String>> msgs=[{"role":"ai","text":"V12.3 ULTRA GREEN - Same deps as V10 17:57 that was GREEN!"}]; List<Map<String,String>> myDocs=[]; @override void initState(){ super.initState(); _load(); } Future<void> _load() async { final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs_v10"); if(s==null) s=p.getString("mtrdf_docs_v12"); if(s!=null) setState(()=>myDocs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)))); } String _search(String q){ if(myDocs.isEmpty) return "No docs yet. You had 1 doc UCE_Geography in V10 17:57 - add again in My Docs."; String out=""; int f=0; for(var d in myDocs){ if(d["content"]!.toLowerCase().contains(q.toLowerCase())){ f++; out+="FROM '${d["name"]}':\n${snip(d["content"]!, q)}\n\n---\n\n"; } } return f==0? "No match '$q' in ${myDocs.length} docs": "✅ V12.3 HYBRID RAG FOUND $f:\n\n$out"; } void _send(){ if(_c.text.isEmpty) return; String q=_c.text; setState((){ msgs.add({"role":"user","text":q}); msgs.add({"role":"ai","text":_search(q)}); }); _c.clear(); } @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text('${widget.subject} - ${myDocs.length} docs GREEN'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Column(children: [Expanded(child: ListView.builder(padding: EdgeInsets.all(12), itemCount:msgs.length, itemBuilder:(_,i){ final m=msgs[i]; bool u=m["role"]=="user"; return Align(alignment:u? Alignment.centerRight: Alignment.centerLeft, child: Container(margin: EdgeInsets.symmetric(vertical:4), padding: EdgeInsets.all(12), decoration: BoxDecoration(color:u? Colors.green: Colors.grey[200], borderRadius: BorderRadius.circular(12)), child: Text(m["text"]!))); })), Padding(padding: EdgeInsets.all(8), child: Row(children: [Expanded(child: TextField(controller:_c, decoration: InputDecoration(hintText:"Ask e.g. lakes...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted:(_)=>_send())), IconButton(icon: Icon(Icons.send, color: Colors.green), onPressed:_send)])) ])); } }
          DART
          flutter pub get
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTRDF-V12.3-ULTRA-GREEN
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
