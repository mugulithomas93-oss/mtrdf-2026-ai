name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build MTRDF V8.2
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          description: MTRDF V8.2 file_picker 6 fix
          publish_to: 'none'
          version: 8.2.0+31
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^6.2.0
            docx_to_text: ^1.0.1
            path_provider: ^2.1.2
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:docx_to_text/docx_to_text.dart';
          import 'package:path_provider/path_provider.dart';
          import 'dart:convert';
          import 'dart:io';
          void main(){ runApp(const MTRDFApp()); }
          class MTRDFApp extends StatelessWidget{ const MTRDFApp({super.key}); @override Widget build(BuildContext c){ return MaterialApp(debugShowCheckedModeBanner:false, home: const MainTabs()); } }
          class MainTabs extends StatefulWidget{ const MainTabs({super.key}); @override State<MainTabs> createState()=>_MainTabsState(); }
          class _MainTabsState extends State<MainTabs>{
            int _idx=0;
            final _pages=[const HomePage(), const DocsPage()];
            @override Widget build(BuildContext c){ return Scaffold(body: _pages[_idx], bottomNavigationBar: BottomNavigationBar(currentIndex: _idx, onTap: (i)=>setState(()=>_idx=i), selectedItemColor: Colors.green, items: const [BottomNavigationBarItem(icon: Icon(Icons.school), label: "Subjects"), BottomNavigationBarItem(icon: Icon(Icons.folder), label: "My Docs")])); }
          }
          class HomePage extends StatelessWidget{
            const HomePage({super.key});
            @override Widget build(BuildContext c){
              final subjects=["Mathematics","Biology","Chemistry","Physics","History","Geography","English","Agriculture"];
              return Scaffold(appBar: AppBar(title: const Text('MTRDF V8.2 DOCX+IMAGE'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: ListView.builder(padding: const EdgeInsets.all(12), itemCount: subjects.length, itemBuilder: (context,i){ return Card(child: ListTile(leading: const Icon(Icons.book, color:Colors.green), title: Text(subjects[i]), onTap:(){ Navigator.push(context, MaterialPageRoute(builder: (_)=> AITutorPage(subjectName: subjects[i]))); })); }));
            }
          }
          class DocsPage extends StatefulWidget{ const DocsPage({super.key}); @override State<DocsPage> createState()=>_DocsPageState(); }
          class _DocsPageState extends State<DocsPage>{
            List<Map<String,String>> _docs=[]; bool _loading=false;
            final _nameC=TextEditingController(); final _contentC=TextEditingController();
            @override void initState(){ super.initState(); _load(); }
            Future<void> _load() async{ final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs_v82"); if(s!=null){ setState(()=>_docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)))); } }
            Future<void> _save() async{ final p=await SharedPreferences.getInstance(); p.setString("mtrdf_docs_v82", jsonEncode(_docs)); }
            Future<void> _pickDocx() async{
              setState(()=>_loading=true);
              try{
                FilePickerResult? result = await FilePicker.platform.pickFiles(type: FileType.custom, allowedExtensions: ['docx'], withData: true);
                if(result!=null && result.files.first.bytes!=null){
                  String name=result.files.first.name; String text=docxToText(result.files.first.bytes!);
                  if(text.trim().isEmpty) text="Could not extract $name";
                  setState(()=>_docs.add({"name":name, "content":text, "date":DateTime.now().toString().substring(0,10), "type":"docx"})); await _save();
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("Imported $name: ${text.length} chars")));
                }
              }catch(e){ ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("Error $e"))); }
              setState(()=>_loading=false);
            }
            Future<void> _pickImage() async{
              setState(()=>_loading=true);
              try{
                FilePickerResult? result = await FilePicker.platform.pickFiles(type: FileType.custom, allowedExtensions: ['jpg','jpeg','png'], withData: true);
                if(result!=null){
                  String name=result.files.first.name;
                  final dir=await getApplicationDocumentsDirectory();
                  final file=File('${dir.path}/$name');
                  if(result.files.first.bytes!=null){ await file.writeAsBytes(result.files.first.bytes!); }
                  else if(result.files.first.path!=null){ await File(result.files.first.path!).copy(file.path); }
                  setState(()=>_docs.add({"name":name, "content":"IMAGE_FILE:${file.path}", "date":DateTime.now().toString().substring(0,10), "type":"image"})); await _save();
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("Image $name saved")));
                }
              }catch(e){ ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("Image error $e"))); }
              setState(()=>_loading=false);
            }
            void _addTextDoc(){ String name=_nameC.text.trim().isEmpty? "Doc ${_docs.length+1}": _nameC.text.trim(); if(_contentC.text.trim().isEmpty) return; setState(()=>_docs.add({"name":name, "content":_contentC.text.trim(), "date":DateTime.now().toString().substring(0,10), "type":"text"})); _save(); _nameC.clear(); _contentC.clear(); Navigator.pop(context); }
            void _showAddOptions(){ showModalBottomSheet(context: context, builder: (_)=> SafeArea(child: Wrap(children:[ ListTile(leading: const Icon(Icons.text_fields), title: const Text("Paste Text Notes"), onTap: (){ Navigator.pop(context); showDialog(context: context, builder: (_)=>AlertDialog(title: const Text("Add Text"), content: SingleChildScrollView(child: Column(mainAxisSize: MainAxisSize.min, children:[ TextField(controller: _nameC, decoration: const InputDecoration(labelText: "Doc Name")), const SizedBox(height:8), TextField(controller: _contentC, maxLines: 8, decoration: const InputDecoration(labelText: "Paste content", border: OutlineInputBorder())) ])), actions: [TextButton(onPressed: ()=>Navigator.pop(context), child: const Text("Cancel")), ElevatedButton(onPressed: _addTextDoc, style: ElevatedButton.styleFrom(backgroundColor: Colors.green), child: const Text("Save", style: TextStyle(color: Colors.white)))])); }), ListTile(leading: const Icon(Icons.description, color: Colors.blue), title: const Text("Upload WORD.docx"), subtitle: const Text("Auto extract text"), onTap: (){ Navigator.pop(context); _pickDocx(); }), ListTile(leading: const Icon(Icons.image, color: Colors.orange), title: const Text("Upload Image JPG/PNG"), subtitle: const Text("Save photo of notes"), onTap: (){ Navigator.pop(context); _pickImage(); }), ]))); }
            @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text('My Documents - ${_docs.length}'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: _loading? const Center(child: CircularProgressIndicator(color: Colors.green)): _docs.isEmpty? const Center(child: Text("Tap + to add DOCX / Image / Text", textAlign: TextAlign.center)): ListView.builder(padding: const EdgeInsets.all(12), itemCount: _docs.length, itemBuilder: (_,i){ var d=_docs[i]; bool isImg=d["type"]=="image"; return Card(child: ListTile(leading: Icon(isImg? Icons.image: Icons.description, color: isImg? Colors.orange: Colors.blue), title: Text(d["name"]!), subtitle: Text("${d["type"]} - ${d["date"]}"), trailing: IconButton(icon: const Icon(Icons.delete), onPressed: (){ setState(()=>_docs.removeAt(i)); _save(); })) ); }), floatingActionButton: FloatingActionButton.extended(onPressed: _showAddOptions, backgroundColor: Colors.green, icon: const Icon(Icons.add, color: Colors.white), label: const Text("Add Document", style: TextStyle(color: Colors.white)))); }
          }
          class AITutorPage extends StatefulWidget{ final String subjectName; const AITutorPage({super.key, required this.subjectName}); @override State<AITutorPage> createState()=>_AITutorPageState(); }
          class _AITutorPageState extends State<AITutorPage>{
            final _c=TextEditingController(); final List<Map<String,String>> _msgs=[{"role":"ai","text":"MTRDF V8.2 Ready!\nUpload DOCX and Images in My Docs.\nAsk questions - I search your docs!"}]; List<Map<String,String>> _myDocs=[];
            @override void initState(){ super.initState(); _loadDocs(); }
            Future<void> _loadDocs() async{ final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs_v82"); if(s!=null){ setState(()=>_myDocs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)))); } }
            String _smartSearch(String q){ if(_myDocs.isEmpty) return "No docs yet. Go to My Docs and upload DOCX/Images."; String lowerQ=q.toLowerCase(); List<String> keys=lowerQ.split(" ").where((w)=>w.length>3).toList(); if(keys.isEmpty) keys=[lowerQ]; String out=""; for(var doc in _myDocs){ String content=doc["content"]!; if(content.startsWith("IMAGE_FILE:")){ if(lowerQ.contains("image") || lowerQ.contains(doc["name"]!.toLowerCase())) out+="📷 IMAGE: '${doc["name"]}' - view in My Docs\n"; continue; } String low=content.toLowerCase(); int pos=-1; for(String k in keys){ pos=low.indexOf(k); if(pos!=-1) break; } if(pos!=-1){ int start=pos-150; if(start<0) start=0; int end=pos+350; if(end>content.length) end=content.length; out+="📄 FROM '${doc["name"]}' (${doc["type"]}):\n...${content.substring(start,end)}...\n\n---\n\n"; } } if(out.isEmpty) return "Have ${_myDocs.length} docs, no exact match for '$q'. Try shorter keywords."; return "✅ FROM YOUR DOCS:\n\n$out"; }
            void _send(){ if(_c.text.trim().isEmpty) return; String q=_c.text; setState((){ _msgs.add({"role":"user","text":q}); _msgs.add({"role":"ai","text":_smartSearch(q)}); }); _c.clear(); }
            @override Widget build(BuildContext context){ return Scaffold(appBar: AppBar(title: Text('${widget.subjectName} - ${_myDocs.length} docs'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Column(children:[Expanded(child: ListView.builder(padding: const EdgeInsets.all(12), itemCount: _msgs.length, itemBuilder: (_,i){ final m=_msgs[i]; bool u=m["role"]=="user"; return Align(alignment: u? Alignment.centerRight: Alignment.centerLeft, child: Container(margin: const EdgeInsets.symmetric(vertical:4), padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: u? Colors.green: Colors.grey[200], borderRadius: BorderRadius.circular(12)), child: Text(m["text"]!, style: TextStyle(color: u? Colors.white: Colors.black)))); })), const Divider(height:1), Padding(padding: const EdgeInsets.all(8), child: Row(children:[Expanded(child: TextField(controller: _c, decoration: InputDecoration(hintText: "Ask from your docs...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted: (_)=>_send())), const SizedBox(width:8), CircleAvatar(backgroundColor: Colors.green, child: IconButton(icon: const Icon(Icons.send, color: Colors.white), onPressed: _send))]))])); }
          }
          DART
          flutter pub get
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: MTRDF-V8.2-DOCX-IMAGE
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
