                {'title':'Importance - Tourism','exp':'Rivers attract tourists for rafting, sport fishing, scenery.','ex':'White water rafting on River Nile Jinja earns dollars.'},
                {'title':'Importance - Settlement and Farming','exp':'People settle near rivers because of fertile soils and water.','ex':'Towns like Jinja, Pakwach grew near River Nile.'},
                {'title':'Challenges','exp':'Flooding, pollution, siltation, water hyacinth.','ex':'River Rwizi in Mbarara polluted by town waste.'},
                {'title':'Conservation','exp':'Plant trees on banks, ban pollution, protect wetlands.','ex':'Tree planting along River Mbale.'},
                {'title':'UNEB Exam Tip','exp':'Define river 2 marks, importance 5 marks with Uganda examples in table.','ex':'Table: Importance - Example - Location.'},
              ].take(needPoints).toList();
            }
