name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build MTRDF V12.4 FIXED NULL
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          version: 12.4.0+45
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.1.9
            archive: ^3.6.1
            path_provider: ^2.1.2
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'dart:convert';

          String extractDocx(List<int> bytes) {
            try {
              final archive = ZipDecoder().decodeBytes(bytes);
              for (final f in archive) {
                if (f.name == 'word/document.xml') {
                  final xml = utf8.decode(f.content as List<int>);
                  return RegExp(r'<w:t[^>]*>([^<]+)</w:t>').allMatches(xml).map((m) => m.group(1)?? '').join(' ');
                }
              }
              return "No xml found";
            } catch (e) {
              return "Error $e";
            }
          }

          String snippet(String content, String query) {
            final lower = content.toLowerCase();
            final pos = lower.indexOf(query.toLowerCase());
            if (pos == -1) return content.length > 500? content.substring(0, 500) + "..." : content;
            int start = pos - 200; if (start < 0) start = 0;
            int end = pos + 500; if (end > content.length) end = content.length;
            String t = content.substring(start, end);
            if (start > 0) t = "..." + t;
            if (end < content.length) t = t + "...";
            return t;
          }

          void main() { runApp(const App()); }

          class App extends StatelessWidget {
            const App({super.key});
            @override Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, home: Tabs());
            }
          }

          class Tabs extends StatefulWidget {
            @override State<Tabs> createState() => _TabsS();
          }

          class _TabsS extends State<Tabs> {
            int i = 0;
            final pages = [Home(), Docs(), Geo(), Research()];
            @override Widget build(BuildContext context) {
              return Scaffold(
                body: pages[i],
                bottomNavigationBar: BottomNavigationBar(
                  type: BottomNavigationBarType.fixed,
                  currentIndex: i,
                  onTap: (x) => setState(() => i = x),
                  selectedItemColor: Colors.green,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.school), label: "Subjects"),
                    BottomNavigationBarItem(icon: Icon(Icons.folder), label: "My Docs"),
                    BottomNavigationBarItem(icon: Icon(Icons.map), label: "GeographyLab"),
                    BottomNavigationBarItem(icon: Icon(Icons.search), label: "Research"),
                  ],
                ),
              );
            }
          }

          class Home extends StatelessWidget {
            @override Widget build(BuildContext context) {
              final subjects = ["Mathematics","Biology","Chemistry","Physics","History","Geography","English","Agriculture"];
              return Scaffold(
                appBar: AppBar(title: Text('MTRDF V12.4 GREEN'), backgroundColor: Colors.green, foregroundColor: Colors.white),
                body: ListView.builder(
                  padding: EdgeInsets.all(12),
                  itemCount: subjects.length,
                  itemBuilder: (_, j) {
                    return Card(
                      child: ListTile(
                        leading: Icon(Icons.book, color: Colors.green),
                        title: Text(subjects[j]),
                        subtitle: Text("Hybrid Offline+Online"),
                        onTap: () { Navigator.push(context, MaterialPageRoute(builder: (_) => Chat(subject: subjects[j]))); },
                      ),
                    );
                  },
                ),
              );
            }
          }

          class Docs extends StatefulWidget {
            @override State<Docs> createState() => _DocsS();
          }

          class _DocsS extends State<Docs> {
            List<Map<String, String>> docs = [];
            bool loading = false;
            @override void initState() { super.initState(); _load(); }
            Future<void> _load() async {
              final p = await SharedPreferences.getInstance();
              String? s = p.getString("mtrdf_docs_v10");
              if (s!= null) {
                setState(() => docs = List<Map<String, String>>.from(jsonDecode(s).map((e) => Map<String, String>.from(e))));
              }
            }
            Future<void> _save() async {
              final p = await SharedPreferences.getInstance();
              p.setString("mtrdf_docs_v10", jsonEncode(docs));
            }
            Future<void> _pick() async {
              setState(() => loading = true);
              try {
                FilePickerResult? r = await FilePicker.platform.pickFiles(type: FileType.custom, allowedExtensions: ['docx'], withData: true);
                if (r!= null && r.files.first.bytes!= null) {
                  String t = extractDocx(r.files.first.bytes!.toList());
                  setState(() => docs.add({"name": r.files.first.name, "content": t, "date": DateTime.now().toString().substring(0, 10), "type": "docx"}));
                  _save();
                }
              } catch (e) {}
              setState(() => loading = false);
            }
            @override Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('My Docs - ${docs.length}'), backgroundColor: Colors.green, foregroundColor: Colors.white),
                body: loading? Center(child: CircularProgressIndicator(color: Colors.green)) : docs.isEmpty? Center(child: Text("No docs - Add UCE_Geography.docx")) : ListView.builder(
                  padding: EdgeInsets.all(12),
                  itemCount: docs.length,
                  itemBuilder: (_, j) {
                    var d = docs[j];
                    return Card(
                      child: ListTile(
                        leading: Icon(Icons.description, color: Colors.blue),
                        title: Text(d["name"]?? "Unnamed"),
                        subtitle: Text(d["type"]?? "docx"),
                        onTap: () {
                          showDialog(context: context, builder: (_) => AlertDialog(title: Text(d["name"]?? "Doc"), content: SingleChildScrollView(child: Text(d["content"]?? "")), actions: [TextButton(onPressed: () => Navigator.pop(context), child: Text("Close"))]));
                        },
                        trailing: IconButton(icon: Icon(Icons.delete), onPressed: () { setState(() => docs.removeAt(j)); _save(); }),
                      ),
                    );
                  },
                ),
                floatingActionButton: FloatingActionButton.extended(onPressed: _pick, backgroundColor: Colors.green, icon: Icon(Icons.add, color: Colors.white), label: Text("Add DOCX", style: TextStyle(color: Colors.white))),
              );
            }
          }

          class Geo extends StatelessWidget {
            @override Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('GeographyLab - Hybrid Architecture'), backgroundColor: Colors.green, foregroundColor: Colors.white),
                body: ListView(
                  padding: EdgeInsets.all(12),
                  children: [
                    Card(color: Colors.green[50], child: ListTile(leading: Icon(Icons.map, color: Colors.green, size: 40), title: Text("Uganda Offline Map - V12.4 GREEN"), subtitle: Text("Hybrid: Offline-First + Secure Online\n50MB mbtiles ready"))),
                    Card(child: ListTile(title: Text("Lake Victoria Basin"), subtitle: Text("Largest lake, formation, importance"), leading: Icon(Icons.water, color: Colors.blue))),
                    Card(child: ListTile(title: Text("Rift Valley Lakes"), subtitle: Text("Albert, Edward, George"))),
                    Card(child: ListTile(title: Text("Drainage: lakes & rivers"), subtitle: Text("UNEB Q: importance of lakes & rivers in Uganda"))),
                    Container(padding: EdgeInsets.all(12), decoration: BoxDecoration(color: Colors.grey[200], borderRadius: BorderRadius.circular(8)), child: Text("FLUTTER MODULES:\n1. Ingestion: file_picker 10.1.9 (36) + archive\n2. Storage: shared_prefs JSON L1 (V10 GREEN)\n3. Search: SMART RAG pos-200+500\n4. Routing: Local RAG -> Rules -> Online LLM\n5. Backend: Firebase proxy (no API key in APK)", style: TextStyle(fontSize: 11))),
                  ],
                ),
              );
            }
          }

          class Research extends StatefulWidget {
            @override State<Research> createState() => _ResS();
          }

          class _ResS extends State<Research> {
            final _c = TextEditingController();
            List<Map<String, String>> res = [];
            Future<void> _search(String q) async {
              final p = await SharedPreferences.getInstance();
              String? s = p.getString("mtrdf_docs_v10");
              List<Map<String, String>> docs = [];
              if (s!= null) docs = List<Map<String, String>>.from(jsonDecode(s).map((e) => Map<String, String>.from(e)));
              List<Map<String, String>> r = [];
              for (var d in docs) {
                if ((d["content"]?? "").toLowerCase().contains(q.toLowerCase())) {
                  r.add({"title": "FROM YOUR DOC: ${d["name"]?? "Doc"}", "snip": snippet(d["content"]?? "", q)});
                }
              }
              if (q.toLowerCase().contains("lake") || q.toLowerCase().contains("river")) {
                r.add({"title": "UNEB 2023 Q2: Formation of Rift Valley lakes", "snip": "Past paper + your UCE_Geography doc"});
                r.add({"title": "UNEB 2022 Q5: Importance of lakes & rivers", "snip": "HA question 10 marks"});
              }
              setState(() => res = r);
            }
            @override Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Research - Hybrid'), backgroundColor: Colors.green, foregroundColor: Colors.white),
                body: Column(children: [
                  Padding(padding: EdgeInsets.all(12), child: Row(children: [Expanded(child: TextField(controller: _c, decoration: InputDecoration(hintText: "Search lakes and rivers...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted: _search)), IconButton(icon: Icon(Icons.search, color: Colors.green), onPressed: () => _search(_c.text))]) ),
                  Expanded(child: res.isEmpty? Center(child: Text("Search 'lakes and rivers'\nYour DOCX + Past Papers")) : ListView.builder(padding: EdgeInsets.all(12), itemCount: res.length, itemBuilder: (_, i) { return Card(color: res[i]["title"]!.contains("DOC")? Colors.green[50] : Colors.blue[50], child: ListTile(title: Text(res[i]["title"]?? ""), subtitle: Text(res[i]["snip"]?? ""))); }))
                ]),
              );
            }
          }

          class Chat extends StatefulWidget {
            final String subject; const Chat({super.key, required this.subject});
            @override State<Chat> createState() => _ChatS();
          }

          class _ChatS extends State<Chat> {
            final _c = TextEditingController();
            final List<Map<String, String>> msgs = [{"role": "ai", "text": "V12.4 GREEN FIXED - Hybrid ready!"}];
            List<Map<String, String>> myDocs = [];
            @override void initState() { super.initState(); _load(); }
            Future<void> _load() async {
              final p = await SharedPreferences.getInstance();
              String? s = p.getString("mtrdf_docs_v10");
              if (s!= null) setState(() => myDocs = List<Map<String, String>>.from(jsonDecode(s).map((e) => Map<String, String>.from(e))));
            }
            String _search(String q) {
              if (myDocs.isEmpty) return "No docs. Add UCE_Geography.docx in My Docs.";
              String out = ""; int f = 0;
              for (var d in myDocs) {
                if ((d["content"]?? "").toLowerCase().contains(q.toLowerCase())) {
                  f++; out += "FROM '${d["name"]?? "Doc"}':\n${snippet(d["content"]?? "", q)}\n\n---\n\n";
                }
              }
              return f == 0? "No match '$q' in ${myDocs.length} docs" : "FOUND $f:\n\n$out";
            }
            void _send() {
              if (_c.text.isEmpty) return;
              String q = _c.text;
              setState(() { msgs.add({"role": "user", "text": q}); msgs.add({"role": "ai", "text": _search(q)}); });
              _c.clear();
            }
            @override Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('${widget.subject} - ${myDocs.length} docs'), backgroundColor: Colors.green, foregroundColor: Colors.white),
                body: Column(children: [
                  Expanded(child: ListView.builder(padding: EdgeInsets.all(12), itemCount: msgs.length, itemBuilder: (_, i) { final m = msgs[i]; bool u = m["role"] == "user"; return Align(alignment: u? Alignment.centerRight : Alignment.centerLeft, child: Container(margin: EdgeInsets.symmetric(vertical: 4), padding: EdgeInsets.all(12), decoration: BoxDecoration(color: u? Colors.green : Colors.grey[200], borderRadius: BorderRadius.circular(12)), child: Text(m["text"]?? ""))); })),
                  Padding(padding: EdgeInsets.all(8), child: Row(children: [Expanded(child: TextField(controller: _c, decoration: InputDecoration(hintText: "Ask lakes and rivers...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted: (_) => _send())), IconButton(icon: Icon(Icons.send, color: Colors.green), onPressed: _send)]))
                ]),
              );
            }
          }
          DART
          flutter pub get
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTRDF-V12.4-FIXED-GREEN
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
