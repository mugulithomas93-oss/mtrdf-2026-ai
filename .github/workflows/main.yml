name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false
      - name: Build V14.5 FORCE
        run: |
          rm -rf build
          flutter clean
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite || true
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          version: 14.5.0+53
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.1.9
            archive: ^3.6.1
            syncfusion_flutter_pdf: ^28.2.7
            hive_flutter: ^1.1.0
            share_plus: ^12.0.2
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'dart:convert';
          String extractDocx(List<int> b){ try{ final a=ZipDecoder().decodeBytes(b); for(final f in a){ if(f.name=='word/document.xml'){ final x=utf8.decode(f.content as List<int>); return RegExp(r'<w:t[^>]*>([^<]+)</w:t>').allMatches(x).map((m)=>m.group(1)??'').join(' '); } } return "No xml"; }catch(e){ return "Err $e"; } }
          String extractPdf(List<int> b){ try{ final d=PdfDocument(inputBytes: b); final t=PdfTextExtractor(d).extractText(); d.dispose(); return t.isEmpty? "Scanned":t; }catch(e){ return "PDF $e"; } }
          String snippet(String c,String q){ final low=c.toLowerCase(); int p=low.indexOf(q.toLowerCase()); if(p==-1){ final kws=q.toLowerCase().split(RegExp(r'\s+')).where((w)=>w.length>2).toList(); for(var k in kws){ int x=low.indexOf(k); if(x!=-1){ p=x; break; } } } if(p==-1) return c.length>500? c.substring(0,500)+"...":c; int s=p-200; if(s<0) s=0; int e=p+500; if(e>c.length) e=c.length; String t=c.substring(s,e); if(s>0) t="..."+t; if(e<c.length) t=t+"..."; return t; }
          bool matches(String c,String q,String subj){ final low=c.toLowerCase(); final qq=q.toLowerCase().trim(); if(qq.isEmpty) return false; if(subj.toLowerCase()=="biology" && qq.startsWith("define ")){ String tar=qq.replaceAll("define ","").trim(); if(tar.length>2 && low.contains("geography") &&!low.contains(tar)) return false; } if(low.contains(qq)) return true; for(var k in qq.split(RegExp(r'\s+'))){ if(k.length>2 && low.contains(k)) return true; } return false; }
          Widget highlight(String t,String q){ final low=t.toLowerCase(); final kws=q.toLowerCase().split(RegExp(r'\s+')).where((w)=>w.length>2).toList(); if(kws.isEmpty) return Text(t); String? b; int bp=-1; for(var k in kws){ int p=low.indexOf(k); if(p!=-1 && (bp==-1||p<bp)){ bp=p; b=k; } } if(b==null) return Text(t); List<TextSpan> sp=[]; int idx=0; while(true){ int p=low.indexOf(b, idx); if(p==-1){ sp.add(TextSpan(text: t.substring(idx))); break; } if(p>idx) sp.add(TextSpan(text: t.substring(idx,p))); sp.add(TextSpan(text: t.substring(p,p+b.length), style: TextStyle(backgroundColor: Colors.yellow, fontWeight: FontWeight.bold))); idx=p+b.length; } return RichText(text: TextSpan(style: TextStyle(color: Colors.black87), children: sp)); }
          void main() async { WidgetsFlutterBinding.ensureInitialized(); await Hive.initFlutter(); await Hive.openBox('mtrdf_v14'); runApp(App()); }
          class App extends StatelessWidget{ @override Widget build(BuildContext c){ return MaterialApp(debugShowCheckedModeBanner: false, home: Tabs()); } }
          class Tabs extends StatefulWidget{ @override State<Tabs> createState()=>_TabsS(); }
          class _TabsS extends State<Tabs>{ int i=0; final p=[Home(), Docs(), GeoMap(), Research()]; @override Widget build(BuildContext c){ return Scaffold(body: p[i], bottomNavigationBar: BottomNavigationBar(type: BottomNavigationBarType.fixed, currentIndex: i, selectedItemColor: Colors.green, onTap: (x)=>setState(()=>i=x), items: [BottomNavigationBarItem(icon: Icon(Icons.school), label: "Subjects"), BottomNavigationBarItem(icon: Icon(Icons.folder), label: "My Docs"), BottomNavigationBarItem(icon: Icon(Icons.map), label: "GeographyLab"), BottomNavigationBarItem(icon: Icon(Icons.search), label: "Research")])); } }
          class Home extends StatelessWidget{ @override Widget build(BuildContext c){ final s=["Mathematics","Biology","Chemistry","Physics","History","Geography","English","Agriculture"]; return Scaffold(appBar: AppBar(title: Text("MTRDF V14.5 GOLD"), backgroundColor: Colors.green, foregroundColor: Colors.white), body: ListView.builder(padding: EdgeInsets.all(12), itemCount: s.length, itemBuilder: (_,j){ return Card(child: ListTile(leading: Icon(Icons.book, color: Colors.green), title: Text(s[j]), onTap: ()=>Navigator.push(c, MaterialPageRoute(builder: (_)=>Chat(subject: s[j]))))); })); } }
          class Docs extends StatefulWidget{ @override State<Docs> createState()=>_DocsS(); }
          class _DocsS extends State<Docs>{ List<Map<String,String>> docs=[]; bool l=false; @override void initState(){ super.initState(); ld(); } Future<void> ld() async { final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs_v10"); if(s!=null) docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))); final b=Hive.box('mtrdf_v14'); String? h=b.get('docs'); if(h!=null){ try{ docs=List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e))); }catch(e){} } setState((){}); } Future<void> sv() async { final p=await SharedPreferences.getInstance(); p.setString("mtrdf_docs_v10", jsonEncode(docs)); Hive.box('mtrdf_v14').put('docs', jsonEncode(docs)); } Future<void> pk() async { setState(()=>l=true); try{ FilePickerResult? r=await FilePicker.platform.pickFiles(type: FileType.custom, allowedExtensions: ['docx','pdf'], withData: true); if(r!=null && r.files.first.bytes!=null){ String n=r.files.first.name; List<int> by=r.files.first.bytes!.toList(); String t=n.toLowerCase().endsWith('.pdf')? extractPdf(by): extractDocx(by); setState(()=>docs.add({"name":n,"content":t,"type":n.toLowerCase().endsWith('.pdf')?"pdf":"docx"})); sv(); } }catch(e){} setState(()=>l=false); } @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text("My Docs ${docs.length} V14.5"), backgroundColor: Colors.green, foregroundColor: Colors.white), body: l? Center(child: CircularProgressIndicator()): docs.isEmpty? Center(child: Text("No docs")): ListView.builder(padding: EdgeInsets.all(12), itemCount: docs.length, itemBuilder: (_,j){ var d=docs[j]; return Card(child: ListTile(title: Text(d["name"]??""), subtitle: Text("${d["type"]} ${(d["content"]??"").length}"), trailing: IconButton(icon: Icon(Icons.delete), onPressed: (){ setState(()=>docs.removeAt(j)); sv(); })))); }), floatingActionButton: FloatingActionButton.extended(onPressed: pk, backgroundColor: Colors.green, icon: Icon(Icons.add, color: Colors.white), label: Text("Add DOCX/PDF", style: TextStyle(color: Colors.white)))); } }
          class GeoMap extends StatelessWidget{ @override Widget build(BuildContext context){ final lakes=[{"name":"Lake Victoria","q":"Lake Victoria climatology rainfall","x":0.75,"y":0.6},{"name":"Lake Albert","q":"Lake Albert Rift Valley","x":0.25,"y":0.25},{"name":"Lake Kyoga","q":"Lake Kyoga Nile","x":0.65,"y":0.3},{"name":"Lake Edward","q":"Rift Valley","x":0.15,"y":0.65}]; return Scaffold(appBar: AppBar(title: Text("GeographyLab OFFLINE V14.5"), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Column(children: [Expanded(flex:3, child: Stack(children: [Container(width: double.infinity, height: double.infinity, color: Color(0xFFE8F5E9), child: CustomPaint(painter: UgandaPainter())), for(var la in lakes) Positioned(left: MediaQuery.of(context).size.width*(la["x"] as double)-30, top: 250*(la["y"] as double), child: GestureDetector(onTap: ()=>Navigator.push(context, MaterialPageRoute(builder: (_)=>Research(initialQuery: la["q"] as String))), child: Column(children: [Icon(Icons.location_on, color: Colors.red, size: 32), Container(padding: EdgeInsets.symmetric(horizontal: 6, vertical: 2), decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(6), border: Border.all(color: Colors.red)), child: Text(la["name"] as String, style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold))) ]))), Positioned(top: 8, left: 8, child: Container(padding: EdgeInsets.symmetric(horizontal: 8, vertical: 4), decoration: BoxDecoration(color: Colors.green, borderRadius: BorderRadius.circular(12)), child: Text("OFFLINE CANVAS - 0 B/S", style: TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.bold)))) ])), Expanded(flex:2, child: ListView(padding: EdgeInsets.all(8), children: [Card(color: Colors.green[50], child: ListTile(leading: Icon(Icons.check_circle, color: Colors.green), title: Text("V14.5 OFFLINE - No internet needed"), subtitle: Text("Tap pins → Research"))), for(var la in lakes) Card(child: ListTile(title: Text(la["name"] as String), subtitle: Text(la["q"] as String), onTap: ()=>Navigator.push(context, MaterialPageRoute(builder: (_)=>Research(initialQuery: la["q"] as String))))), ])), ])); } }
          class UgandaPainter extends CustomPainter{ @override void paint(Canvas c, Size s){ final f=Paint()..color=Color(0xFFC8E6C9)..style=PaintingStyle.fill; final b=Paint()..color=Colors.green..style=PaintingStyle.stroke..strokeWidth=2; Path p=Path(); p.moveTo(s.width*0.2,s.height*0.2); p.lineTo(s.width*0.8,s.height*0.15); p.lineTo(s.width*0.85,s.height*0.75); p.lineTo(s.width*0.15,s.height*0.8); p.close(); c.drawPath(p,f); c.drawPath(p,b); final g=Paint()..color=Colors.green.withOpacity(0.2)..strokeWidth=0.5; for(int i=0;i<5;i++){ c.drawLine(Offset(0,s.height*i/5), Offset(s.width,s.height*i/5), g); c.drawLine(Offset(s.width*i/5,0), Offset(s.width*i/5,s.height), g); } } @override bool shouldRepaint(covariant CustomPainter o)=>false; }
          class Research extends StatefulWidget{ final String initialQuery; const Research({super.key, this.initialQuery=""}); @override State<Research> createState()=>_ResS(); }
          class _ResS extends State<Research>{ final ctrl=TextEditingController(); List<Map<String,String>> res=[]; String last=""; @override void initState(){ super.initState(); if(widget.initialQuery.isNotEmpty){ ctrl.text=widget.initialQuery; Future.delayed(Duration(milliseconds: 300), ()=>sr(widget.initialQuery)); } } Future<void> sr(String q) async { last=q; final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs_v10"); List<Map<String,String>> ds=[]; if(s!=null) ds=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))); final b=Hive.box('mtrdf_v14'); String? h=b.get('docs'); if(h!=null){ try{ ds=List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e))); }catch(e){} } List<Map<String,String>> r=[]; for(var d in ds){ if(matches(d["content"]??"", q, "research")) r.add({"title":"FROM YOUR DOC: ${d["name"]}", "snip":snippet(d["content"]??"", q)}); } setState(()=>res=r); } @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text("Research V14.5"), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Column(children: [Padding(padding: EdgeInsets.all(12), child: Row(children: [Expanded(child: TextField(controller: ctrl, decoration: InputDecoration(hintText: "Search...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted: sr)), IconButton(icon: Icon(Icons.search, color: Colors.green), onPressed: ()=>sr(ctrl.text))])), Expanded(child: res.isEmpty? Center(child: Text(last.isEmpty? "Tap map pin" : "No match $last")): ListView.builder(padding: EdgeInsets.all(12), itemCount: res.length, itemBuilder: (_,i){ var r=res[i]; return Card(color: Colors.green[50], child: ListTile(title: Text(r["title"]??"", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 13)), subtitle: highlight(r["snip"]??"", last))); }))]))); } }
          class Chat extends StatefulWidget{ final String subject; const Chat({super.key, required this.subject}); @override State<Chat> createState()=>_ChatS(); }
          class _ChatS extends State<Chat>{ final ctrl=TextEditingController(); List<Map<String,String>> msgs=[{"role":"ai","text":"V14.5 GOLD FINAL - Biology fix + offline canvas"}]; List<Map<String,String>> myDocs=[]; @override void initState(){ super.initState(); ld(); } Future<void> ld() async { final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs_v10"); if(s!=null) setState(()=>myDocs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)))); final b=Hive.box('mtrdf_v14'); String? h=b.get('docs'); if(h!=null){ try{ myDocs=List<Map<String,String>>.from(jsonDecode(h).map((e)=>Map<String,String>.from(e))); setState((){}); }catch(e){} } } String sd(String q){ if(myDocs.isEmpty) return "No docs. Add DOCX in My Docs."; String out=""; int f=0; for(var d in myDocs){ if(matches(d["content"]??"", q, widget.subject)){ f++; out+="FROM '${d["name"]}':\n${snippet(d["content"]??"", q)}\n\n---\n\n"; } } if(f==0) return "No match '$q' in ${widget.subject}. Have ${myDocs.length} docs. (V14.5 Biology won't return Geography)"; return "✅ V14.5 FOUND $f for ${widget.subject}:\n\n$out"; } void send(){ if(ctrl.text.isEmpty) return; String q=ctrl.text; setState((){ msgs.add({"role":"user","text":q}); msgs.add({"role":"ai","text":sd(q)}); }); ctrl.clear(); } @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text("${widget.subject} - ${myDocs.length} V14.5"), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Column(children: [Expanded(child: ListView.builder(padding: EdgeInsets.all(12), itemCount: msgs.length, itemBuilder: (_,i){ final m=msgs[i]; bool u=m["role"]=="user"; return Align(alignment: u? Alignment.centerRight: Alignment.centerLeft, child: Container(margin: EdgeInsets.symmetric(vertical: 4), padding: EdgeInsets.all(12), decoration: BoxDecoration(color: u? Colors.green: Colors.grey[200], borderRadius: BorderRadius.circular(12)), child: Text(m["text"]??""))); })), Padding(padding: EdgeInsets.all(8), child: Row(children: [Expanded(child: TextField(controller: ctrl, decoration: InputDecoration(hintText: "Ask ${widget.subject}...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted: (_)=>send())), IconButton(icon: Icon(Icons.send, color: Colors.green), onPressed: send)])) ])); } }
          DART
          flutter pub get
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTRDF-V14-5-GOLD-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
