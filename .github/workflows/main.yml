          };

          Map<String,dynamic> parseInstructions(String input){
            String l=input.toLowerCase();
            int points=10;
            var m=RegExp(r'(\d+)\s*points?').firstMatch(l);
            if(m!=null){ points=int.tryParse(m.group(1)!)??10; }
            if(points>20) points=20;
            bool needExamples=l.contains('example');
            bool needDetailed=l.contains('well explained')||l.contains('detailed')||l.contains('explain');
            bool needTable=l.contains('table');
            String level='S2-S4';
            if(l.contains('s1')) level='S1';
            if(l.contains('s2')) level='S2';
            if(l.contains('s3')||l.contains('s4')) level='S3-S4';
            if(l.contains('s6')) level='S6';
            bool uneb=l.contains('uneb');
            String core=extractCoreTopic(input);
            return {'points':points,'examples':needExamples,'detailed':needDetailed,'table':needTable,'level':level,'uneb':uneb,'core':core,'original':input};
          }

          List<Map<String,String>> getPointsForCore(String core, int needPoints){
            String l=core.toLowerCase();
            List<Map<String,String>> points=[];
            for(var k in curriculumDB.keys){
              if(l.contains(k)||k.contains(l)|| (l.contains('tourism')&&k.contains('tourism')) || (l.contains('agriculture')&&k.contains('agriculture')) || (l.contains('climate')&&k.contains('climate')) || (l.contains('river')&&k.contains('rivers')) || (l.contains('mountain')&&k.contains('mountains'))){
                points=List.from(curriculumDB[k]!);
                break;
              }
            }
            if(points.isEmpty){
              if(l.contains('tourism')) points=List.from(curriculumDB['importance of tourism in uganda']!);
              else if(l.contains('lake victoria')) points=List.from(curriculumDB['location of lake victoria']!);
              else if(l.contains('geography')) points=List.from(curriculumDB['importance of geography']!);
              else if(l.contains('agriculture')) points=List.from(curriculumDB['importance of agriculture']!);
              else if(l.contains('climate')) points=List.from(curriculumDB['climate of uganda']!);
              else {
                points=[
                  {'title':'Definition of ' + core,'exp':'Explains meaning of ' + core + ' in Uganda curriculum.','ex':'In Uganda, ' + core + ' taught in schools.'},
                  {'title':'Economic Importance','exp':core + ' contributes to GDP and income.','ex':'Many earn from ' + core + ' in central region.'},
                  {'title':'Social Benefits','exp':core + ' improves community life.','ex':'Communities around Kampala benefit.'},
                  {'title':'Environmental Aspect','exp':'Relates to conservation.','ex':'Managed sustainably in national parks.'},
                  {'title':'Educational Value','exp':'Studied in schools.','ex':'S2 syllabus includes ' + core + '.'},
                  {'title':'Employment','exp':'Creates jobs.','ex':'Youth jobs linked to ' + core + '.'},
                  {'title':'Government Role','exp':'Government supports it.','ex':'Ministry policies for ' + core + '.'},
                  {'title':'Challenges','exp':'Funding, awareness challenges.','ex':'Limited infrastructure in rural areas.'},
                  {'title':'Solutions','exp':'Training, funding, sensitization.','ex':'Government programs improve ' + core + '.'},
                  {'title':'Future Prospects','exp':'Bright future with technology.','ex':'Vision 2040 includes ' + core + '.'},
                ];
              }
            }
            while(points.length<needPoints){ points.addAll(List.from(points)); }
            return points.take(needPoints).toList();
          }

          Future<List<Map<String,String>>> searchWikiSmart(String originalQ) async {
            List<Map<String,String>> r=[];
            String q=extractCoreTopic(originalQ);
            try{
              final u=Uri.parse('https://en.wikipedia.org/api/rest_v1/page/summary/' + Uri.encodeComponent(q.trim()));
              final resp=await http.get(u, headers:{'User-Agent':'MTRDF/1.0'}).timeout(Duration(seconds:8));
              if(resp.statusCode==200){
                final d=jsonDecode(resp.body);
                String ex=decodeHtml((d['extract']??'').toString());
                if(ex.length>60){ r.add({'title':(d['title']??q).toString(),'snip':ex,'url':'https://en.wikipedia.org/wiki/' + Uri.encodeComponent((d['title']??q).toString()),'source':'Wikipedia','cite':'[1]'}); }
              }
            }catch(e){}
            return r;
          }

          Future<Map<String,dynamic>> deepResearchFormatted(String q, String subject, List<Map<String,String>> myDocs) async {
            var instr=parseInstructions(q);
            String core=instr['core'];
            int needPoints=instr['points'];
            List<Map<String,String>> wiki=await searchWikiSmart(q);
            List<Map<String,String>> points=getPointsForCore(core, needPoints);
            List<Map<String,String>> docMatches=[];
            if(myDocs.isNotEmpty){
              String lc=core.toLowerCase();
              for(var d in myDocs){
                String content=(d['content']??'').toLowerCase();
                if(content.contains(lc) || lc.split(' ').any((w)=> w.length>3 && content.contains(w))){
                  String snip=(d['content']??'').toString();
                  if(snip.length>200) snip=snip.substring(0,200) + '...';
                  docMatches.add({'title':d['name']??'My Doc','snip':snip,'url':'','source':'My Docs','cite':'[MyDocs]'});
                }
              }
            }
            return {'results':wiki,'points':points,'instr':instr,'core':core,'myDocs':docMatches};
          }

          Future<String> exportToPdfFile(String core, List<Map<String,String>> points, String intro) async {
            try{
              final doc=PdfDocument();
              final page=doc.pages.add();
              final font=PdfStandardFont(PdfFontFamily.helvetica, 12);
              final bold=PdfStandardFont(PdfFontFamily.helvetica, 14, style: PdfFontStyle.bold);
              String text=core.toUpperCase() + '\n\nIntroduction: ' + intro + '\n\n';
              for(int i=0;i<points.length;i++){
                text+=(i+1).toString() + '. ' + points[i]['title']! + '\nExplanation: ' + points[i]['exp']! + '\nExample: ' + points[i]['ex']! + '\n\n';
              }
              text+='Conclusion: Therefore ' + core + ' is important for Uganda.\n\nSources: MTRDF Curriculum, Wikipedia, My Docs';
              page.graphics.drawString(text, font, bounds: Rect.fromLTWH(0, 0, page.getClientSize().width, page.getClientSize().height));
              final bytes=await doc.save();
              doc.dispose();
              final dir=await getTemporaryDirectory();
              final file=File(dir.path + '/MTRDF_' + core.replaceAll(' ', '_') + '.pdf');
              await file.writeAsBytes(bytes);
              return file.path;
            }catch(e){ return ''; }
          }

          void main() async { WidgetsFlutterBinding.ensureInitialized(); await Hive.initFlutter(); await Hive.openBox('mtrdf_v14'); runApp(App()); }
          class App extends StatelessWidget { @override Widget build(BuildContext c){ return MaterialApp(debugShowCheckedModeBanner:false, home:Tabs()); } }
          class Tabs extends StatefulWidget { @override State<Tabs> createState()=>_TabsS(); }
          class _TabsS extends State<Tabs> {
            int i=0;
            final pages=[Home(),DocsPage(),ResearchPro(),OnlinePro()];
            @override Widget build(BuildContext c){ return Scaffold(body: pages[i], bottomNavigationBar: BottomNavigationBar(type: BottomNavigationBarType.fixed, currentIndex: i, selectedItemColor: Colors.deepPurple, onTap: (x){ setState((){ i=x; }); }, items: [BottomNavigationBarItem(icon:Icon(Icons.school),label:'Subjects'), BottomNavigationBarItem(icon:Icon(Icons.folder),label:'My Docs'), BottomNavigationBarItem(icon:Icon(Icons.biotech),label:'Research PRO'), BottomNavigationBarItem(icon:Icon(Icons.public),label:'Online AI')])); }
          }
          class Home extends StatelessWidget {
            @override Widget build(BuildContext c){
              final subs=['Mathematics','Biology','Chemistry','Physics','History','Geography','English','Agriculture'];
              return Scaffold(appBar: AppBar(title:Text('MTRDF V14.30 100+ TOPICS'),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white), body: ListView.builder(padding:EdgeInsets.all(12),itemCount:subs.length,itemBuilder:(_,j){ return Card(child:ListTile(title:Text(subs[j]),subtitle:Text('ChatGPT format: 10-20 points + PDF export + My Docs'),onTap:()=>Navigator.push(c,MaterialPageRoute(builder:(_)=>ChatPage(subject:subs[j]))))); }));
            }
          }
          class DocsPage extends StatefulWidget { @override State<DocsPage> createState()=>_DocsS(); }
          class _DocsS extends State<DocsPage> {
            List<Map<String,String>> docs=[];
            @override void initState(){ super.initState(); ld(); }
            Future<void> ld() async { final p=await SharedPreferences.getInstance(); String? s=p.getString('mtrdf_docs_v10'); if(s!=null){ setState((){ docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))); }); } }
            Future<void> sv() async { final p=await SharedPreferences.getInstance(); p.setString('mtrdf_docs_v10',jsonEncode(docs)); }
            Future<void> pk() async { try{ FilePickerResult? r=await FilePicker.platform.pickFiles(type:FileType.custom,allowedExtensions:['docx','pdf'],withData:true); if(r!=null&&r.files.first.bytes!=null){ String n=r.files.first.name; List<int> by=r.files.first.bytes!.toList(); String t=n.toLowerCase().endsWith('.pdf')?extractPdf(by):extractDocx(by); setState((){ docs.add({'name':n,'content':t}); }); sv(); } }catch(e){} }
            @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title:Text('My Docs ' + docs.length.toString() + ' - Source for AI'),backgroundColor:Colors.green,foregroundColor:Colors.white), body: docs.isEmpty?Center(child:Text('Upload your class notes PDF/DOCX - AI will use them as source like ChatGPT')):ListView.builder(padding:EdgeInsets.all(12),itemCount:docs.length,itemBuilder:(_,j){ return Card(child:ListTile(title:Text(docs[j]['name']??''),subtitle:Text((docs[j]['content']??'').toString().substring(0, (docs[j]['content']??'').length>100?100:(docs[j]['content']??'').length), style: TextStyle(fontSize:11)))); }), floatingActionButton: FloatingActionButton(onPressed:pk,child:Icon(Icons.add))); }
          }
          class ResearchPro extends StatefulWidget { const ResearchPro({super.key}); @override State<ResearchPro> createState()=>_ResPro(); }
          class _ResPro extends State<ResearchPro> {
            final ctrl=TextEditingController(text:'Give me 10 points well explained with examples for importance of tourism in Uganda for S2 according to UNEB');
            bool searching=false;
            Map<String,dynamic> data={};
            int tab=0;
            List<Map<String,String>> myDocs=[];
            @override void initState(){ super.initState(); loadDocs(); Future.delayed(Duration(milliseconds:400),(){ doSearch(ctrl.text); }); }
            Future<void> loadDocs() async { final p=await SharedPreferences.getInstance(); String? s=p.getString('mtrdf_docs_v10'); if(s!=null){ myDocs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e))); } }
            Future<void> doSearch(String q) async { if(q.trim().isEmpty) return; setState((){ searching=true; }); await loadDocs(); var r=await deepResearchFormatted(q,'Geography',myDocs); setState((){ data=r; searching=false; tab=0; }); }
            @override Widget build(BuildContext c){
              List<Map<String,String>> points=(data['points'] as List?)?.cast<Map<String,String>>()??[];
              Map<String,dynamic> instr=data['instr']??{};
              List<Map<String,String>> wiki=(data['results'] as List?)?.cast<Map<String,String>>()??[];
              List<Map<String,String>> myDocMatches=(data['myDocs'] as List?)?.cast<Map<String,String>>()??[];
              bool isTable=instr['table']??false;
              String intro=wiki.isNotEmpty?wiki[0]['snip']??'Important in Uganda curriculum': 'Important in Uganda curriculum';
              String shareText='';
              if(points.isNotEmpty){
                shareText=(instr['core']??'Topic').toString().toUpperCase() + '\n\nIntroduction: ' + intro + '\n\n';
                for(int i=0;i<points.length;i++){ shareText+=(i+1).toString() + '. ' + points[i]['title']! + '\n Explanation: ' + points[i]['exp']! + '\n Example: ' + points[i]['ex']! + '\n\n'; }
              }
              return Scaffold(
                appBar: AppBar(title:Text('Research PRO V14.30'),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white, actions:[
                  IconButton(icon:Icon(Icons.picture_as_pdf), onPressed:() async { if(points.isEmpty) return; String path=await exportToPdfFile(instr['core']??'topic', points, intro); if(path.isNotEmpty){ Share.shareXFiles([XFile(path)], text: shareText); } }),
                  IconButton(icon:Icon(Icons.share), onPressed:(){ if(shareText.isNotEmpty) Share.share(shareText); })
                ]),
                body: Column(children:[
                  Padding(padding:EdgeInsets.all(8), child: Column(children:[
                    TextField(controller: ctrl, maxLines: 2, decoration: InputDecoration(hintText: 'e.g. Give me 10 points well explained...', border: OutlineInputBorder(), prefixIcon: Icon(Icons.auto_awesome), suffixIcon: IconButton(icon: Icon(Icons.send), onPressed: (){ doSearch(ctrl.text); })), onSubmitted: (v){ doSearch(v); }),
                    SizedBox(height:6),
                    SingleChildScrollView(scrollDirection: Axis.horizontal, child: Row(children:[
                      ActionChip(label: Text('10 points + examples'), onPressed: (){ ctrl.text='Give me 10 points well explained with examples for ' + extractCoreTopic(ctrl.text); doSearch(ctrl.text); }),
                      SizedBox(width:4),
                      ActionChip(label: Text('20 points'), onPressed: (){ ctrl.text='Give me 20 points well explained with examples for ' + extractCoreTopic(ctrl.text); doSearch(ctrl.text); }),
                      SizedBox(width:4),
                      ActionChip(label: Text('Table'), onPressed: (){ ctrl.text=ctrl.text + ' in table format'; doSearch(ctrl.text); }),
                      SizedBox(width:4),
                      ActionChip(label: Text('Export PDF'), onPressed: () async { if(points.isEmpty) return; String path=await exportToPdfFile(instr['core']??'topic', points, intro); if(path.isNotEmpty) Share.shareXFiles([XFile(path)]); }),
                    ]))
                  ])),
                  searching? LinearProgressIndicator() : SizedBox(),
                  Container(color:Colors.grey[100], child: Row(children:[
                    Expanded(child: InkWell(onTap:(){setState((){tab=0;});}, child: Container(padding:EdgeInsets.all(12), decoration: BoxDecoration(border: Border(bottom: BorderSide(color: tab==0?Colors.deepPurple:Colors.transparent,width:2))), child: Text('Formatted',textAlign:TextAlign.center,style:TextStyle(fontWeight: tab==0?FontWeight.bold:FontWeight.normal,fontSize:12))))),
                    Expanded(child: InkWell(onTap:(){setState((){tab=1;});}, child: Container(padding:EdgeInsets.all(12), child: Text('Sources ' + (wiki.length+myDocMatches.length).toString(),textAlign:TextAlign.center,style:TextStyle(fontSize:12))))),
                    Expanded(child: InkWell(onTap:(){setState((){tab=2;});}, child: Container(padding:EdgeInsets.all(12), child: Text('My Docs ' + myDocMatches.length.toString(),textAlign:TextAlign.center,style:TextStyle(fontSize:12))))),
                  ])),
                  Expanded(child: tab==0? (points.isEmpty? Center(child: Text('Type instruction...')) :
                    SingleChildScrollView(padding:EdgeInsets.all(12), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[
                      Card(color: Colors.deepPurple[50], child: Padding(padding: EdgeInsets.all(8), child: Text('Detected: ' + (instr['points']?.toString()??'') + ' points, ' + ((instr['examples']??false)?'with examples, ':'') + 'Level: ' + (instr['level']??'') + '\nCore: ' + (instr['core']??'') + '\nMy Docs matched: ' + myDocMatches.length.toString(), style: TextStyle(fontSize: 11)))),
                      SizedBox(height:8),
