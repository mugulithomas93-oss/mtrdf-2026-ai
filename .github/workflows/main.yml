name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APK
        run: |
          echo "=== Before Fix ==="
          ls -la
          # Fix file named main.dart2
          if [ -f main.dart2 ]; then mv main.dart2 main.dart; fi
          if [ -f "main.dart2 2" ]; then mv "main.dart2 2" main.dart; fi
          mkdir -p lib
          if [ -f main.dart ]; then cp main.dart lib/main.dart; fi
          if [ -f lib/main.dart2 ]; then mv lib/main.dart2 lib/main.dart; fi
          echo "=== After Fix ==="
          ls -la
          ls -la lib/
          cat lib/main.dart
          cat pubspec.yaml
          # Create android folder if missing
          if [ ! -d android ]; then
            # backup our good main.dart
            cp lib/main.dart /tmp/good_main.dart
            flutter create . --platforms=android --project-name mtrdf_2026_ai
            cp /tmp/good_main.dart lib/main.dart
          fi
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MTRDF-2026-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
