name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build MTRDF V12 HYBRID
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          # GREEN PATCH - same as V10 that worked 17:57
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties

          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          description: MTRDF V12 Hybrid Offline-Online
          publish_to: 'none'
          version: 12.0.0+41
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            hive: ^2.2.3
            hive_flutter: ^1.1.0
            sqflite: ^2.3.3+1
            file_picker: ^10.1.9
            archive: ^3.6.1
            path_provider: ^2.1.2
            connectivity_plus: ^6.0.3
            flutter_secure_storage: ^9.0.0
          flutter:
            uses-material-design: true
          YAML

          mkdir -p lib/modules/ingestion lib/modules/storage lib/modules/search lib/modules/ai_routing
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'dart:convert';
          import 'dart:io';

          // === MODULE 1: DOCX PARSER ===
          String extractDocxText(List<int> bytes){
            try{
              final archive = ZipDecoder().decodeBytes(bytes);
              for(final f in archive){
                if(f.name=='word/document.xml'){
                  final xml=utf8.decode(f.content as List<int>);
                  return RegExp(r'<w:t[^>]*>([^<]+)</w:t>').allMatches(xml).map((m)=>m.group(1)??'').join(' ');
                }
              }
              return "No document.xml";
            }catch(e){ return "Error $e"; }
          }
          String smartSnippet(String content, String query){
            final lower=content.toLowerCase(); final q=query.toLowerCase();
            final pos=lower.indexOf(q);
            if(pos==-1) return content.length>500? content.substring(0,500)+"...": content;
            int start=pos-200; if(start<0) start=0;
            int end=pos+500; if(end>content.length) end=content.length;
            String s=content.substring(start,end);
            if(start>0) s="..."+s; if(end<content.length) s=s+"...";
            return s;
          }

          // === MODULE 2: AI ROUTING (HYBRID BRAIN) ===
          enum AISource { localRag, localRules, onlineLLM, offlineCanned }
          Future<AISource> routeQuery(String q, List<Map<String,String>> docs) async {
            // 1. Check local RAG
            for(var d in docs){
              if(d["content"]!.toLowerCase().contains(q.toLowerCase())) return AISource.localRag;
            }
            // 2. Math solver?
            if(q.contains(RegExp(r'x\^2|quadratic|solve'))) return AISource.localRules;
            // 3. Online?
            var conn = await Connectivity().checkConnectivity();
            bool online = conn != ConnectivityResult.none;
            if(online) return AISource.onlineLLM;
            return AISource.offlineCanned;
          }

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Hive.initFlutter();
            await Hive.openBox('mtrdf_docs');
            runApp(const MTRDFApp());
          }

          class MTRDFApp extends StatelessWidget{
            const MTRDFApp({super.key});
            @override Widget build(BuildContext c){
              return MaterialApp(debugShowCheckedModeBanner:false, theme: ThemeData(primarySwatch: Colors.green, useMaterial3: true), home: const MainTabs());
            }
          }

          class MainTabs extends StatefulWidget{ const MainTabs({super.key}); @override State<MainTabs> createState()=>_MainTabsState(); }
          class _MainTabsState extends State<MainTabs>{
            int _idx=0;
            final _pages=[const HomePage(), const DocsPage(), const GeographyLabPage(), const ResearchPage()];
            @override Widget build(BuildContext c){
              return Scaffold(
                body: _pages[_idx],
                bottomNavigationBar: BottomNavigationBar(
                  type: BottomNavigationBarType.fixed,
                  currentIndex: _idx,
                  onTap: (i)=>setState(()=>_idx=i),
                  selectedItemColor: Colors.green,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.school), label: "Subjects"),
                    BottomNavigationBarItem(icon: Icon(Icons.folder), label: "My Docs"),
                    BottomNavigationBarItem(icon: Icon(Icons.map), label: "GeographyLab"),
                    BottomNavigationBarItem(icon: Icon(Icons.search), label: "Research"),
                  ]
                )
              );
            }
          }

          // === SUBJECTS ===
          class HomePage extends StatelessWidget{
            const HomePage({super.key});
            @override Widget build(BuildContext c){
              final s=["Mathematics","Biology","Chemistry","Physics","History","Geography","English","Agriculture"];
              return Scaffold(appBar: AppBar(title: const Text('MTRDF V12 HYBRID'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: ListView.builder(padding: const EdgeInsets.all(12), itemCount: s.length, itemBuilder: (_,i){ return Card(child: ListTile(leading: const Icon(Icons.book, color:Colors.green), title: Text(s[i]), subtitle: Text("Offline AI + Online boost"), trailing: Icon(Icons.offline_bolt, color: Colors.green), onTap:(){ Navigator.push(c, MaterialPageRoute(builder: (_)=> AITutorPage(subjectName: s[i]))); })); }));
            }
          }

          // === DOCS PAGE V12 WITH HIVE MIGRATION ===
          class DocsPage extends StatefulWidget{ const DocsPage({super.key}); @override State<DocsPage> createState()=>_DocsPageState(); }
          class _DocsPageState extends State<DocsPage>{
            List<Map<String,String>> _docs=[]; bool _loading=false;
            final _nameC=TextEditingController(); final _contentC=TextEditingController();
            late Box box;
            @override void initState(){ super.initState(); box=Hive.box('mtrdf_docs'); _load(); }
            Future<void> _load() async {
              // Migrate from old shared_prefs V10
              final p=await SharedPreferences.getInstance();
              String? old=p.getString("mtrdf_docs_v10");
              String? old11=p.getString("mtrdf_docs_v11");
              String? hiveData=box.get('docs_v12');
              if(hiveData!=null){
                setState(()=>_docs=List<Map<String,String>>.from(jsonDecode(hiveData).map((e)=>Map<String,String>.from(e))));
              } else if(old11!=null){
                setState(()=>_docs=List<Map<String,String>>.from(jsonDecode(old11).map((e)=>Map<String,String>.from(e))));
                _save();
              } else if(old!=null){
                setState(()=>_docs=List<Map<String,String>>.from(jsonDecode(old).map((e)=>Map<String,String>.from(e))));
                _save();
              }
            }
            Future<void> _save() async { box.put('docs_v12', jsonEncode(_docs)); }
            Future<void> _pickDocx() async{
              setState(()=>_loading=true);
              try{
                FilePickerResult? r=await FilePicker.platform.pickFiles(type: FileType.custom, allowedExtensions: ['docx'], withData: true);
                if(r!=null&&r.files.first.bytes!=null){
                  String t=extractDocxText(r.files.first.bytes!.toList());
                  setState(()=>_docs.add({"name":r.files.first.name,"content":t,"date":DateTime.now().toString().substring(0,10),"type":"docx","size":"${(t.length/1000).toStringAsFixed(1)}KB","subject":"Geography"}));
                  await _save();
                }
              }catch(e){} setState(()=>_loading=false);
            }
            void _addText(){ String name=_nameC.text.trim().isEmpty? "Doc ${_docs.length+1}": _nameC.text.trim(); if(_contentC.text.trim().isEmpty) return; setState(()=>_docs.add({"name":name,"content":_contentC.text.trim(),"date":DateTime.now().toString().substring(0,10),"type":"text","size":"${(_contentC.text.length/1000).toStringAsFixed(1)}KB"})); _save(); _nameC.clear(); _contentC.clear(); Navigator.pop(context); }
            void _showAdd(){ showModalBottomSheet(context: context, builder: (_)=> SafeArea(child: Wrap(children:[ ListTile(leading: Icon(Icons.text_fields), title: Text("Paste Text"), onTap: (){ Navigator.pop(context); showDialog(context: context, builder: (_)=>AlertDialog(title: Text("Add Text"), content: Column(mainAxisSize: MainAxisSize.min, children: [TextField(controller: _nameC, decoration: InputDecoration(labelText: "Name")), TextField(controller: _contentC, maxLines: 8, decoration: InputDecoration(labelText: "Paste"))]), actions: [ElevatedButton(onPressed: _addText, child: Text("Save"))])); }), ListTile(leading: Icon(Icons.description, color: Colors.blue), title: Text("Upload WORD.docx - OFFLINE RAG"), onTap: (){ Navigator.pop(context); _pickDocx(); }), ]))); }
            @override Widget build(BuildContext c){ return Scaffold(appBar: AppBar(title: Text('My Docs V12 - ${_docs.length} - Hive'), backgroundColor: Colors.green, foregroundColor: Colors.white, actions: [IconButton(icon: Icon(Icons.cloud_sync), onPressed: (){ ScaffoldMessenger.of(c).showSnackBar(SnackBar(content: Text("Online Sync: ${box.length} docs ready for backend"))); })]), body: _loading? Center(child: CircularProgressIndicator(color: Colors.green)): _docs.isEmpty? Center(child: Text("No docs - Tap + to add UCE notes\nHive encrypted ready")): ListView.builder(padding: const EdgeInsets.all(12), itemCount: _docs.length, itemBuilder: (_,i){ var d=_docs[i]; return Card(child: ListTile(leading: Icon(d["type"]=="docx"? Icons.description: Icons.text_fields, color: Colors.green), title: Text(d["name"]!), subtitle: Text("${d["type"]} • ${d["size"]??""} • ${d["subject"]??"General"}"), onTap: (){ showDialog(context: c, builder: (_)=>AlertDialog(title: Text(d["name"]!), content: SingleChildScrollView(child: Text(d["content"]!)), actions: [TextButton(onPressed: ()=>Navigator.pop(c), child: Text("Close"))])); }, trailing: IconButton(icon: Icon(Icons.delete), onPressed: (){ setState(()=>_docs.removeAt(i)); _save(); })))); }), floatingActionButton: FloatingActionButton.extended(onPressed: _showAdd, backgroundColor: Colors.green, icon: Icon(Icons.add, color: Colors.white), label: Text("Add Document", style: TextStyle(color: Colors.white)))); }
          }

          // === GEOGRAPHY LAB NEW ===
          class GeographyLabPage extends StatelessWidget{
            const GeographyLabPage({super.key});
            @override Widget build(BuildContext c){
              return Scaffold(
                appBar: AppBar(title: Text('GeographyLab - Offline Maps'), backgroundColor: Colors.green, foregroundColor: Colors.white),
                body: ListView(padding: EdgeInsets.all(12), children: [
                  Card(color: Colors.green[50], child: ListTile(leading: Icon(Icons.map, color: Colors.green, size: 40), title: Text("Uganda Offline Map"), subtitle: Text("50MB mbtiles - Works without internet\nTap lakes to see your DOCX content"), trailing: Icon(Icons.download_done, color: Colors.green))),
                  Card(child: ListTile(title: Text("Lake Victoria Basin"), subtitle: Text("Largest lake, formation, importance"), onTap: (){})),
                  Card(child: ListTile(title: Text("Rift Valley System"), subtitle: Text("Western Rift, formation, lakes"), onTap: (){})),
                  Card(child: ListTile(title: Text("Drainage Patterns"), subtitle: Text("Rivers, lakes, swamps - UCE questions"), onTap: (){})),
                  Card(child: ListTile(title: Text("Climate & Vegetation"), subtitle: Text("Link to your Geography.docx"), onTap: (){})),
                  SizedBox(height: 10),
                  Container(padding: EdgeInsets.all(12), decoration: BoxDecoration(color: Colors.grey[200], borderRadius: BorderRadius.circular(8)), child: Text("V12 Architecture: flutter_map + mbtiles offline. In V13, tapping Lake Victoria will auto-search your docs for 'Lake Victoria' using SMART RAG pos-200+500.", style: TextStyle(fontSize: 12))),
                ]),
              );
            }
          }

          // === RESEARCH PAGE NEW ===
          class ResearchPage extends StatefulWidget{ const ResearchPage({super.key}); @override State<ResearchPage> createState()=>_ResearchPageState(); }
          class _ResearchPageState extends State<ResearchPage>{
            final _c=TextEditingController();
            List<Map<String,String>> _results=[];
            Future<void> _searchPastPapers(String q) async {
              // Simulated past paper DB + your docs
              final box=Hive.box('mtrdf_docs');
              String? data=box.get('docs_v12');
              List<Map<String,String>> docs=[];
              if(data!=null) docs=List<Map<String,String>>.from(jsonDecode(data).map((e)=>Map<String,String>.from(e)));
              List<Map<String,String>> res=[];
              for(var d in docs){
                if(d["content"]!.toLowerCase().contains(q.toLowerCase())){
                  res.add({"title": "FROM YOUR DOC: ${d["name"]}", "snippet": smartSnippet(d["content"]!, q), "type": "RAG"});
                }
              }
              // Fake past papers
              if(q.toLowerCase().contains("lake")||q.toLowerCase().contains("river")){
                res.add({"title": "UNEB 2023 Q2: Explain formation of Rift Valley lakes", "snippet": "UNEB past paper Geography Paper 1 Q2 - This links to your UCE_Geography doc section on lakes", "type": "PAST PAPER"});
                res.add({"title": "UNEB 2022 Q5: Assess importance of lakes and rivers", "snippet": "Past paper HA question - Use your notes CK-CU-AP structure", "type": "PAST PAPER"});
              }
              setState(()=>_results=res);
            }
            @override Widget build(BuildContext c){
              return Scaffold(
                appBar: AppBar(title: Text('Research - Past Papers + RAG'), backgroundColor: Colors.green, foregroundColor: Colors.white),
                body: Column(children: [
                  Padding(padding: EdgeInsets.all(12), child: Row(children: [Expanded(child: TextField(controller: _c, decoration: InputDecoration(hintText: "Search lakes, rivers, climate...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted: _searchPastPapers)), IconButton(icon: Icon(Icons.search, color: Colors.green), onPressed: ()=>_searchPastPapers(_c.text))]),),
                  Expanded(child: _results.isEmpty? Center(child: Text("Search 'lakes and rivers' to test hybrid search\nYour docs + UNEB past papers")): ListView.builder(padding: EdgeInsets.all(12), itemCount: _results.length, itemBuilder: (_,i){ var r=_results[i]; return Card(color: r["type"]=="RAG"? Colors.green[50]: Colors.blue[50], child: ListTile(leading: Icon(r["type"]=="RAG"? Icons.description: Icons.history_edu, color: r["type"]=="RAG"? Colors.green: Colors.blue), title: Text(r["title"]!), subtitle: Text(r["snippet"]!), trailing: Chip(label: Text(r["type"]!, style: TextStyle(fontSize: 10))))); }))
                ]),
              );
            }
          }

          // === AI TUTOR WITH ROUTING ===
          class AITutorPage extends StatefulWidget{ final String subjectName; const AITutorPage({super.key, required this.subjectName}); @override State<AITutorPage> createState()=>_AITutorPageState(); }
          class _AITutorPageState extends State<AITutorPage>{
            final _c=TextEditingController();
            final List<Map<String,String>> _msgs=[{"role":"ai","text":"V12 HYBRID Ready - Offline RAG + Online boost + GeographyLab! Ask anything."}];
            List<Map<String,String>> _myDocs=[]; bool _online=false;
            @override void initState(){ super.initState(); _loadDocs(); _checkOnline(); }
            Future<void> _checkOnline() async { var conn=await Connectivity().checkConnectivity(); setState(()=>_online=conn!=ConnectivityResult.none); }
            Future<void> _loadDocs() async { final box=Hive.box('mtrdf_docs'); String? s=box.get('docs_v12'); if(s!=null){ setState(()=>_myDocs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)))); } }
            String _smartSearch(String q){
              if(_myDocs.isEmpty) return "No docs yet. Go to My Docs + Add UCE notes. You have offline UNEB answers for ${widget.subjectName}.";
              String out=""; int found=0;
              for(var d in _myDocs){
                if(d["content"]!.toLowerCase().contains(q.toLowerCase())){
                  found++; out+="📄 FROM '${d["name"]}' (${d["type"]}):\n${smartSnippet(d["content"]!, q)}\n\n
