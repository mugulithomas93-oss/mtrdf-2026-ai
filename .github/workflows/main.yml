          class ChatPage extends StatefulWidget { final String subject; const ChatPage({super.key,required this.subject}); @override State<ChatPage> createState()=>_ChatS(); }
          class _ChatS extends State<ChatPage> {
            final ctrl=TextEditingController(); List<Map<String,dynamic>> msgs=[]; bool sending=false;
            @override void initState(){ super.initState(); msgs=[{'role':'ai','points':[],'instr':{}}]; }
            Future<void> send() async { if(ctrl.text.isEmpty) return; String q=ctrl.text; setState((){ msgs.add({'role':'user','text':q}); sending=true; }); ctrl.clear(); var res=await deepResearchFormatted(q, widget.subject, [],[]); setState((){ msgs.add({'role':'ai','points':res['points'],'instr':res['instr']}); sending=false; }); }
            @override Widget build(BuildContext c){
              return Scaffold(appBar: AppBar(title:Text(widget.subject + ' V14.37'),backgroundColor:Colors.deepPurple,foregroundColor:Colors.white), body: Column(children:[Expanded(child: ListView.builder(padding:EdgeInsets.all(12),itemCount:msgs.length,itemBuilder:(_,i){ var m=msgs[i]; bool isUser=m['role']=='user'; if(isUser) return Align(alignment:Alignment.centerRight, child: Container(margin:EdgeInsets.all(6),padding:EdgeInsets.all(12),decoration:BoxDecoration(color:Colors.deepPurple,borderRadius:BorderRadius.circular(12)), child:Text(m['text']??'',style:TextStyle(color:Colors.white)))); List<Map<String,String>> points=(m['points'] as List?)?.cast<Map<String,String>>()??[]; if(points.isEmpty) return Card(child: Padding(padding:EdgeInsets.all(12), child: Text('Try: differentiate between weather and climate', style: TextStyle(fontSize:12)))); return Column(children: points.asMap().entries.map((e){ int idx=e.key; var p=e.value; return Card(child: ListTile(leading: Text((idx+1).toString()), title: Text(p['title']!, style: TextStyle(fontSize:12,fontWeight:FontWeight.bold)), subtitle: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text(p['exp']!, style: TextStyle(fontSize:11)), Text('Ex: ' + p['ex']!, style: TextStyle(fontSize:11, fontStyle: FontStyle.italic))])) ); }).toList()); })), sending? LinearProgressIndicator(): SizedBox(), Padding(padding:EdgeInsets.all(8), child: Row(children:[Expanded(child: TextField(controller:ctrl, maxLines: 3, decoration: InputDecoration(hintText: 'Give me 10 points...', border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted: (_)=>send())), IconButton(icon:Icon(Icons.send), onPressed:send)]))]));
            }
          }
