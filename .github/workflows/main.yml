name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Recreate
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          rm -rf test
      - name: Fix SDK
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          grep -q "INTERNET" android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml
      - name: Pubspec
        run: |
          cat > pubspec.yaml <<'YAML'
          name: mtrdf_2026_ai
          version: 14.33.1+92
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            file_picker: ^10.3.10
            archive: ^3.6.1
            syncfusion_flutter_pdf: ^28.2.12
            hive_flutter: ^1.1.0
            http: ^1.6.0
            share_plus: ^12.0.2
            url_launcher: ^6.3.3
            path_provider: ^2.1.2
          flutter:
            uses-material-design: true
          YAML
      - name: Write main.dart V14.33 FIXED NO DOLLAR NO XFILE
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'package:http/http.dart' as http;
          import 'package:share_plus/share_plus.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:path_provider/path_provider.dart';

          String extractDocx(List<int> b){try{final a=ZipDecoder().decodeBytes(b);for(final f in a){if(f.name=='word/document.xml'){return utf8.decode(f.content as List<int>).replaceAll(RegExp(r'<[^>]+>'),' ');}}return '';}catch(e){return '';}}
          String extractPdf(List<int> b){try{final d=PdfDocument(inputBytes:b);final t=PdfTextExtractor(d).extractText();d.dispose();return t;}catch(e){return '';}}
          String decodeHtml(String t){return t.replaceAll('&amp;','&').replaceAll('&#039;',"'").replaceAll('&quot;','"').replaceAll('&#39;',"'").replaceAll(RegExp(r'<[^>]+>'),'');}
          String fixTypos(String q){var s=q.toLowerCase();s=s.replaceAll('importantantances','importance').replaceAll('importantances','importance');return s;}
          String extractCoreTopic(String input){
            String s=fixTypos(input.toLowerCase());
            s=s.replaceAll(RegExp(r'^(give me|i need|provide|list|show me|what are|what is|tell me about|explain|define|describe|discuss|state|outline)\s+'), '');
            s=s.replaceAll(RegExp(r'\d+\s*points?.*?for\s+'), '');
            s=s.replaceAll(RegExp(r'\d+\s*importances?\s+of\s+'), 'importance of ');
            s=s.replaceAll(RegExp(r'\d+\s*points?'), '');
            s=s.replaceAll(RegExp(r'well explained|with examples|with example|in table format|in a table|table format|detailed|elaborate|according to uneb|according to|for s\d+|for primary|uneb|exam format'), '');
            s=s.replaceAll(RegExp(r'\s+'), ' ').trim();
            if(s.startsWith('of ')) s=s.substring(3);
            if(s.isEmpty) return 'geography';
            return s;
          }

          Map<String, List<Map<String,String>>> curriculumDB={
            'importance of geography':[
              {'title':'Understanding Physical Environment','exp':'Helps understand landforms, mountains, lakes, rivers and climate.','ex':'Rwenzori Mountains, Lake Victoria Basin, Rift Valley.'},
              {'title':'Weather and Agriculture Link','exp':'Farmers need rainfall knowledge to plant.','ex':'Long rains March-May for maize.'},
              {'title':'Population and Settlement','exp':'Explains why people live in certain areas.','ex':'Dense in Buganda, Kigezi highlands fertile soils.'},
              {'title':'Natural Resources','exp':'Identifies minerals, forests, water.','ex':'Copper Kilembe, oil Albertine, Mabira forest.'},
              {'title':'Environmental Conservation','exp':'Teaches deforestation, pollution, conservation.','ex':'Bwindi gorillas, wetlands.'},
              {'title':'Map Reading Skills','exp':'Read maps, compass, GPS.','ex':'Topo maps of Kampala.'},
              {'title':'Career Opportunities','exp':'Jobs like meteorologist, surveyor, planner.','ex':'UNMA forecasters.'},
              {'title':'International Trade','exp':'Global trade, ports, routes.','ex':'Coffee via Mombasa, EAC trade.'},
              {'title':'Disaster Management','exp':'Predict floods, landslides.','ex':'Bududa landslides.'},
              {'title':'Tourism Development','exp':'Promotes attractions.','ex':'Queen Elizabeth NP, Source of Nile.'},
            ],
            'importance of tourism in uganda':[
              {'title':'Foreign Exchange Earnings','exp':'Top foreign exchange earner, brings dollars.','ex':'2023, 1.5M tourists brought 1.6B USD, more than coffee.'},
              {'title':'Employment Creation','exp':'Creates jobs for guides, hotel staff, drivers, rangers.','ex':'Over 500,000 Ugandans employed.'},
              {'title':'Infrastructure Development','exp':'Leads to roads, airports, hotels in remote areas.','ex':'Upgraded roads to Bwindi, Kihihi airstrip.'},
              {'title':'Conservation of Wildlife','exp':'Revenue funds protection of endangered species.','ex':'Gorilla trekking 800 USD per permit funds Bwindi rangers.'},
              {'title':'Cultural Preservation','exp':'Promotes traditional dances, crafts, kingdoms.','ex':'Ndere Centre, Kasubi tombs.'},
              {'title':'Market for Local Products','exp':'Tourists buy crafts, coffee, artworks.','ex':'Banana fibre crafts Buhoma.'},
              {'title':'Government Revenue','exp':'Taxes, park entry fees, licenses.','ex':'UWA collects fees for national budget.'},
              {'title':'International Relations','exp':'Improves Uganda image as Pearl of Africa.','ex':'Visit Uganda campaigns.'},
              {'title':'Education and Research','exp':'Sites used for study tours.','ex':'Makerere research Kibale.'},
              {'title':'Development of Remote Areas','exp':'Brings development to rural areas.','ex':'Bwindi area now has schools, clinics.'},
              {'title':'Diversification of Economy','exp':'Reduces over-dependence on agriculture.','ex':'Tourism contributes 7.7 percent to GDP.'},
              {'title':'Promotion of Peace','exp':'Peaceful environment needed.','ex':'Peace in north allowed Kidepo tourism.'},
            ],
            'location of lake victoria':[
              {'title':'Geographical Position','exp':'East Africa, south of Equator, 1S, 33E.','ex':'Lies across equator.'},
              {'title':'Countries Sharing','exp':'Tanzania 49 percent, Uganda 45 percent, Kenya 6 percent.','ex':'Uganda Kampala Entebbe Jinja.'},
              {'title':'Size','exp':'Largest in Africa, 59,947 km2, 359km long.','ex':'Bigger than Rwanda and Burundi.'},
              {'title':'Source of Nile','exp':'White Nile starts at Jinja, Speke 1858.','ex':'Ripon Falls, Owen Falls Dam.'},
              {'title':'Economic Importance','exp':'Fishing, transport, hydro power.','ex':'Nile perch, MV Kalangala ferry.'},
              {'title':'Islands','exp':'84 plus islands, Ssese Islands.','ex':'Bugala Island.'},
            ],
          };

          Map<String,dynamic> parseInstructions(String input){
            String l=input.toLowerCase();
            int points=10;
            var m=RegExp(r'(\d+)\s*points?').firstMatch(l);
            if(m!=null){ points=int.tryParse(m.group(1)!)??10; }
            if(points>20) points=20;
            bool needExamples=l.contains('example');
            bool needDetailed=l.contains('well explained')||l.contains('detailed')||l.contains('explain');
            bool needTable=l.contains('table');
            String level='S2-S4';
            if(l.contains('s1')) level='S1';
            if(l.contains('s2')) level='S2';
            if(l.contains('s3')||l.contains('s4')) level='S3-S4';
            if(l.contains('s6')) level='S6';
            bool uneb=l.contains('uneb');
            String core=extractCoreTopic(input);
            return {'points':points,'examples':needExamples,'detailed':needDetailed,'table':needTable,'level':level,'uneb':uneb,'core':core,'original':input};
          }

          List<Map<String,String>> getPointsForCore(String core, int needPoints){
            String l=core.toLowerCase();
            List<Map<String,String>> points=[];
            for(var k in curriculumDB.keys){
              if(l.contains(k)||k.contains(l)|| (l.contains('tourism')&&k.contains('tourism'))){
                points=List.from(curriculumDB[k]!);
                break;
              }
            }
            if(points.isEmpty){
              if(l.contains('tourism')) points=List.from(curriculumDB['importance of tourism in uganda']!);
              else if(l.contains('lake victoria')) points=List.from(curriculumDB['location of lake victoria']!);
              else if(l.contains('geography')) points=List.from(curriculumDB['importance of geography']!);
              else {
                points=[
                  {'title':'Definition of ' + core,'exp':'Explains meaning of ' + core + ' in Uganda curriculum.','ex':'In Uganda, ' + core + ' taught in schools.'},
                  {'title':'Economic Importance','exp':core + ' contributes to GDP.','ex':'Many earn from ' + core + '.'},
                  {'title':'Social Benefits','exp':core + ' improves community life.','ex':'Communities around Kampala benefit.'},
                  {'title':'Environmental Aspect','exp':'Relates to conservation.','ex':'Managed sustainably in national parks.'},
                  {'title':'Educational Value','exp':'Studied in schools.','ex':'S2 syllabus includes ' + core + '.'},
                  {'title':'Employment','exp':'Creates jobs.','ex':'Youth jobs linked to ' + core + '.'},
                  {'title':'Government Role','exp':'Government supports it.','ex':'Ministry policies for ' + core + '.'},
                  {'title':'Challenges','exp':'Funding, awareness challenges.','ex':'Limited infrastructure in rural areas.'},
                  {'title':'Solutions','exp':'Training, funding, sensitization.','ex':'Government programs improve ' + core + '.'},
                  {'title':'Future Prospects','exp':'Bright future with technology.','ex':'Vision 2040 includes ' + core + '.'},
                ];
              }
            }
            while(points.length<needPoints){ points.addAll(List.from(points)); }
            return points.take(needPoints).toList();
          }

          Future<List<Map<String,String>>> searchWikiSmart(String originalQ) async {
            List<Map<String,String>> r=[];
            String q=extractCoreTopic(originalQ);
            try{
              final u=Uri.parse('https://en.wikipedia.org/api/rest_v1/page/summary/' + Uri.encodeComponent(q.trim()));
              final resp=await http.get(u, headers:{'User-Agent':'MTRDF/1.0'}).timeout(Duration(seconds:8));
              if(resp.statusCode==200){
                final d=jsonDecode(resp.body);
                String ex=decodeHtml((d['extract']??'').toString());
                if(ex.length>60){ r.add({'title':(d['title']??q).toString(),'snip':ex,'url':'https://en.wikipedia.org/wiki/' + Uri.encodeComponent((d['title']??q).toString()),'source':'Wikipedia','cite':'[1]'}); }
              }
            }catch(e){}
            return r;
          }

          Future<Map<String,dynamic>> deepResearchFormatted(String q, String subject, List<Map<String,String>> myDocs, List<Map<String,dynamic>> ctx) async {
            var instr=parseInstructions(q);
            String core=instr['core'];
            if(ctx.isNotEmpty){
              String lastCore=ctx.last['core']??'';
              if(core.length<4 && lastCore.isNotEmpty){ core=lastCore; instr['core']=lastCore; }
              if(q.toLowerCase().contains('more')||q.toLowerCase().contains('continue')){ core=lastCore.isNotEmpty?lastCore:core; }
            }
            int needPoints=instr['points'];
            List<Map<String,String>> wiki=await searchWikiSmart(q);
            List<Map<String,String>> points=getPointsForCore(core, needPoints);
            List<Map<String,String>> docMatches=[];
            if(myDocs.isNotEmpty){
              String lc=core.toLowerCase();
              for(var d in myDocs){
                String content=(d['content']??'').toLowerCase();
                if(content.contains(lc) || lc.split(' ').any((w)=> w.length>3 && content.contains(w))){
                  String full=(d['content']??'').toString();
                  int pos=content.indexOf(lc);
                  if(pos==-1){ for(var w in lc.split(' ')){ if(w.length>3){ pos=content.indexOf(w); if(pos!=-1) break; } } }
                  String snip=full;
                  if(pos!=-1){
                    int start=pos-150; if(start<0) start=0;
                    int end=pos+350; if(end>full.length) end=full.length;
                    snip=full.substring(start,end);
                  } else { if(snip.length>250) snip=snip.substring(0,250) + '...'; }
                  docMatches.add({'title':d['name']??'My Doc','snip':snip,'full':full,'source':'My Docs','cite':'[MyDocs]'});
                }
              }
            }
            return {'results':wiki,'points':points,'instr':instr,'core':core,'myDocs':docMatches};
          }

          Future<String> exportToPdfFile(String core, List<Map<String,String>> points, String intro) async {
            try{
              final doc=PdfDocument();
              final page=doc.pages.add();
              final font=PdfStandardFont(PdfFontFamily.helvetica, 11);
              String text=core.toUpperCase() + '\n\nIntroduction: ' + intro + '\n\n';
              for(int i=0;i<points.length;i++){ text+=(i+1).toString() + '. ' + points[i]['title']! + '\nExplanation: ' + points[i]['exp']! + '\nExample: ' + points[i]['ex']! + '\n\n'; }
              text+='Conclusion: Therefore ' + core + ' is important.\n\nSources: MTRDF Curriculum, Wikipedia, My Docs';
              page.graphics.drawString(text, font, bounds: Rect.fromLTWH(0, 0, page.getClientSize().width, page.getClientSize().height));
              final bytes=await doc.save();
              doc.dispose();
              final dir=await getTemporaryDirectory();
              final file=File(dir.path + '/MTRDF_' + core.replaceAll(' ', '_') + '.pdf');
              await file.writeAsBytes(bytes);
              return file.path;
            }catch(e){ return ''; }
          }

          void main() async { WidgetsFlutterBinding.ensureInitialized(); await Hive.initFlutter(); await Hive.openBox('mtrdf_v14'); runApp(App()); }
          class App extends StatelessWidget { @override Widget build(BuildContext c){ return MaterialApp(debugShowCheckedModeBanner:false, home:Tabs(), theme: ThemeData(useMaterial3: true)); } }
          class Tabs extends StatefulWidget { @override State<Tabs> createState()=>_TabsS(); }
          class _TabsS extends State<Tabs> {
            int i=0;
            final pages=[UniversalChatPage(),DocsPage(),ResearchPro(),OnlinePro(),JourneyPage()];
            @override Widget build(BuildContext c){ return Scaffold(body: pages[i], bottomNavigationBar: NavigationBar(selectedIndex: i, onDestinationSelected: (x){ setState((){ i=x; }); }, destinations: [NavigationDestination(icon: Icon(Icons.chat_bubble), label: 'Chat'), NavigationDestination(icon: Icon(Icons.folder), label: 'My Docs'), NavigationDestination(icon: Icon(Icons.biotech), label: 'Research'), NavigationDestination(icon: Icon(Icons.public), label: 'Online'), NavigationDestination(icon: Icon(Icons.timeline), label: 'Journey')])); }
          }

          class UniversalChatPage extends StatefulWidget { @override State<UniversalChatPage> createState()=>_UniS(); }
          class _UniS extends State<UniversalChatPage> {
            final ctrl=TextEditingController();
            List<Map<String,dynamic>> messages=[];
            List<Map<String,dynamic>> conversations=[];
            List<Map<String,String>> myDocs=[];
            bool sending=false;
            bool offlineMode=true;
            int currentConvIndex=-1;

            @override void initState(){ super.initState(); loadAll(); }
            Future<void> loadAll() async {
              final p=await SharedPreferences.getInstance();
              String? conv=p.getString('mtrdf_conversations_v14');
              if(conv!=null){ conversations=List<Map<String,dynamic>>.from(jsonDecode(conv).map((e)=>Map<String,dynamic>.from(e))); }
              String? docs=p.getString('mtrdf_docs_v10');
              if(docs!=null){ myDocs=List<Map<String,String>>.from(jsonDecode(docs).map((e)=>Map<String,String>.from(e))); }
              if(conversations.isEmpty){ startNewChat(); } else { loadConversation(0); }
            }
            Future<void> saveConversations() async { final p=await SharedPreferences.getInstance(); p.setString('mtrdf_conversations_v14', jsonEncode(conversations)); }
            void startNewChat(){ setState((){ messages=[{'role':'ai','text':'Hello Thomas! I am MTRDF AI. Knowledge Faith Transformation.\n\nWhat can I help you with?\n- Learn: Explain any topic\n- Research: Search with sources\n- Work with files: Upload and analyze\n- Create: Images and documents\n\nAsk anything, like ChatGPT but for Uganda curriculum.','isWelcome':true}]; currentConvIndex=-1; }); }
            void loadConversation(int idx){ if(idx<0||idx>=conversations.length) return; setState((){ currentConvIndex=idx; messages=List<Map<String,dynamic>>.from(conversations[idx]['messages'].map((e)=>Map<String,dynamic>.from(e))); }); }

            Future<void> sendMessage({String? overrideText}) async {
              String q=overrideText??ctrl.text.trim();
              if(q.isEmpty) return;
              setState((){ messages.add({'role':'user','text':q}); sending=true; });
              ctrl.clear();
              List<Map<String,dynamic>> ctx=[];
              for(var m in messages){ if(m['core']!=null) ctx.add({'core':m['core'],'text':m['text']??''}); }
              var res=await deepResearchFormatted(q, 'General', myDocs, ctx);
              String core=res['core'];
              List<Map<String,String>> points=res['points'];
              List<Map<String,String>> wiki=res['results'];
              List<Map<String,String>> docMatches=res['myDocs'];
              String intro=wiki.isNotEmpty?wiki[0]['snip']??'':'Important in Uganda curriculum';
              String aiText='';
              var instr=res['instr'];
              if(instr['points']>1){
                aiText=(instr['core']??'TOPIC').toString().toUpperCase() + ' (' + (instr['level']??'') + ')\n\nIntroduction: ' + intro + '\n\nHere are ' + instr['points'].toString() + ' points well explained with examples:\n\n';
                for(int i=0;i<points.length;i++){ aiText+=(i+1).toString() + '. ' + points[i]['title']!.toUpperCase() + '\nExplanation: ' + points[i]['exp']! + '\nExample: ' + points[i]['ex']! + '\n\n'; }
                aiText+='Conclusion: Therefore ' + core + ' is important for Uganda.\n';
              } else {
                aiText='I understand you asked about ' + core + '.\n\n' + intro + '\n\n' + (points.isNotEmpty? points[0]['exp']! + ' Example: ' + points[0]['ex']! : 'This is important for Uganda curriculum.') + '\n\nSources: ' + (wiki.isNotEmpty?'Wikipedia [1] ':'') + (docMatches.isNotEmpty?'My Docs [MyDocs] ':'') + 'Curriculum [C]';
              }
              setState((){ messages.add({'role':'ai','text':aiText,'core':core,'points':points,'intro':intro,'wiki':wiki,'myDocs':docMatches,'instr':instr}); sending=false; });
              if(currentConvIndex==-1){
                conversations.insert(0,{'title': q.length>40?q.substring(0,40)+'...':q,'messages':messages,'date':DateTime.now().toIso8601String()});
                currentConvIndex=0;
              } else {
                conversations[currentConvIndex]['messages']=messages;
                conversations[currentConvIndex]['date']=DateTime.now().toIso8601String();
              }
              saveConversations();
            }

            Widget highlightText(String text, String keyword){
              if(keyword.isEmpty||text.isEmpty) return Text(text, style: TextStyle(fontSize:13));
              String lc=text.toLowerCase();
              String lck=keyword.toLowerCase();
              int idx=lc.indexOf(lck);
              if(idx==-1){
                for(var w in lck.split(' ')){ if(w.length>3){ idx=lc.indexOf(w); if(idx!=-1){ keyword=w; break; } } }
              }
              if(idx==-1) return Text(text, style: TextStyle(fontSize:13));
              return RichText(text: TextSpan(children:[
                TextSpan(text: text.substring(0,idx), style: TextStyle(color: Colors.black87, fontSize:13)),
                TextSpan(text: text.substring(idx, idx+keyword.length), style: TextStyle(backgroundColor: Colors.yellow, color: Colors.black, fontWeight: FontWeight.bold, fontSize:13)),
                TextSpan(text: text.substring(idx+keyword.length), style: TextStyle(color: Colors.black87, fontSize:13)),
              ]));
            }

            @override Widget build(BuildContext c){
              return Scaffold(
                appBar: AppBar(title: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text('MTRDF AI', style: TextStyle(fontWeight: FontWeight.bold, fontSize:16)), Text('Knowledge Faith Transformation', style: TextStyle(fontSize:10))]), backgroundColor: Colors.deepPurple, foregroundColor: Colors.white, actions:[IconButton(icon: Icon(Icons.add), onPressed: (){ startNewChat(); })]),
                drawer: Drawer(child: Column(children:[
                  DrawerHeader(decoration: BoxDecoration(color: Colors.deepPurple), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text('Chat History', style: TextStyle(color: Colors.white, fontSize:18, fontWeight: FontWeight.bold)), SizedBox(height:4), Text(conversations.length.toString() + ' conversations - memory like ChatGPT', style: TextStyle(color: Colors.white70, fontSize:11)), SizedBox(height:12), ElevatedButton.icon(onPressed: (){ Navigator.pop(c); startNewChat(); }, icon: Icon(Icons.add), label: Text('New Chat'))])),
                  Expanded(child: ListView.builder(itemCount: conversations.length, itemBuilder: (_,i){ var conv=conversations[i]; return ListTile(title: Text(conv['title']??'', style: TextStyle(fontSize:12), maxLines:1, overflow: TextOverflow.ellipsis), subtitle: Text((conv['date']??'').toString().substring(0,10), style: TextStyle(fontSize:10)), onTap: (){ Navigator.pop(c); loadConversation(i); }); }))
                ])),
                body: Column(children:[
                  Container(color: Colors.grey[100], padding: EdgeInsets.all(6), child: Row(children:[
                    Chip(label: Text(offlineMode?'Offline':'Online', style: TextStyle(fontSize:10))),
                    Spacer(),
                    Text('Universal Chat - remembers context', style: TextStyle(fontSize:10)),
                  ])),
                  Expanded(child: ListView.builder(padding:EdgeInsets.all(12), itemCount: messages.length, itemBuilder: (_,i){
                    var m=messages[i];
                    bool isUser=m['role']=='user';
                    bool isWelcome=m['isWelcome']??false;
                    if(isWelcome){
                      return Card(color: Colors.deepPurple[50], child: Padding(padding:EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[
                        Text(m['text']??'', style: TextStyle(fontSize:14)),
                        SizedBox(height:12),
                        Wrap(spacing:6, children:[
                          ActionChip(label: Text('Explain Lake Victoria'), onPressed: (){ sendMessage(overrideText:'Explain location of Lake Victoria with Uganda examples'); }),
                          ActionChip(label: Text('Tourism 10 points'), onPressed: (){ sendMessage(overrideText:'Give me 10 points well explained with examples for importance of tourism in Uganda for S2 according to UNEB'); }),
                        ])
                      ])));
                    }
                    if(isUser){ return Align(alignment: Alignment.centerRight, child: Container(margin:EdgeInsets.symmetric(vertical:4), padding:EdgeInsets.all(12), decoration: BoxDecoration(color: Colors.deepPurple, borderRadius: BorderRadius.circular(16)), child: Text(m['text']??'', style: TextStyle(color: Colors.white, fontSize:14)))); }
                    List<Map<String,String>> points=(m['points'] as List?)?.cast<Map<String,String>>()??[];
                    List<Map<String,String>> myDocMatches=(m['myDocs'] as List?)?.cast<Map<String,String>>()??[];
                    bool hasPoints=points.isNotEmpty && (m['instr']?['points']??0)>1;
                    return Card(margin:EdgeInsets.symmetric(vertical:4), child: Padding(padding:EdgeInsets.all(12), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[
                      if(hasPoints) Column(crossAxisAlignment: CrossAxisAlignment.start, children:[
                        Text((m['instr']?['core']??'TOPIC').toString().toUpperCase(), style: TextStyle(fontWeight: FontWeight.bold, fontSize:13)),
                        Text('Introduction: ' + (m['intro']??''), style: TextStyle(fontSize:13)),
                        if(myDocMatches.isNotEmpty) Card(color: Colors.yellow[100], child: Padding(padding:EdgeInsets.all(8), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text('From My Docs highlighted:', style: TextStyle(fontWeight: FontWeight.bold, fontSize:11)), highlightText(myDocMatches[0]['snip']??'', m['instr']?['core']??'')]))),
                        SizedBox(height:8),
                       ...points.asMap().entries.map((e){ int idx=e.key; var p=e.value; return Padding(padding:EdgeInsets.symmetric(vertical:4), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text((idx+1).toString() + '. ' + p['title']!.toUpperCase(), style: TextStyle(fontWeight: FontWeight.bold, fontSize:12)), Text('Explanation: ' + p['exp']!, style: TextStyle(fontSize:12)), Text('Example: ' + p['ex']!, style: TextStyle(fontSize:12, fontStyle: FontStyle.italic))])); }).toList(),
                      ]) else Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text(m['text']??'', style: TextStyle(fontSize:14)), if(myDocMatches.isNotEmpty) Card(color: Colors.yellow[50], child: Padding(padding:EdgeInsets.all(8), child: highlightText(myDocMatches[0]['snip']??'', m['core']??'')))]),
                      SizedBox(height:8),
