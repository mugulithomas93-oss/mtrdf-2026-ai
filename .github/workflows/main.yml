name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build MTRDF RAG FIXED
        run: |
          flutter create . --platforms=android --project-name mtrdf_2026_ai --overwrite
          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          description: MTRDF RAG Fixed
          publish_to: 'none'
          version: 6.1.0+23
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:convert';
          import 'dart:math';
          void main(){ runApp(const MTRDFApp()); }
          class MTRDFApp extends StatelessWidget{ const MTRDFApp({super.key}); @override Widget build(BuildContext c){ return MaterialApp(debugShowCheckedModeBanner:false, home: const MainTabs()); } }
          class MainTabs extends StatefulWidget{ const MainTabs({super.key}); @override State<MainTabs> createState()=>_MainTabsState(); }
          class _MainTabsState extends State<MainTabs>{
            int _idx=0;
            final _pages=[const HomePage(), const DocsPage()];
            @override Widget build(BuildContext c){ return Scaffold(body: _pages[_idx], bottomNavigationBar: BottomNavigationBar(currentIndex: _idx, onTap: (i)=>setState(()=>_idx=i), selectedItemColor: Colors.green, items: const [BottomNavigationBarItem(icon: Icon(Icons.school), label: "Subjects"), BottomNavigationBarItem(icon: Icon(Icons.folder), label: "My Documents")])); }
          }
          class HomePage extends StatelessWidget{
            const HomePage({super.key});
            @override Widget build(BuildContext c){
              final subjects=["Mathematics","Biology","Chemistry","Physics","History","Geography","English","Agriculture"];
              return Scaffold(appBar: AppBar(title: const Text('MTRDF 2026 AI - S.4'), backgroundColor: Colors.green, foregroundColor: Colors.white, centerTitle:true), body: ListView.builder(padding: const EdgeInsets.all(12), itemCount: subjects.length, itemBuilder: (context,i){ return Card(elevation:3, child: ListTile(leading: const Icon(Icons.menu_book, color:Colors.green), title: Text(subjects[i], style: const TextStyle(fontWeight:FontWeight.bold)), subtitle: const Text("Tap for AI Tutor + Uses Your Docs"), trailing: const Icon(Icons.smart_toy, color:Colors.green), onTap:(){ Navigator.push(context, MaterialPageRoute(builder: (_)=> AITutorPage(subjectName: subjects[i]))); })); }));
            }
          }
          class DocsPage extends StatefulWidget{ const DocsPage({super.key}); @override State<DocsPage> createState()=>_DocsPageState(); }
          class _DocsPageState extends State<DocsPage>{
            List<Map<String,String>> _docs=[];
            final _nameC=TextEditingController();
            final _contentC=TextEditingController();
            @override void initState(){ super.initState(); _load(); }
            Future<void> _load() async{ final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs"); if(s!=null){ setState(()=>_docs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)))); } }
            Future<void> _save() async{ final p=await SharedPreferences.getInstance(); p.setString("mtrdf_docs", jsonEncode(_docs)); }
            void _addDoc(){
              if(_nameC.text.isEmpty||_contentC.text.isEmpty) return;
              setState(()=>_docs.add({"name":_nameC.text, "content":_contentC.text, "date":DateTime.now().toString().substring(0,10)}));
              _save(); _nameC.clear(); _contentC.clear();
              Navigator.pop(context);
              ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Document saved! AI will use it.")));
            }
            void _showAdd(){
              showDialog(context: context, builder: (_)=>AlertDialog(title: const Text("Add Document"), content: SingleChildScrollView(child: Column(mainAxisSize: MainAxisSize.min, children:[ TextField(controller: _nameC, decoration: const InputDecoration(labelText: "Doc Name e.g., History Notes")), const SizedBox(height:10), TextField(controller: _contentC, maxLines: 8, decoration: const InputDecoration(labelText: "Paste content here", border: OutlineInputBorder())) ])), actions: [TextButton(onPressed: ()=>Navigator.pop(context), child: const Text("Cancel")), ElevatedButton(onPressed: _addDoc, style: ElevatedButton.styleFrom(backgroundColor: Colors.green), child: const Text("Save", style: TextStyle(color: Colors.white)))]));
            }
            @override Widget build(BuildContext c){
              return Scaffold(appBar: AppBar(title: const Text('My Documents - RAG'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: _docs.isEmpty? const Center(child: Padding(padding: EdgeInsets.all(20), child: Text("No documents yet.\nTap + Add Document", textAlign: TextAlign.center))): ListView.builder(padding: const EdgeInsets.all(12), itemCount: _docs.length, itemBuilder: (_,i){ return Card(child: ListTile(title: Text(_docs[i]["name"]!), subtitle: Text(_docs[i]["content"]!.substring(0, _docs[i]["content"]!.length>50?50:_docs[i]["content"]!.length)), trailing: IconButton(icon: const Icon(Icons.delete), onPressed: (){ setState(()=>_docs.removeAt(i)); _save(); }))); }), floatingActionButton: FloatingActionButton.extended(onPressed: _showAdd, backgroundColor: Colors.green, icon: const Icon(Icons.add, color: Colors.white), label: const Text("Add", style: TextStyle(color: Colors.white))));
            }
          }
          class AITutorPage extends StatefulWidget{ final String subjectName; const AITutorPage({super.key, required this.subjectName}); @override State<AITutorPage> createState()=>_AITutorPageState(); }
          class _AITutorPageState extends State<AITutorPage>{
            final _c=TextEditingController();
            final List<Map<String,String>> _msgs=[{"role":"ai","text":"MTRDF RAG Ready! Upload docs in My Documents tab."}];
            List<Map<String,String>> _myDocs=[];
            @override void initState(){ super.initState(); _loadDocs(); }
            Future<void> _loadDocs() async{ final p=await SharedPreferences.getInstance(); String? s=p.getString("mtrdf_docs"); if(s!=null){ setState(()=>_myDocs=List<Map<String,String>>.from(jsonDecode(s).map((e)=>Map<String,String>.from(e)))); } }
            String _searchDocs(String q){
              if(_myDocs.isEmpty) return "";
              q=q.toLowerCase();
              List<String> hits=[];
              for(var d in _myDocs){
                if(q.split(" ").where((w)=>w.length>2).any((w)=>d["content"]!.toLowerCase().contains(w))){
                  hits.add("FROM '${d["name"]}':\n${d["content"]!.substring(0, d["content"]!.length>300?300:d["content"]!.length)}\n");
                }
              }
              if(hits.isEmpty) return "";
              return "ANSWER FROM YOUR DOCS:\n${hits.join("\n---\n")}\n\n";
            }
            String _real(String q, String sub){
              String d=_searchDocs(q);
              if(d!="") return d;
              if(q.toLowerCase().contains("photo")) return "PHOTOSYNTHESIS: 6CO2+6H2O->C6H12O6+6O2";
              return "MTRDF AI - $sub: $q - I have ${_myDocs.length} docs.";
            }
            void _send(){ if(_c.text.trim().isEmpty) return; String q=_c.text; setState((){ _msgs.add({"role":"user","text":q}); _msgs.add({"role":"ai","text":_real(q, widget.subjectName)}); }); _c.clear(); }
            @override Widget build(BuildContext context){
              return Scaffold(appBar: AppBar(title: Text('${widget.subjectName} - ${_myDocs.length} docs'), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Column(children:[Expanded(child: ListView.builder(padding: const EdgeInsets.all(12), itemCount: _msgs.length, itemBuilder: (_,i){ final m=_msgs[i]; bool u=m["role"]=="user"; return Align(alignment: u? Alignment.centerRight: Alignment.centerLeft, child: Container(margin: const EdgeInsets.symmetric(vertical:4), padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: u? Colors.green: Colors.grey[200], borderRadius: BorderRadius.circular(12)), child: Text(m["text"]!))); })), Padding(padding: const EdgeInsets.all(8), child: Row(children:[Expanded(child: TextField(controller: _c, decoration: InputDecoration(hintText: "Ask ${widget.subjectName}...", border: OutlineInputBorder(borderRadius: BorderRadius.circular(20))), onSubmitted: (_)=>_send())), const SizedBox(width:8), CircleAvatar(backgroundColor: Colors.green, child: IconButton(icon: const Icon(Icons.send, color: Colors.white), onPressed: _send))]))]));
            }
          }
          DART
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MTRDF-RAG-FIXED
          path: build/app/outputs/flutter-apk/app-release.apk
