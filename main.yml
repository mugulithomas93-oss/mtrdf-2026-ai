name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build MTRDF AI App
        run: |
          cat > pubspec.yaml << 'YAML'
          name: mtrdf_2026_ai
          description: MTRDF 2026 AI
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.2
          flutter:
            uses-material-design: true
          YAML
          flutter create. --platforms=android --project-name mtrdf_2026_ai --overwrite
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main() => runApp(const MTRDFApp());
          class MTRDFApp extends StatelessWidget {
            const MTRDFApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, title: 'MTRDF 2026 AI', home: const HomePage());
            }
          }
          class HomePage extends StatelessWidget {
            const HomePage({super.key});
            final subjects = const ["Mathematics","Biology","Chemistry","Physics","History","Geography","English","Agriculture"];
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('MTRDF 2026 AI'), backgroundColor: Colors.green, foregroundColor: Colors.white),
                body: ListView.builder(
                  padding: const EdgeInsets.all(12),
                  itemCount: subjects.length,
                  itemBuilder: (context, i) {
                    return Card(child: ListTile(title: Text(subjects[i], style: const TextStyle(fontWeight: FontWeight.bold)), trailing: const Icon(Icons.smart_toy, color: Colors.green), onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => AITutorPage(subjectName: subjects[i])))));
                  },
                ),
              );
            }
          }
          class AITutorPage extends StatefulWidget {
            final String subjectName;
            const AITutorPage({super.key, required this.subjectName});
            @override
            State<AITutorPage> createState() => _AITutorPageState();
          }
          class _AITutorPageState extends State<AITutorPage> {
            final _c = TextEditingController();
            final _msgs = <Map<String,String>>[{"role":"ai","text":"Hello! I am your MTRDF AI tutor. Ask me anything!"}];
            String _ans(String q){
              q=q.toLowerCase();
              if(q.contains("photo")) return "Photosynthesis: 6CO2+6H2O+sunlight->C6H12O6+6O2. Makes food and oxygen.";
              if(q.contains("quadratic")) return "Quadratic formula: x=[-b±√(b²-4ac)]/2a";
              if(q.contains("rift")) return "Rift Valley formed by faulting. Features: scarps, Rwenzori, lakes.";
              return "Good question! For ${widget.subjectName}, ask specific topic and I explain for UNEB.";
            }
            void _send(){
              if(_c.text.trim().isEmpty) return;
              setState((){ _msgs.add({"role":"user","text":_c.text}); _msgs.add({"role":"ai","text":_ans(_c.text)}); });
              _c.clear();
            }
            @override
            Widget build(BuildContext context){
              return Scaffold(
                appBar: AppBar(title: Text('AI - ${widget.subjectName}')),
                body: Column(children: [
                  Expanded(child: ListView.builder(padding: const EdgeInsets.all(12), itemCount: _msgs.length, itemBuilder: (_,i){
                    final m=_msgs[i]; bool u=m["role"]=="user";
                    return Align(alignment: u? Alignment.centerRight: Alignment.centerLeft, child: Container(margin: const EdgeInsets.symmetric(vertical:4), padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: u? Colors.green: Colors.grey[200], borderRadius: BorderRadius.circular(12)), child: Text(m["text"]!)));
                  })),
                  Padding(padding: const EdgeInsets.all(8), child: Row(children: [Expanded(child: TextField(controller: _c, decoration: const InputDecoration(hintText: 'Ask...', border: OutlineInputBorder()), onSubmitted: (_)=>_send())), IconButton(icon: const Icon(Icons.send), onPressed: _send)]))
                ]),
              );
            }
          }
          DART
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MTRDF-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
